[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob3"
version = "0.2.0"
description = "Build Orchestration Bot v3 - recursive build orchestration using Claude Code sub-agents"
requires-python = ">=3.11"
dependencies = [
    "claude-code-sdk>=0.0.25",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "PyMuPDF>=1.23.0",
    "PyYAML>=6.0",
]

[project.scripts]
bob3 = "bob3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
