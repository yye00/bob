[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob3"
version = "0.2.0"
description = "Build Orchestration Bot v3 - recursive build orchestration using Claude Code sub-agents"
requires-python = ">=3.11"
dependencies = [
    "claude-code-sdk>=0.0.25",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "PyMuPDF>=1.23.0",
    "PyYAML>=6.0",
    "mem0ai>=0.1.0",
    "mcp>=1.0",
    "fastembed>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "psutil>=5.9",  # used by some test_f113 tests
]

[project.scripts]
bob3 = "bob3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bob3" = ["schema.sql", "skills/**/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "strict"  # explicit @pytest.mark.asyncio required (current behavior)
testpaths = ["tests"]
