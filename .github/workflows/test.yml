name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        uv run pytest -v --tb=short --cov=bob --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run type checking with mypy
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv pip install mypy types-PyYAML
        uv run mypy bob --ignore-missing-imports || true
      continue-on-error: true

    - name: Run linting with ruff
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv pip install ruff
        uv run ruff check bob --exit-zero

  test-package-build:
    name: Test package build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: Build package
      run: python setup.py sdist bdist_wheel

    - name: Check distribution files
      run: |
        ls -lh dist/
        test -f dist/bob_framework-*.tar.gz
        test -f dist/bob_framework-*.whl

    - name: Install from wheel
      run: |
        python -m venv test_venv
        test_venv/bin/pip install dist/bob_framework-*.whl
        test_venv/bin/python -m bob.cli.main --version

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
