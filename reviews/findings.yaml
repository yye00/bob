  - reliability
  - timeout
  - process-leak
  fixed_in: pending-r7-orch-fixes
  fixed_at: '2026-04-24'
  related:
  - R5-005
  notes: 'On wait_for timeout, asyncio cancels the awaited coroutine but the inner async generator
    returned by stream_query was not always closed cleanly, so the SDK''s own query.close()
    (which terminates the claude Node.js subprocess via transport.close()) might not run.
    Fix: spawn_sub_agent now wraps the message-consume loop with an explicit try/except asyncio.CancelledError
    that emits a SECURITY warning, and a finally block that calls aclose() on the SDK stream
    so the SDK''s own cleanup runs. The wait_for handler in execute_feature also emits a SECURITY
    warning pointing operators at `pgrep -f claude`. The underlying SDK does not expose a
    richer cancel API, so this is the cleanest available recovery. Regression test in tests/test_f069_run_command.py
    (TestSubAgentTimeoutCleanup).'
