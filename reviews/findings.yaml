    the ordering is now load-bearing and tested), and a new BOB3_REGRESSION_DETECTION_ENABLED
    env var lets operators skip both snapshots entirely. README updated. Regression tests
    in tests/test_f051_regression_detection.py (TestRegressionDetectionToggle, TestDecompositionSkipsSnapshot).'
- id: R7-002
  title: unguarded fallback in _run_research crashes the orchestration loop
