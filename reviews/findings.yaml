- id: R5-007
  title: asyncio.wait_for does not kill the SDK Node.js subprocess
  pattern: cancellation propagates to coroutine but transport may leak
  files:
  - src/bob3/orchestrator/run_loop.py
  - src/bob3/orchestrator/claude_executor.py
  severity: high
  status: fixed
  tags:
