  notes: 'execute_feature called capture_pytest_snapshot twice per feature (before and after)
    directly inside the async coroutine. The helper uses synchronous subprocess.run with a
    300s timeout, which would block the asyncio event loop for the entire pytest run — preventing
    signal handling, cancellation, and any other coroutine progress. Fix: wrap both calls
    in asyncio.to_thread so the snapshot runs in a worker thread. Regression test in tests/test_f051_regression_detection.py
