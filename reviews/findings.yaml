- id: R9-010
  title: rollback_feature_cascade uses SQLite >= 3.35 RETURNING clause
  pattern: SQL feature dependency that breaks on still-supported host platforms
  files:
  - src/bob3/db.py
  - tests/test_f070_result_handler.py
  severity: medium
  status: fixed
  tags:
  - portability
  - sqlite-version
  - regression-risk
  fixed_in: pending-r9-security
  fixed_at: '2026-04-24'
  related: []
  notes: 'rollback_feature_cascade used UPDATE ... WHERE ... RETURNING id to
    capture the dependent IDs it had flipped from "ready" to "pending".
    RETURNING requires SQLite >= 3.35.0 (March 2021); Python 3.11 on Ubuntu
    20.04 still ships SQLite 3.31.1, on which the query raises
    OperationalError: near "RETURNING": syntax error. Any user on that
    platform got a crash whenever a git pre-commit hook rejected a commit
    (the hook-failure path is what calls rollback_feature_cascade). Fix:
    switched to the SELECT-then-UPDATE pattern that the rest of the codebase
    uses — SELECT the affected ids first, then issue an UPDATE keyed by id
    IN (...) — both inside the same with connect() block so the operation
    stays atomic via the transaction rollback semantics of the connect()
    context manager. Regression tests in tests/test_f070_result_handler.py
    (TestRollbackFeatureCascadeNoReturningClause) including a static check
    that the source no longer contains the substring "RETURNING".'
