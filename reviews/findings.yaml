  notes: 'When find_next_ready_feature returned None but features in ''ready'' status existed,
    run() picked the first below-threshold one and called execute_feature. The first time,
    _run_research bumped research_iterations and boosted readiness; if the boost still left
    the feature below threshold, the next iteration picked the SAME feature, this time needs_research
    returned False, and the implementation sub-agent ran — burning a refinement attempt every
    iteration until max_refinement_attempts was exhausted. Fix: after picking a below-threshold
    feature, check research_iterations > 0; if so, mark needs_human with a clear log line
    (score, threshold, iterations) and continue the loop. Regression test in tests/test_f069_run_command.py
    (TestBelowThresholdReadyFeature).'
- id: R8-001
  title: 'python: criterion open() read-mode bypass leaks secrets via /proc/self/environ'
  pattern: 'allowlist-gap: open() write-mode-only check left read-mode opens unrestricted'
  files:
  - src/bob3/enhanced_verification.py
  - src/bob3/skills/implementing-acceptance-criteria/SKILL.md
  severity: critical
  status: fixed
  tags:
  - security
  - allowlist-gap
  - secret-exfiltration
  fixed_in: pending-r8-security
  fixed_at: '2026-05-02'
  related:
  - R3-001
  - R3-002
  - R4-009
  notes: 'python: <expr> criteria allowed open(<path>) in read mode; only open(<path>, "w"|"a"|"x"|"+")
    write modes were refused. A spec like python: open("/proc/self/environ").read() would
    silently leak every env var (including ANTHROPIC_API_KEY) inherited by the criterion subprocess.
    Also bypassable via python: import builtins; builtins.open("/etc/passwd").read() because
    the builtins module was not in the banned-modules set. Fixed by (1) adding open to _PYTHON_CRITERION_BANNED_CALL_NAMES
    so any open() call (read or write, bare or attribute-form) is refused; (2) adding builtins
    to _PYTHON_CRITERION_BANNED_MODULES; (3) removing the obsolete write-mode-only branch.
    Specs that genuinely need filesystem access must use the pytest: form (pytest tmp_path
    is the right primitive). Regression tests in tests/test_f124_executable_acceptance_criteria.py:
    test_open_for_read_is_refused, test_open_proc_self_environ_is_refused, test_builtins_open_is_refused,
    test_dunder_builtins_open_is_refused, test_attribute_open_is_refused, test_bare_open_reference_is_refused.'
- id: R8-002
  title: .bob3.lock symlink attack lets two concurrent bob3 run race the DB
  pattern: flock anchor not validated as a regular file at open time
  files:
  - src/bob3/orchestrator/run_loop.py
  severity: high
  status: fixed
  tags:
  - security
  - symlink-attack
  - cli-concurrency
  - trust-boundary
  fixed_in: pending-r8-security
  fixed_at: '2026-05-02'
  related:
  - R5-002
  - R4-012
  notes: 'A sub-agent with workspace write access (cwd=workspace + permission_mode=bypassPermissions)
    could replace .bob3.lock with a symlink to /dev/null before the next bob3 run. flock on
    a non-regular fd succeeds trivially, so two concurrent bob3 run invocations would both
    pass the lock check and race on the DB. Fixed by (1) opening the lock with O_NOFOLLOW
    so symlinks raise ELOOP at open time; (2) fstat + S_ISREG check after open to refuse fifos/devices/directories;
    both surface as AlreadyRunningError with a tampering-hint message. Regression tests in
    tests/test_f069_run_command.py (TestRunLockSymlinkHardening): symlink to /dev/null, symlink
    to a real file, fifo, and the regular-file happy path.'
- id: R8-003
  title: Sub-agents can reset budget by writing to bob3.db
  pattern: in-DB cost cache trusted without comparing against in-memory expected total
  files:
  - src/bob3/orchestrator/run_loop.py
  - README.md
  severity: high
  status: fixed
  tags:
  - security
  - budget-bypass
  - trust-boundary
  - tamper-detection
  fixed_in: pending-r8-security
  fixed_at: '2026-05-02'
  related:
  - R1-003
  - R2-001
  - R6-001
  - R6-002
  notes: Sub-agents run with cwd=workspace and bypassPermissions; if bob3.db lives in the
    workspace they can UPDATE projects SET total_cost_usd = 0 to disable budget enforcement.
    The orchestrator cannot prevent the write (the trust model accepts sub-agent FS access),
    but it can detect tampering. Fixed by maintaining self._expected_total_cost in OrchestrationLoop,
    incremented in lockstep with every db.update_project_cost. When _refresh_project_cost_cache
    reloads the DB total, it compares against the expected total; if the DB total has decreased
    beyond floating-point slack, it logs a SECURITY warning and clamps the in-memory cache
    to expected_total instead of honoring the lower value. README "Security considerations"
    section recommends placing bob3.db outside the workspace via BOB3_DATABASE_PATH for hardened
    deployments. Regression tests in tests/test_f069_run_command.py (TestCostTamperDetection).
- id: R8-004
  title: memory_add has no content-size cap (OOM/disk-fill DoS)
  pattern: MCP tool accepts unbounded user input straight into the embedder
  files:
  - src/bob3/memory_mcp.py
  - src/bob3/skills/using-bob3-memory/SKILL.md
  - README.md
  severity: medium
  status: fixed
  tags:
  - security
  - dos
  - mcp-surface
  - input-validation
  fixed_in: pending-r8-security
  fixed_at: '2026-05-02'
  related:
  - R2-018
  - R5-005
  notes: 'memory_add(content="X" * 10**8, ...) would forward the whole string to the embedder
    + Qdrant, OOM-ing the embedder or filling disk. A sub-agent could also flood the index
    with many manipulative entries to poison future-search ranking. Fixed by capping content
    at MAX_MEMORY_CONTENT_BYTES (default 8000 UTF-8 bytes, configurable via BOB3_MAX_MEMORY_CONTENT_BYTES).
    Cap is on encoded bytes, not codepoints, so a 4000-codepoint string of 4-byte UTF-8 chars
    (16000 bytes) is also refused. Refusal returns {"success": False, "error": "content exceeds
    maximum length (... bytes)"} without invoking the backend. using-bob3-memory SKILL.md
    updated with the cap and a "write concise memories" anti-pattern. Regression tests in
    tests/test_f126_memory_mcp_validation.py (TestMemoryAddContentSizeCap).'
