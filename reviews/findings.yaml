  notes: 'build_sub_agent_options runs install_skills_to_workspace +
    verify_skills_integrity only when cwd is supplied. spawn_research_agent and
    handle_decomposition both omitted cwd, so a previous malicious sub-agent
    (running with bypassPermissions in the same workspace) could replace a bob3
    skill symlink with a poisoned directory and the next research/decomposer
    agent would load the poisoned skill. Fix: spawn_research_agent grew a
    workspace= parameter forwarded as cwd= to build_sub_agent_options;
    handle_decomposition grew the same param and OrchestrationLoop now passes
    self.workspace to both call sites. SECURITY TRADE-OFF: passing cwd also
    gives those sub-agents filesystem access to the workspace; documented in
    each function''s docstring. The research agent uses Perplexity MCP only
    and the decomposer is a planning-only path, so practical blast radius
    stays small while the integrity check closes the chained-attack window.
