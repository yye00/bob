- id: R9-005
  title: spawn_sub_agent leaves agent_run row at status='running' on cancellation
  pattern: terminal-status update lives outside finally; CancelledError skips it
  files:
  - src/bob3/orchestrator/claude_executor.py
  severity: high
  status: fixed
  tags:
  - state-machine
  - missing-finally
  - audit-pollution
  - cancellation-semantics
  fixed_in: pending-r9-correctness
  fixed_at: '2026-05-09'
  related:
  - R5-007
  - R7-004
  notes: 'spawn_sub_agent created the sub_agent_runs row with status=''running''
    before invoking the SDK, but ``db.update_agent_run(status=final_status)`` lived
    AFTER the try/except/finally block. When the caller wrapped this in
    asyncio.wait_for and the timeout fired, asyncio cancelled the coroutine; the
    inner ``except asyncio.CancelledError: raise`` re-raised after the finally ran
    the SDK-stream cleanup, but the post-block update_agent_run call was never
    reached. Every timeout/cancellation left a permanently-stuck ''running'' row.
    Pollutes audit queries (``query_agent_runs(status=''running'')`` reports
    zombies) and cost reporting (the row keeps cost_usd=NULL). Fixed by tracking
    ``consume_completed`` and ``cancelled`` flags across the try/except, then
    moving the ``db.update_agent_run`` call into the finally block guarded by a
    ``BaseException`` handler so it runs even on cancellation. Terminal status
    is ''completed'' on clean result, ''failed'' on result.is_error, ''interrupted''
    on cancellation. Regression tests in tests/test_f057_sub_agent_spawning.py
    (TestSpawnCancellationFinalizesAgentRun): mock query() to raise CancelledError
    mid-stream and via wait_for timeout — both must end with status=''interrupted''.'
- id: R9-006
  title: cost_at_checkpoint double-counts the just-finished feature cost
  pattern: stale belt-and-suspenders sum after invariant moved upstream
  files:
  - src/bob3/orchestrator/run_loop.py
  severity: medium
  status: fixed
  tags:
  - double-counting
  - cost-tracking
  - refactor-debt
  fixed_in: pending-r9-correctness
  fixed_at: '2026-05-09'
  related:
  - R5-010
  - R7-004
  - R8-003
  notes: '``_create_interruption_checkpoint`` computed ``cost_at_checkpoint =
    project_total + (result.total_cost_usd or 0.0)``. The +result.total_cost_usd
    term was a defensive belt-and-suspenders from when the cache could be stale;
    after the R8-003 ``_increment_expected_total_cost`` + ``_refresh_project_cost_cache``
    work, ``execute_feature`` always refreshes the cache BEFORE invoking the
    helper. So ``project_total`` already includes the just-finished feature''s
    cost, and adding ``result.total_cost_usd`` again over-reports the
    ``cost_at_checkpoint`` field by exactly the feature''s cost — leaking into
    resume-forensics dashboards. Fixed by removing the +result.total_cost_usd
    term and updating the comment to explain the post-R8-003 invariant. Regression
    test in tests/test_f070_result_handler.py (TestInterruptionCheckpointNoDoubleCount):
    pre-seeded cache=$5.00 + result.total_cost_usd=$1.50 must yield
    cost_at_checkpoint=$5.00, not $6.50.'
- id: R9-007
  title: check_parent_completion never called from orchestration loop
  pattern: db helper exists for cascade but caller never invokes it
  files:
  - src/bob3/orchestrator/run_loop.py
  severity: high
  status: fixed
  tags:
  - dead-code-tested-path
  - state-machine
  - decomposition
  - cascade-gap
  fixed_in: pending-r9-correctness
  fixed_at: '2026-05-09'
  related:
  - R1-002
  - R4-002
  notes: '``db.check_parent_completion`` auto-completes a parent feature when
    all its children are ''completed''; it was added for the F072 decomposition
    flow but no caller in run_loop.py ever invoked it. Result: after every
    child of a decomposed parent finished, the parent stayed at
    ''pending_decomposition'' forever. Worse, any sibling feature that depended
    on the parent stayed at ''pending'' forever because
    complete_feature_and_cascade only runs the cascade for the feature being
    completed (the child), not for the parent that just auto-completed.
    Fixed by adding a ``while parent_id`` walk in handle_execution_result''s
    success branch: after ``db.complete_feature_and_cascade(feature.id)``,
    call ``db.check_parent_completion(child_id)``; if it returned True, also
    run ``db.complete_feature_and_cascade(parent_id)`` to cascade ITS
    dependents, then walk up to the grandparent in case of multi-level
    decomposition. Regression tests in tests/test_f072_feature_decomposition_handling.py
    (TestParentAutoCompletionOnChildrenComplete): parent transitions to
    ''completed'' after both children complete, and a feature depending on the
    parent transitions from ''pending'' to ''ready''.'
- id: R9-008
  title: Research and decomposer sub-agents bypass verify_skills_integrity
  pattern: defense-in-depth check is conditional on a parameter that the caller
    forgot to pass
  files:
