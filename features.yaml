- key: F-R9-009
  title: C++/HIP no-stubs gate (AST bodies + link-level undefined symbols)
  tier: Core
  priority: critical
  description: 'bob''s anti-stub gate is Python-only: the `bob.ast_checks` and `bob.scaffolding_audit`
    modules gate on Python sources and `_is_stub_function` walks a Python `ast` for `pass`/`...`/`raise
    NotImplementedError`; for C++ it emits "Stub detection skipped (non-Python project)". A C++ implementer
    can therefore ship `float allreduce_bw(){ /* TODO */ return 0; }`, `void tune(){ throw std::logic_error("not
    implemented"); }`, an empty `{}` body, or `return hipSuccess;`-only bodies and pass `no_stubs` untouched.
    Add a C++/HIP stub detector with two layers. (1) Static, via the clang AST over the feature''s edit-site
    TUs: flag empty or trivial-return-only bodies (`{}`, `return {};`, `return 0/nullptr/hipSuccess;`
    with no work — CompoundStmt size / single trivial ReturnStmt or CXXThrowExpr-only), `throw std::runtime_error/logic_error("...implement...")`,
    `assert(false && "not implemented")`, `= 0;` pure-virtuals with no concrete override in the changed
    files, `#error`/`static_assert(false)` placeholders, newly-added `#if 0`/`#ifdef NEVER` blocks around
    target code, and `TODO`/`FIXME`/`stub` markers inside the edited function''s span. Cover the full
    native extension set `.cpp .cc .cxx .hpp .h .hip .cu .cuh` (the current `_search_for_function` misses
    `.cu`/`.hip`, exactly where RCCL kernels live). (2) Link-level: after the build, run `nm -uC`/`readelf
    -s` on the produced objects and libraries to enumerate undefined symbols, catching cross-TU missing
    definitions no per-TU static check can see. Feed results into the same demote-to-NH path the Python
    stub gate uses; a C++ feature passes only when its target USR resolves to a real, non-trivial definition
    that links.'
