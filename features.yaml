- key: F-R7-595
  title: pending_successor_verify — auto-defer verifier-self-extension features to the next generation
  tier: Core
  priority: high
  description: "a prior generation, v.26, v.27 all hit the same convergence floor: 3-4 features\nthat\
    \ EXTEND enhanced_verification.py itself can never close, because the\nrunning verifier cannot validate\
    \ code that modifies the very mechanism\ndoing the validation (self-reference treadmill).\n\nConcretely,\
    \ v.27 ended 81c/3f with the failed cluster:\n - d0b94fd0 (AC artifact-existence verifier — refuse\
    \ to pass AC when\n referenced files are missing)\n - d5879353 (enhanced_verification._check_criterion_with_details\
    \ MUST\n demote pure-prose AC failures to warning)\n - 899825df (Prose-AC and integration-AC demoters\
    \ MUST match structural\n prefixes at START-of-string)\n\nAll three modify enhanced_verification.py.\
    \ The running v.27 verifier\nlacks the proposed behavior, so its own behavior-ACs against the new\n\
    logic fail. v.25 and v.26 saw the same shape (80c/4f, same ID cluster).\n\nF-R7-592 ALREADY SPECCED\
    \ `pending_successor_verify` as a status — but\nno v.27 src has implemented it (`grep pending_successor_verify\n\
    a prior generation/src/` returns nothing). The feature spec existed in a prior\nsidecar but the orchestrator\
    \ never closed it because it too tripped on\nverifier self-reference. We break the loop here with\
    \ a STRUCTURAL-ONLY\nspec (per [[F-R7-593]] discipline) so the running verifier of the\ngeneration\
    \ that inherits this sidecar (v.28) can close it without\nexecuting the behavior.\n\nFix (runtime\
    \ hot-detect + status transition):\n 1. At feature-claim time (before the test-writer subagent runs),\n\
    \ the orchestrator scans the feature's acceptance_criteria for any\n AC whose body references `enhanced_verification`,\
    \ `verifier`,\n `_check_criterion`, or `_demote_` AND whose prefix is `behavior:`.\n 2. If matched,\
    \ the orchestrator updates the feature row to\n `status='pending_successor_verify'` and skips the\
    \ subagent\n dispatch. Cost: 0. The feature is excluded from `failed_count`\n and counted toward `deferred_count`\
    \ in the run summary.\n 3. On `bob spawn`, the next generation's bootstrap merger copies\n every `pending_successor_verify`\
    \ row into the child's feature\n queue with status reset to `ready`. The child's verifier now\n HAS\
    \ the prior generation's verifier-extension code already\n applied to its src tree (because v.N+1's\
    \ src is a snapshot of\n v.N's post-build state), so the behavior-ACs evaluate against\n the new logic\
    \ and pass on first attempt.\n\nSafe: only behavior-ACs against the verifier itself are deferred.\n\
    Structural/integration/file-existence ACs continue down their normal\npath. Non-verifier features\
    \ are unaffected. If the heuristic\nfalse-positives, the worst case is that a feature defers one\n\
    generation late — no closure regressions."
