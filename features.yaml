- key: F-R9-001
  title: Compilation-database ingestion for C++ brownfield survey
  tier: Core
  priority: critical
  description: 'bob''s BF-1 survey (`src/bob/brownfield/survey.py`) is hardwired to Python: `_SOURCE_EXTENSIONS
    = {''.py''}`, a `**/*.py` glob, and `_parse_python_file()` on the stdlib `ast` module. A C++ repo
    like RCCL has none of this and, worse, C++ cannot be parsed correctly without the exact per-translation-unit
    compile flags (`-I` include dirs, `-D` defines, `-std`, the hipcc/amdclang++ driver). Add a compile-commands-aware
    survey front end: when the workspace is a CMake project, run the configure step with `-DCMAKE_EXPORT_COMPILE_COMMANDS=ON`
    (falling back to `bear -- make` / `intercept-build` for non-CMake builds) to produce `compile_commands.json`,
    then drive the survey off that database''s `file`/`arguments`/`directory` entries instead of a glob.
    Each entry names exactly one translation unit and the exact flags needed to parse it; without them,
    macros and includes cannot resolve and any AST is garbage. bob must persist the per-TU flag set (and
    a flags-hash) alongside each file in `survey.db` so every downstream stage (localizer, verifier, stub-detector)
    can re-invoke clang tooling with identical flags, and must key index invalidation on `(path, sha,
    flags-hash)`. This is the foundational prerequisite on which every other C++ intelligence feature
    depends.'
