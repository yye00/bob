- key: F-R9-013
  title: 'symbol-in-binary: AC kind (nm/objdump defined-symbol check)'
  tier: Core
  priority: high
  description: 'A source-level "Function defined" check cannot prove a symbol actually made it into the
    shipped artifact with a real body that links — a header declaration or a body optimized away can pass
    a source probe yet be undefined in the library. Add a `symbol defined in binary: <lib>::<demangled-or-mangled>`
    AC kind that runs `nm -C <artifact>` / `objdump -T` / `readelf -s` on the built object or shared library
    and requires the symbol to appear as a DEFINED text symbol (type `T`/`t`), not undefined (`U`). Persist
    the command and its output as evidence. This complements the link-level layer of the no-stubs gate
    and gives RCCL features a machine-checkable guarantee that, e.g., a new `ncclAllReduce` code path
