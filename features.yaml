    \ triage.\n\nConcrete:\n 1. New module src/bob/brownfield/survey.py\n 2. On `bob init --brownfield\
    \ <path>`:\n - Walk repo (respect.gitignore +.bobignore)\n - For each source file: parse with tree-sitter\
    \ (py/js/ts/go/rust)\n - Extract definitions (class/func/method), references, imports\n - Persist\
    \ to.bob/survey.db with schema:\n symbols(id, path, kind, name, sha, lineno, parent_id)\n edges(src_id,\
    \ dst_id, kind) -- kind in {ref, import, inherits}\n file_hashes(path, sha, mtime, parsed_at)\n 3.\
    \ Compute PageRank over edges, store in symbols.pagerank\n 4. Incremental update: on `bob survey --refresh`,\
    \ re-parse only\n files whose mtime/sha changed (git status diff)\n 5. Implicit-feature scan: any\
    \ module/class with a docstring\n starting \"TODO:\" or matching r'\\b(stub|placeholder|notimpl)\\\
