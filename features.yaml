- key: F-R9-019
  title: RCCL collective-correctness AC (#wrong=0 across in-place/out-of-place cross-product)
  tier: Core
  priority: critical
  description: 'For RCCL work "the build is faster" is meaningless unless the collective is still numerically
    correct, and bob has no AC tying a perf change to correctness. RCCL can silently corrupt results at
    non-power-of-two sizes, partial last chunks, or odd rank counts while still "winning" on bandwidth.
    Add an `rccl-correct: <collective> -b <min> -e <max> -f <factor> -g <ngpus>` AC that runs the matching
    rccl-tests binary (e.g. `all_reduce_perf`) with validation enabled (`-c 1`) and parses the tabular
    `#wrong` column, requiring it to be exactly 0 for BOTH the out-of-place and in-place variants across
    the full size sweep — and across the cross-product the RCCL spec''s F-R8-002 demands: power-of-two
    AND explicit non-pow2 sizes (3MB/5MB/1GB-minus-one-elem), multiple redops via `-o`, multiple dtypes
    via `-d fp16/bf16`, and odd rank counts via `-g 6`/`-g 7` with high `-n`. Enforce anti-gaming preconditions:
    assert the run header''s reported `nRanks`/`nGpus` and `minBytes`/`maxBytes` match the AC''s demand
    so a subagent cannot pass by collapsing to a single rank or shrinking the sweep to a trivially-correct
    range; capture the float tolerance and fail on any asterisked out-of-bounds entry. The correctness
    evidence must come from a freshly executed benchmark whose command, header, and `#wrong` columns are
    stored as artifacts, so it cannot be satisfied by a frozen/cached log.'
  acceptance_criteria:
  - 'File exists: src/bob/rccl_correctness.py'
  - 'Function defined: bob.rccl_correctness.parse_wrong_column'
  - 'Function defined: bob.rccl_correctness.verify_rccl_correct'
