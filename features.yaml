    \ score-gate-loop synthesizer on the stub\n features list to fill ACs scoring >= threshold.\n 4. Concatenate\
    \ into one YAML and either print to stdout or\n write to --out path.\n 5. Print summary: extracted=N,\
    \ synthesized=N, gate_passed=N,\n gate_failed=N (each per-feature score listed).\n\nRound-trip guarantee:\
    \ emit YAML must pass `bob plan --create`\nwithout further sanitize step."
