- key: F-R9-020
  title: RCCL busbw/algbw perf-uplift gate (self-measured, noise-aware A/B)
  tier: Core
  priority: critical
  description: 'The RCCL spec''s only pass/fail bar for every performance feature is "the optimized build
    beats bob''s OWN freshly-measured baseline for this same machine/partition/protocol by a margin exceeding
    measurement noise," and it warns back-to-back runs vary up to 2x — yet bob''s vocabulary (File exists
    / Function-Class defined / pytest / integration / behavior) cannot express it, and its `regression_*`
    modules parse only pytest results. Add a `benchmark:`/`rccl-perf:` AC kind plus a busbw/algbw table
    parser and a baseline store that implements the F-R8-001 protocol: parse the rccl-tests columns (size,
    count, type, redop, root, then time/algbw/busbw/#wrong for out-of-place AND in-place); pin clocks
    with `rocm-smi --setperfdeterminism` (with readback assert) and assert partition mode via `--showcomputepartition`;
    measure the UNMODIFIED build FIRST and persist it as the baseline (never an internet/blog number as
    the denominator); run N>=10 interleaved OLD/NEW reps with identical warmup/iters (`-w 20 -n 50`);
    compute MEDIAN busbw with bootstrap 95% CIs and a per-size noise band = max(CI half-width, half-IQR).
    A "win" passes only if NEW median > OLD median, the CIs are disjoint, and the delta exceeds `max(feature
    threshold, 2x noise half-band)`, guarding against the obvious cheats (stale/absent baseline, cherry-picking
    best-of-N, changing the size range between baseline and candidate).'
