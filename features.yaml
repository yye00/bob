- key: F-R9-012
  title: 'Compile-cost build budgeting: ccache + local-GPU-arch scoping'
  tier: Core
  priority: high
  description: 'BF-8''s context-budget hook throttles the LLM, but on RCCL the expensive step is the C++/HIP
    compile, not the model: a naive build links every default GPU arch and can take tens of minutes per
    verification, and bob''s whole-repo globbing triggers unnecessary rebuilds. Add a build-budget layer
    that (a) forces a Ninja generator with `CMAKE_CXX_COMPILER_LAUNCHER=ccache` and `CMAKE_HIP_COMPILER_LAUNCHER=ccache`
    and a warm persistent ccache dir shared across features, (b) scopes GPU codegen to the box''s arch
    during iteration via `-DGPU_TARGETS=gfx942`/`gfx950` (or `-DBUILD_LOCAL_GPU_TARGET_ONLY=ON`) instead
    of all-arch fat binaries, and (c) records per-feature wall-clock and ccache hit-rate and enforces
    a real compile-time ceiling so one feature''s verification cannot blow the generation''s time budget
    on cold recompiles. Nothing in bob models compile wall-clock, ccache, ninja target selection, or GPU-arch
    scoping — the dominant cost on a C++/RCCL repo.'
