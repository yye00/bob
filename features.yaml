name: bob97
features:
- key: F-R7-400
  title: Convergence detector compares features by spec_slot, not UUID
  tier: Core
  priority: medium
  description: 'The current weekend_watchdog.sh:check_convergence shell function

    compares feature sets across generations by features.id. Feature

    IDs are minted as fresh UUIDs in every `bob init`, so the

    cross-generation set diff is always 100%.


    Add a stable `spec_slot` column to the features table populated

    from the spec key. Rewrite check_convergence to set-diff by

    spec_slot. Backfill spec_slot for existing rows by parsing the

    spec yaml and matching by name.'
  acceptance_criteria:
  - 'File exists: src/bob/spec_slot.py'
  - 'Function defined: bob.spec_slot.backfill_spec_slot'
  - 'Function defined: bob.spec_slot.check_convergence'
  - 'pytest: tests/test_spec_slot_convergence.py'
  - 'integration: bob.db'
  - 'pytest: tests/test_convergence_detector_compares_features_by_spec_slo_boundary.py — empty, zero,
    or minimum input returns a well-defined result rather than raising (boundary case)'
  - 'pytest: tests/test_convergence_detector_compares_features_by_spec_slo_error.py — invalid input raises
    ValueError and the function does not silently succeed (error path)'
- key: F-R7-401
  title: Disk-state reconciler — promote built-on-disk features without re-spawn
  tier: Core
  priority: medium
  description: 'Every generation re-runs every ready feature even when its

    acceptance-criteria artifacts already exist on disk from the

    parent generation. Add `reconcile_from_disk(project_id)` that

    evaluates each AC entry against the workspace and atomically

    promotes features whose artifacts pass in isolation.'
  acceptance_criteria:
  - 'File exists: src/bob/disk_state_reconciler.py'
  - 'Function defined: bob.disk_state_reconciler.reconcile_from_disk'
  - 'pytest: tests/test_disk_state_reconciler.py'
  - 'integration: bob.orchestrator'
  - 'pytest: tests/test_disk_state_reconciler_boundary.py — empty, zero, or minimum input returns a well-defined
    result rather than raising (boundary case)'
  - 'pytest: tests/test_disk_state_reconciler_error.py — invalid input raises ValueError and the function
    does not silently succeed (error path)'
