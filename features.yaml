- key: F-R9-005
  title: Include-graph-aware disjoint-surface gate for the coordinator
  tier: Core
  priority: high
  description: 'The coordinator serializes overlapping features using `check_disjoint()`, which detects
    overlap only when two edit-sites share the same `path` and their `[start_line,end_line]` ranges intersect.
    In C++ this misses the dominant conflict mode: two features that edit different `.cpp` files but both
    `#include` (or both modify) the same header are semantically coupled and can break each other''s compilation,
    yet bob would run them in parallel and call their surfaces disjoint. Extend the disjointness/serialization
    logic to consult the include-graph and header/impl pairing from the survey: two edit-site groups conflict
    if they touch the same header, if one edits a header the other''s TU includes, or if they touch different
    definitions of the same USR. Additionally use the per-feature blast-radius score to flag high-fan-out
    header changes (e.g. a core RCCL public header) for single-threaded execution or tighter review. This
    turns bob''s parallelism safety model from line-range-only into compilation-graph-aware.'
