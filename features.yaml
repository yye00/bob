- key: F-R7-612
  title: Extend disk_reconciler promotion to verification-fail path (companion to F-R7-598)
  tier: Core
  priority: high
  description: "F-R7-598 added disk_reconciler check BEFORE _final_exit_sweep\nflips orphan-executing\
    \ to failed. That closes the orphan path,\nnot the verification-fail path. a prior generation surfaced\
    \ 8bac0a53\n(F-R7-607 classifier-hoist): test_writer emitted 20 snapshot\ntests, sub-agent could not\
    \ satisfy them, feature exhausted 5\nretries and was marked needs_human — even though structural\n\
    AC markers were verifiably present on disk (proven by demotion\nlog entries: \"src/bob/run_loop.py\
    \ contains the literal string\n'F-R7-607'\" demoted to PASS via F-R7-589 hot-fix path).\n\nRoot cause:\
    \ verification path has multiple gates (structural,\nbehavior, integration, tests_pass). A tests_pass\
    \ FAIL with all\nother gates PASS still trips the whole-feature failure path.\nDisk reconciler runs\
    \ only at sweep time, not at verification\ntime.\n\nFix: in src/bob/run_loop.py, BEFORE the\n`mark\
    \ needs_human due to failed verification` branch (the path\nthat fired on 8bac0a53), call disk_reconciler.reconcile_from_disk\n\
    on this single feature. If all ACs satisfy on disk via the same\nlogic that bulk reconciler uses,\
    \ promote to completed and emit\n{\"event\":\"VERIFY_FAIL_DISK_PROMOTED\",\"feature_id\":...,\n \"\
    failed_gate\":\"tests_pass\",\"passed_gates\":[...]}. Otherwise\nproceed to the original needs_human\
    \ branch.\n\nGuard: only promote if (structural_count + behavior_count) > 0\nAND failed gate is tests_pass\
    \ (not all-gates-failed). This\nprevents promoting features that genuinely have no impl on\ndisk and\
    \ just happen to have lenient test demotion.\n\nWhy permanent_forward_carry: every retry-exhaustion\
    \ that\nsurfaces a fixable-by-disk-state feature wastes a feature slot\nand a /loop tick. F-R7-598\
    \ closed the orphan path; this closes\nthe symmetric verification path."
