- key: F-R9-011
  title: Scoped incremental build with compiler-warning baseline attribution
  tier: Core
  priority: medium
  description: bob has no notion of compiler warnings and, never building, no incremental-build discipline
    — the Python analog (per-feature pytest scoping to avoid running the world) has no C++ counterpart,
    and a naive full RCCL build recompiles every arch on every feature. Extend the `build:` gate to (a)
    keep a persistent build directory keyed across features so each feature triggers an INCREMENTAL `cmake
    --build`/`ninja` recompiling only the edited TUs (the analog of scoping pytest to a feature's subtree),
    building only the ninja targets that depend on the edited TUs rather than the whole tree, and (b)
    compile the feature's edited TUs with `-Wall -Wextra -Werror=return-type -Werror=uninitialized` and
    treat NEW warnings introduced on the changed files as a soft signal that demotes confidence, diffing
    against a baseline warning-set captured at bootstrap so pre-existing brownfield warnings don't scapegoat
    the current feature. This mirrors bob's `tests_pass_regression_vs_baseline` attribution but for the
    compiler diagnostic stream, and uses `ninja -d explain` to detect and warn on spurious full rebuilds
    (a common HIP depfile problem).
