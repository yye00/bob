- key: F-R9-016
  title: clang-format minimal-diff patch mode for C++
  tier: Core
  priority: high
  description: 'BF-7''s `patch_planner` emits/applies/rolls back diff-plans but is format-blind, so LLM-generated
    C++ edits reflow whitespace/braces and produce huge noisy hunks that fail review and pollute git blame
    in a repo with a strict `.clang-format`. Add a formatting-normalization stage: before diffing, run
    `clang-format` with the repo''s own `.clang-format` on both the pre-edit region and the candidate
    edit so hunks contain only semantic changes; then run `git-clang-format`/`clang-format-diff.py -p1`
    over the applied hunks to guarantee the patch is already style-clean. Add a scope-guard extension
    that rejects a diff-plan whose hunk touches lines outside the localized edit-site (reusing F-R9-004
    localization) or that reformats untouched code, and emit the normalized minimal diff into `.bob/features/<id>/diff_plan.yaml`
    so the existing reviewable-diff artifact stays the review surface. BF-7 is language-agnostic and format-blind;
    this adds the C++-specific normalization and reformat-guard.'
