    or minimum input returns a well-defined result rather than raising (boundary case)'
  - 'pytest: tests/test_turn_limit_exhaustion_is_a_completability_signal_n_error.py — invalid input raises
    ValueError and the function does not silently succeed (error path)'
- key: F-R7-650
  title: Per-run tunables MUST be honored at the spawn call site, not only defined
  tier: Core
