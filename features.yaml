- key: F-R9-003
  title: 'Header/impl pairing and #include blast-radius graph'
  tier: Core
  priority: critical
  description: C++ splits one logical symbol across a declaration in a header (`.h`/`.hpp`/`.cuh`) and
    a definition in an implementation file (`.cc`/`.cpp`/`.hip`); bob's data model has no notion of this
    — `symbols` rows hold a single `path`/`lineno` and BF-1 would treat a header and its `.cpp` as unrelated
    files. Extend the schema and survey to (1) record per symbol both `decl_path`/`decl_line` and `def_path`/`def_line`
    (from clangd's separate declaration-vs-definition locations, mirroring LSP `textDocument/declaration`
    vs `textDocument/definition`), (2) compute header<->source pairing via clangd's `switchSourceHeader`
    heuristic, and (3) build a preprocessor include-graph resolved through the `-I` paths in `compile_commands.json`,
    stored as `includes` edges. This lets bob reason about a widely-included public header (e.g. `rccl.h`)
    as a distinct, high-blast-radius surface, and expose a per-symbol blast-radius score (count of downstream
    TUs reachable through `includes`) so touching a core header is never mistaken for a local edit.
  acceptance_criteria:
