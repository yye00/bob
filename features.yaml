    \ and description before\nbob helps.\n\nAdd a CLI subcommand:\n bob extract-from-peas <peas.md> [--out\
    \ features.yaml]\n\nWhere peas.md is a markdown file structured as:\n\n  ## <feature title>\n <one-paragraph\
    \ plain-English description of what it does, why,\n where the code lives.>\n\n  ## <next feature title>\n\
    ...\n\nPipeline:\n 1. Parse markdown into per-feature blocks.\n 2. For each block, emit a stub YAML\
    \ feature with key F-R7-NNN\n (from header or auto-mint by walking existing bootstrap),\n title, tier,\
