    UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1` requiring exit 0 with an empty sanitizer report,
    and (4) runs a known-bad tripwire once at setup to confirm the harness genuinely catches an injected
    error (guards against a mis-wired always-green path). `-fno-sanitize-recover` ensures a reported error
    cannot coexist with a success exit code.'
