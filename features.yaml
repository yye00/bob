- key: F-R7-553
  title: security_scan slopsquatting check MUST whitelist locally-defined modules — generated-code local
    imports flagged as missing PyPI distributions block every feature
  tier: Core
  priority: medium
  description: "a prior generation (across 4+ features: febe266e,\nae8613d6, d8d7a948, 507728c7): every\
    \ executing feature\nhard-fails security_scan with\n`slopsquatting/high: Imported package 'spec_quality_score'\n\
    \ (distribution 'spec_quality_score') does not exist on PyPI`.\nThe `spec_quality_score` symbol is\
    \ a LOCAL module emitted by\nthe generated code tree (e.g.\n`src/bob/spec_quality_score.py`), not\
    \ a third-party PyPI\npackage. The security_scan slopsquatting heuristic doesn't\ndistinguish local-tree\
    \ modules from external imports, so every\ngenerated-code feature touching this module fails verification\n\
    and burns refinement budget cycling toward needs_human.\n\nFix at extraction (spec-over-code-fix):\
    \ security_scan\nslopsquatting check MUST consult the generated-code tree\n(e.g. `src/bob/**/*.py`)\
    \ before flagging an import as missing\nfrom PyPI. Imports whose name corresponds to a local module\n\
    file path (top-level Python file or package directory) MUST\nbe whitelisted from the PyPI-existence\
    \ check. The check\nretains its security value for genuinely-fictitious imports\nwhile no longer blocking\
