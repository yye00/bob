- key: F-R9-014
  title: Sanitizer-clean execution AC with instrumentation proof and tripwire
  tier: Core
  priority: high
  description: 'bob''s GPU anti-cheat proves a kernel launched, but there is no memory/UB safety gate
    for C++ host+HIP code — and RCCL work (custom kernels, buffer registration, XGMI ring pointer arithmetic)
    is exactly where UB and OOB writes hide. Add a `sanitizer-clean: <asan|ubsan|tsan> <ctest-regex-or-command>`
    AC that (1) builds a dedicated instrumented configuration (`-fsanitize=address,undefined -fno-sanitize-recover=all`
    for host), (2) PROVES instrumentation is actually present rather than silently dropped — assert `__SANITIZE_ADDRESS__`
