- key: F-R9-004
  title: Cross-TU coupled edit-site localization (header + definitions + overrides)
  tier: Core
  priority: high
  description: 'BF-4''s localizer (`src/bob/brownfield/localizer.py`) emits an edit-site as a single `(path,
    start_line, end_line)` block and, when `end_lineno` is absent, falls back to `start_line + 20` — a
    Python-shaped guess that is wrong for C++ and only ever names one file. For C++, changing a function
    signature almost always requires a coordinated edit in the header declaration AND every implementation/override.
    Upgrade Stage C so that, given a localized C++ symbol, it uses the clangd index to expand one logical
    change into the full set of coupled edit-sites: the declaration in the header, the definition in the
    `.cc`/`.hip`, and every overriding definition (via `overrides` edges / LSP `textDocument/implementation`),
    deriving accurate `end_line` from clang''s decl source range instead of the `+20` heuristic. Emit
    these as a linked edit-site group so the code-writing subagent is told up-front that a header plus
    N implementations must move together, preventing the classic failure of editing the `.cpp` signature
    while leaving the header declaration stale (a compile break). This becomes the C++ substrate for the
    hierarchical localizer (file -> namespace/class -> symbol -> edit-site).'
