- key: F-R7-609
  title: SWE-Bench cheap wins — repo tree, failing-test-first, adaptive edit mode, mutation-pass check
  tier: Core
  priority: high
  description: "Four leaderboard-validated brownfield prompt/edit directives\nthat cost <5% complexity\
    \ and add measurable accuracy. Synthesis\nfrom Anthropic's SWE-Bench scaffold (Sonnet 4.5 77.2%, high-comp\n\
    82.0%), Agentless 1.5 (50.8%), SWE-Edit (NeurIPS 2025,\n+2.1% / -17.9% cost), and ICSE 2026 false-pass\
    \ study (12-22%).\n\n(A) Repo tree in worker system prompt\n - Cheapest localization lift on Verified\
    \ — addresses the #1\n failure mode \"right file wrong abstraction\" + the secondary\n \"wrong file\"\
    \ mode.\n - In src/bob/dispatch.py, before spawning a worker:\n tree -L 3 -I '.git|.venv|node_modules|__pycache__'\
    \ <workspace>\n Cap at 200 lines; truncate with \"… (N more)\".\n Prepend to WORKER.md from F-R7-608.\n\
    \n(B) \"Write a failing repro test first\" directive\n - Anthropic's own +pp prompt addendum: before\
    \ editing,\n worker writes a failing test that captures the bug/missing\n behavior, runs it to confirm\
    \ RED, then edits, then runs\n again to confirm GREEN.\n - Implement: add to WORKER.md system block\
    \ a STANDING\n DIRECTIVE section with this text verbatim. Toggleable via\n feature.skip_repro_test:\
    \ true for AC-kind=structural.\n\n(C) Adaptive edit mode\n - SWE-Edit: string-replace as default;\
    \ switch to whole-file\n rewrite when edit-site count > 3 OR span > 40 lines.\n - In src/bob/dispatch.py\
    \ edit dispatch, compute\n edit_site_count and edit_span from F-R7-600 localizer\n output; pick mode;\
    \ record choice as\n {\"event\":\"EDIT_MODE\",\"mode\":\"replace|rewrite\",\n \"sites\":N,\"span\"\
    :L}.\n\n(D) Mutation-pass check (don't trust own pass)\n - ICSE 2026: 12-22% of \"passing\" patches\
    \ are logically wrong\n — they pass because tests under-specify.\n - After worker reports test-pass,\
    \ flip one constant or\n negate one boolean in the edited region; re-run target\n test. If test still\
    \ passes, mark feature with\n {\"event\":\"WEAK_TEST_DETECTED\",\"feature_id\":...} and\n require\
    \ a stronger AC.\n - Cost: 1 extra test run per feature. Worth it.\n\nAll four wired through src/bob/dispatch.py\
