- key: F-R9-021
  title: RCCL selection-log + rocprof execution proof (selection != execution)
  tier: Core
  priority: high
  description: 'RCCL behavior is governed by env knobs and tuner files that bob must both control and
    prove took effect: `NCCL_ALGO` (Ring/Tree), `NCCL_PROTO` (Simple/LL/LL128, with the LL128 data-corruption
    caveat), `NCCL_TUNER_PLUGIN` + `NCCL_TUNER_CONFIG_PATH` CSV rules, and `NCCL_DEBUG=INFO`/`NCCL_DEBUG_SUBSYS=TUNING`
    which logs the selected algo/proto. bob''s existing launch-evidence is a Python-side counter for `hipModuleLaunchKernel`;
    it does not parse selection logs or prove a distinct kernel ran. Add (a) a knob/tuner-file model so
    features can set and byte-freeze the full `RCCL_*`/`NCCL_*` env identically between OLD and NEW runs
    (required by the perf gate), (b) an `NCCL_DEBUG` selection-log parser to confirm the intended algorithm/protocol
    was actually chosen at the target sizes and that `TUNER: Initializing tuner...` appeared (proving
    the plugin loaded), and (c) a `rocprof` kernel-name-trace verifier that proves a DISTINCT new kernel
    symbol executed and serviced the benchmarked bytes with the gate ON, plus a gate-off/gate-on differential
    so a claimed win that is present with the gate OFF fails the feature. This is the RCCL analog of bob''s
    launch-evidence, but log/trace-based instead of a source counter.'
