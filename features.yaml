- key: F-R9-024
  title: rocprof-compute roofline/SOL-guided kernel optimization loop
  tier: Core
  priority: high
  description: 'bob has no structured GPU-kernel optimization methodology: a perf feature today is a blind
    edit-and-benchmark with no bottleneck classification, so a subagent wastes effort tuning compute on
    a memory-bound kernel (or vice-versa). Adopt the converged 2026 SOTA loop (KernelAgent/KernelPro;
    NVIDIA''s perf-nsight-compute-analysis skill) but on the AMD stack: a profile -> diagnose-bottleneck
    -> targeted-tune -> re-benchmark loop driven by `rocprof-compute` (formerly Omniperf), the AMD analog
    of Nsight Compute, which uniquely provides Speed-of-Light (SOL%) and hierarchical roofline analysis
    on MI200+ (MI300/MI355 supported). Each optimization iteration MUST: (1) run `rocprof-compute profile`
    then `analyze` (or `--roof-only` for a standalone roofline) on the target HIP kernel to capture SOL%
    per hardware block and the kernel''s position on the roofline; (2) classify the dominant bottleneck
    (memory-bound vs compute-bound vs latency/occupancy) from arithmetic intensity relative to the ridge
    point; (3) apply ONLY optimizations relevant to that bottleneck class (the KernelPro insight — do
    not dump raw counters into the prompt and hope; SEPARATE telemetry-interpretation, a rule-governed
    step, from code generation, a creative step); (4) re-profile and keep the change only if the core
    metric (kernel latency / achieved bandwidth) improved beyond measurement noise. Persist the rocprof-compute
    report (CSV/SQLite via rocpd on ROCm 7.0+) as verification evidence. Because ncu roofline metrics
    do NOT map to AMD (no L1/L2/HBM transaction counts via rocprof), the loop MUST use rocprof-compute''s
    native roofline, not a ported ncu-metric formula.'
  acceptance_criteria:
  - 'File exists: src/bob/rocprof_compute_roofline_loop.py'
  - 'Function defined: bob.rocprof_compute_roofline_loop.classify_bottleneck'
  - 'Function defined: bob.rocprof_compute_roofline_loop.run_optimization_iteration'
  - 'pytest: tests/test_rocprof_compute_roofline_loop.py'
  - 'integration: bob.orchestrator'
  - 'pytest: tests/test_rocprof_compute_roofline_sol_guided_kernel_optimiz_boundary.py — empty, zero,
    or minimum input returns a well-defined result rather than raising (boundary case)'
  - 'pytest: tests/test_rocprof_compute_roofline_sol_guided_kernel_optimiz_error.py — invalid input raises
    ValueError and the function does not silently succeed (error path)'
- key: F-R9-025
  title: RCCL tuning autotune-sweep discipline (tune-once/cache, config pruning, parity)
  tier: Core
  priority: medium
  description: 'RCCL performance is governed by a large discrete config space (protocols Simple/LL/LL128,
    algorithms Ring/Tree, channel/chunk counts, and the RCCL_*/NCCL_* env + tuner-CSV knobs of F-R9-021),
    and a naive sweep is both expensive and easy to game. Adopt the autotune discipline proven in NVIDIA''s
    tilegym-cutile-autotuning skill, ported to RCCL: (1) tune-once then cache — sweep the config space
    once per (collective, size-range, ngpus, arch) and persist the winning config keyed on that tuple,
    rather than re-searching every run; (2) prune the search space to a bounded set (the skill targets
    <=8 configs/arch) using arch- and size-guards so a sweep cannot blow the time budget; (3) MANDATORY
    correctness parity on every swept config — run the F-R9-019 `rccl-correct` (#wrong=0) check with tuning
    ENABLED and again with tuning DISABLED (a `DISABLE_AUTOTUNE`-equivalent baseline), so a config that
    wins on bandwidth but corrupts results is rejected; (4) A/B the tuned config against the fixed best-known/default
    via the F-R9-020 noise-aware perf gate. This makes RCCL knob-tuning systematic and cheat-resistant
    instead of a one-off manual env poke, and reuses the correctness+perf gates as the accept criteria.'
  acceptance_criteria:
  - 'File exists: src/hippy/rccl_autotune_sweep.py'
  - 'Function defined: hippy.rccl_autotune_sweep.tune_once_and_cache'
  - 'Function defined: hippy.rccl_autotune_sweep.prune_search_space'
  - 'pytest: tests/test_rccl_autotune_sweep.py'
  - 'integration: hippy.audit_exemptions'
  - 'pytest: tests/test_rccl_tuning_autotune_sweep_discipline_tune_once_ca_boundary.py — empty, zero,
    or minimum input returns a well-defined result rather than raising (boundary case)'
  - 'pytest: tests/test_rccl_tuning_autotune_sweep_discipline_tune_once_ca_error.py — invalid input raises
    ValueError and the function does not silently succeed (error path)'
