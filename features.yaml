- key: F-R9-002
  title: clangd/libclang semantic symbol index (C++ survey backend)
  tier: Core
  priority: critical
  description: BF-1 builds its symbol graph with Python `ast` and resolves edges by naive textual name-matching
    (`name_to_ids.get(base_name)`), which is meaningless for C++ where one name spans many namespaces/overloads
    and cross-TU resolution requires a real compiler front end (tree-sitter alone cannot resolve overloads,
    expand RCCL's macro/template machinery, or follow references across TUs). Add a C++ survey backend
    that drives `clangd-indexer` (or clangd over LSP, or libclang) against `compile_commands.json` to
    emit a semantic index where each symbol carries a stable clang USR/SymbolID, separate declaration
    and definition location(s), enclosing namespace/scope, and full signature. Populate bob's existing
    `survey.db` `symbols`/`edges` tables from this index instead of the ast walker, extending edge kinds
    to `calls`, `overrides`, `instantiates`, and `includes`. Because clangd resolves references by USR,
    bob finally gets true cross-TU call graphs — e.g. every caller of `ncclAllReduce` across RCCL's dozens
    of `.cc` files, which import/inherits-only textual edges can never find. Cache the index and refresh
    incrementally keyed on the `file_hashes` bob already tracks. Detect availability in preflight (clangd
    on PATH, `compile_commands.json` present) and fall back to tree-sitter-cpp when absent, keeping BF-1
    as the greenfield path.
