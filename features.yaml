  priority: critical
  description: 'For `Function defined:`/`Class defined:` ACs on C++ projects, `_search_for_function`/`_search_for_class`
    fall into an `is_cpp` branch that does `re.search(f"{name}\\(", content)` over `*.cpp`/`*.hpp`/`*.h`
    — a substring match that false-PASSES on call sites, comments, forward declarations, and unrelated
    overloads, false-FAILS on templated/namespaced/operator forms, and silently skips `.cc`/`.cxx`/`.hip`/`.cu`/`.cuh`.
    Replace it for `is_cmake_project` with a clang-tooling probe over the project''s `compile_commands.json`:
    run `clang-query -p <build> -c ''match functionDecl(hasName("ns::foo"), isDefinition(), hasBody(compoundStmt(unless(statementCountIs(0)))))''`
    (or the clangd index), and `cxxRecordDecl(isDefinition())` for classes. This proves the symbol is
    genuinely DEFINED with a non-empty body against the real preprocessed AST (handling namespaces, templates,
    macros, overloads) rather than matching source text, and distinguishes definition from declaration/call
    the way the Python `def`/`class` branch does. When clang tooling is unavailable, fail with a clear
    "clang tooling unavailable" reason (logged PASS-with-warning like the existing `FILE_EXISTS_BASENAME_FALLBACK`
    path) rather than silently degrading to the gameable regex.'
