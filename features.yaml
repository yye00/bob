    version awareness and no HIP/ROCm concept. Building RCCL from the rocm-systems monorepo requires a
    specific, compatible toolchain: hipcc/amdclang++, a minimum cmake, a pinned ROCm release, `rocminfo`/`rocm_agent_enumerator`,
    and matching hip/hsa runtime libs. Add a toolchain-preflight capability that (1) parses version/arch
    pins from the PEAS CONTEXT block (e.g. "ROCm 7.2.1", "gfx942"), (2) probes real versions via `hipcc
    --version`, `cmake --version`, `cat /opt/rocm/.info/version`, `rocminfo | grep gfx`, and compares
    them semver-style against the pin, and (3) HALTS with an operator-actionable message on mismatch instead
    of proceeding to a build that fails cryptically or links the wrong ROCm. Also probe the target arch
    (`--offload-arch=gfx942`) so an arch-mismatched build is caught at preflight, not after a 20-minute
    compile. This is the ROCm analog of the existing Python/CLI dep enumeration, with the version/arch
    dimension HIP builds fundamentally need.'
  acceptance_criteria:
