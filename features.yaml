- key: F-R7-648
  title: GPU-execution proof MUST be DISPATCH-COUPLED, not a self-reported counter — a host backend that
    bumps its own launch ledger passes every gate
  tier: Core
  priority: critical
  description: "Discovered auditing the \"completed\" hippy/hipsci build (bob95): even after the\nbackend-required\
    \ static checks (F-R7-639/640/641/643) and the namespace-collision\nfix (F-R7-644), the shipped library\
    \ computed EVERY public numpy/scipy op on the\nHOST (a pure-Python `for i in range(n): out.append(fn(...))`\
    \ loop in src/) yet\nPASSED the launch-evidence anti-cheat. Root cause: the \"real device work happened\"\
    \nproof was a FREE-FLOATING counter — a module-level `record_launch_evidence()` the\nimplementation\
    \ called ITSELF, right after finishing the host loop. The parity\noracle asserted only \"the ledger\
    \ advanced,\" which the host path satisfied by\ncalling the bump helper. The oracle-not-gameable test\
    \ even MODELLED the host cheat\nas \"never calls the bump helper,\" so a host path that DID call it\
    \ was an\nunmodelled, passing cheat. A driver spy proved it: `hippy.multiply` on 1e6\nelements made\
    \ ZERO `hipModuleLaunchKernel` / `hipMalloc` calls and returned the\ncorrect answer — GPU utilization\
    \ 0%. This is the same class as F-R7-639's fake\n`_launch_log`, but survived because the counter looked\
    \ legitimate and was wired\ninto the real oracle. The lesson generalizes to ANY substrate-proof: a\
    \ proof the\ncomponent can EMIT ABOUT ITSELF is not a proof; it must be OBSERVED at the boundary\n\
    the work must cross.\n\nFix at extraction (spec-over-code-fix; NEVER lowers a threshold — it strengthens\n\
    the gate). For a GPU/HIP (or any substrate-gated) project, the execution-evidence\nrequirement synthesized\
    \ into feature ACs MUST be DISPATCH-COUPLED:\n (1) The evidence counter MUST be advanced ONLY by a\
    \ real, successful driver\n     DISPATCH observed at the SINGLE facade every backend call passes through\
    \ — a\n     kernel launch (hipModuleLaunchKernel), graph launch (hipGraphLaunch), or\n     vendor\
    \ compute call (hipBLAS gemm / hipFFT exec / hipSOLVER / hipRAND\n     generate / hipSPARSE spmv).\
    \ The facade wraps those entry points and bumps a\n     PRIVATE counter on success. There MUST be\
    \ NO public function that host code\n     can call to advance the ledger; any legacy self-bump helper\
    \ MUST be a no-op.\n (2) A device SYNC or a bare hipMemcpy is NOT dispatch evidence (syncing/copying\n\
    \     is not compute; a host-compute-then-copy path must still fail).\n (3) The oracle-not-gameable\
    \ test MUST include, and keep passing, these cheats:\n     (i) constant stub; (ii) host compute with\
    \ no dispatch; (iii) host compute\n     that DOES call the self-bump helper — must STILL fail; (iv)\
    \ host compute that\n     makes a non-dispatch HIP call (device sync) — must STILL fail; (v) real\n\
    \     dispatch with wrong math. Correctness parity ALONE is never a pass.\n (4) Consequently EVERY\
    \ numeric op must run on the device (no host compute path):\n     an op that produces correct numbers\
    \ but triggers no real dispatch FAILS its\n     own launch-evidence assertion automatically. The ONLY\
    \ evidence-exempt case is\n     a structurally empty (size-0) result, which computes nothing on-device.\n\
    When BOB_REQUIRE_GPU_BACKEND is enabled, the verifier SHOULD additionally run a\ndriver-level dispatch\
    \ probe during the feature's own tests (wrap the facade's\ndispatch entry points, assert the count\
    \ advanced for a non-empty compute op) so a\nself-reported counter cannot satisfy the gate. Behaviour:\
    \ WHEN a compute feature's\nlaunch evidence can be advanced by host code (a callable bump helper reachable\n\
    from src/, or a counter not tied to a real dispatch) THEN the anti-cheat check\nFAILS with \"launch\
    \ evidence is not dispatch-coupled\". Boundary: harness/test-infra\nfeatures (F-R7-641 exemption)\
    \ are unaffected; with the GPU-backend requirement\ndisabled the behaviour is exactly as before, so\
    \ non-GPU projects and bob's own\nself-build are unaffected."
  acceptance_criteria:
  - 'File exists: src/hippy/dispatch_coupled_evidence.py'
  - 'Function defined: hippy.dispatch_coupled_evidence.assert_dispatch_coupled'
  - 'Function defined: hippy.dispatch_coupled_evidence.record_dispatch_on_success'
  - 'pytest: tests/test_dispatch_coupled_evidence.py'
  - 'integration: hippy.orchestrator'
  - 'pytest: tests/test_gpu_execution_proof_must_be_dispatch_coupled_not_a_boundary.py — empty, zero,
    or minimum input returns a well-defined result rather than raising (boundary case)'
  - 'pytest: tests/test_gpu_execution_proof_must_be_dispatch_coupled_not_a_error.py — invalid input raises
    ValueError and the function does not silently succeed (error path)'
  - 'Function defined: record_launch_evidence'
  permanent_forward_carry: true
- key: F-R7-649
  title: Turn-limit exhaustion is a completability signal, not a transport-transient
  tier: Core
  priority: high
  description: 'A prior generation lost days to this: when a sub-agent hits its

    max_turns budget the SDK returns a turn-limit result that surfaces

    as a nonzero exit ("Command failed with exit code 1"). The

    transport-transient classifier (F-R6-300 / startup_crash_exempt)

    matched the bare "exit code 1" / "message reader" substring and

    mis-classified turn-limit exhaustion as a free transport retry, so

    an oversized feature silently retried its full turn budget forever

    and never converged (observed: a feature spun ~3.5h emitting

    exactly N dispatches then a graceful exit-1 each attempt). Fix (bob

    CODE + forward-carry): the transport-transient regex MUST match

    ONLY genuine transport signatures (ECONNRESET, connection reset,

    self-signed certificate, ReadTimeout, broken pipe, MCP connection

    failed) and MUST NOT match a bare nonzero exit code or "message

    reader" alone. A turn-limit result must instead raise the

    completability path: charge the attempt, and if the feature keeps

    hitting the turn ceiling, route it to decomposition (F-R7 stuck

    decomposer) — NOT to infinite retry. Behaviour: WHEN a sub-agent

    result carries a turn-limit / max_turns-reached marker THEN the

    loop treats it as attempt-consuming and decomposition-eligible,

    never as a transport-transient free retry.'
  acceptance_criteria:
  - 'File exists: src/bob/turn_limit_completability.py'
  - 'Function defined: bob.turn_limit_completability.is_transport_transient'
  - 'Function defined: bob.turn_limit_completability.classify_turn_limit_result'
  - 'pytest: tests/test_turn_limit_completability.py'
  - 'integration: bob.startup_crash_exempt'
