name: bob7
version: 0.6.0
description: "Bob7 — Round 4 of the recursive bob-on-bob dark factory.\n\nBob7 = bob6 (Round-3 complete)\
  \ + Stretch tier features (~13 features)\n+ paper artifact stubs (F-153..F-156, to be finalised in Round\
  \ 5).\n\nThe Stretch tier extends the framework with property-based testing,\nBayesian calibration,\
  \ online threshold tuning, richer memory, and\ndistributed / durable orchestration.\n\nFull acceptance\
  \ criteria: TBD — synthesize via F-R1-011 (spec synthesizer)\nafter Round-3 research agents complete\
  \ their proposals.\n\nRound 5 (bob8) handles only paper artifacts: D1/D2/D3 specs (F-153),\nreference\
  \ implementations (F-154), hack-attack corpus (F-155), and\nanalysis notebooks (F-156).\n\nNamespace:\
  \ F-R4-121, F-R4-130, F-R4-131, F-R4-137, F-R4-138,\n           F-R4-140, F-R4-143, F-R4-146, F-R4-147,\
  \ F-R4-148,\n           F-R4-149, F-R4-152.\n           Paper stubs: F-R4-153..F-R4-156.\n"
workspace: /home/yelkhamr/dark-factory/bob7
features:
  F-R4-121:
    title: Property-based test generator (Hypothesis / EARS)
    description: 'Hypothesis integration that derives property tests from EARS

      unwanted-behavior clauses in the spec. Generates 100+ fuzz cases

      per run. Integrates with the differential-testing harness (F-R3-122).

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/property_based_test_generator_hypothesis_ears.py'
    - 'pytest: tests/test_property_based_test_generator_hypothesis_ears.py'
  F-R4-130:
    title: Bayesian confidence aggregator
    description: 'Combine self-reported confidence (F-R2-102), registry hit count,

      AST heuristics (stub detection, coverage), and task-class priors

      into a single calibrated probability estimate. Replaces the raw

      self-report in telemetry with a calibrated_confidence field.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/bayesian_confidence_aggregator.py'
    - 'pytest: tests/test_bayesian_confidence_aggregator.py'
  F-R4-131:
    title: Online threshold tuning
    description: 'Adjust the RCA trigger threshold and decomposition depth dynamically

      based on accumulated calibration outcomes. Uses an online learning

      algorithm (e.g., exponential moving average on ECE). Records all

      threshold changes in telemetry for reproducibility.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/online_threshold_tuning.py'
    - 'pytest: tests/test_online_threshold_tuning.py'
  F-R4-137:
    title: Memory decay and recency weighting
    description: 'Age lessons in the learning ledger over time using an exponential

      decay weight (half-life configurable via BOB3_LESSON_HALF_LIFE_DAYS,

      default 30). Separate context-memory (high decay) from long-term

      memory (low decay). Affects skill-activation scoring.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/memory_decay_and_recency_weighting.py'
    - 'pytest: tests/test_memory_decay_and_recency_weighting.py'
  F-R4-138:
    title: Workflow memory — spec-attempt-outcome traces
    description: 'Persist full spec-attempt-outcome traces (not just lessons) in a

      case-based retrieval store. When a new spec arrives, retrieve the

      k nearest past traces (cosine similarity on spec embeddings) and

      inject them as context into the planning phase.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/workflow_memory_spec_attempt_outcome_traces.py'
    - 'pytest: tests/test_workflow_memory_spec_attempt_outcome_traces.py'
  F-R4-140:
    title: Embedded reproducer per finding
    description: 'Each registry finding (bug, security issue, hack verdict) stores a

      minimal failing case: the smallest diff that reproduces the finding

      plus the fix diff. Used for test-driven regression prevention in

      future spawns.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/embedded_reproducer_per_finding.py'
    - 'pytest: tests/test_embedded_reproducer_per_finding.py'
  F-R4-143:
    title: Per-domain skill bundles (HPC, ML, PL)
    description: 'Package skills into domain bundles (hpc, ml, pl) that are swapped

      in based on spec metadata fields (domain: hpc|ml|pl|general).

      Reduces irrelevant context injection and improves skill-activation

      precision.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/per_domain_skill_bundles_hpc_ml_pl.py'
    - 'pytest: tests/test_per_domain_skill_bundles_hpc_ml_pl.py'
  F-R4-146:
    title: Durable orchestration loop (Temporal integration)
    description: 'Wrap the OrchestrationLoop in a Temporal workflow for multi-hour

      HPC verification cycles. Activities: spawn_sub_agent, run_verification,

      emit_telemetry. Provides at-least-once execution, automatic retries

      on transient failures, and a history replay for debugging.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/durable_orchestration_loop_temporal_integration.py'
    - 'pytest: tests/test_durable_orchestration_loop_temporal_integration.py'
  F-R4-147:
    title: Distributed sweep coordination
    description: 'Extend the sweep orchestrator to distribute runs across a compute

      cluster (initially: multiple machines sharing a NFS-mounted workspace).

      Uses a simple Redis-backed work queue. Coordinator emits per-node

      progress events.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/distributed_sweep_coordination.py'
    - 'pytest: tests/test_distributed_sweep_coordination.py'
  F-R4-148:
    title: Sub-spawn checkpoint granularity
    description: 'Finer-than-feature checkpoints for compile-and-verify cycles:

      checkpoint after each compiler invocation and after each test class,

      not just at feature completion. Enables resuming from mid-compile

      without re-spending the full sub-agent budget.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/sub_spawn_checkpoint_granularity.py'
    - 'pytest: tests/test_sub_spawn_checkpoint_granularity.py'
  F-R4-149:
    title: EARS frontend — compile patterns to DSL
    description: 'Compile five EARS (Easy Approach to Requirements Syntax) patterns

      (Ubiquitous, Event-driven, Unwanted behavior, State-driven, Optional)

      into bob3''s existing acceptance criterion DSL. Provides a structured

      natural-language spec authoring interface.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/ears_frontend_compile_patterns_to_dsl.py'
    - 'pytest: tests/test_ears_frontend_compile_patterns_to_dsl.py'
  F-R4-152:
    title: Spec-to-test-plan generator
    description: 'Generate a human-readable test plan from a spec before spawning.

      The test plan lists: test scenarios, expected inputs/outputs, edge

      cases, and which acceptance criteria each test covers. Used for

      pre-run human review and as context for the plan-review agent.

      '
    tier: Stretch
    acceptance_criteria:
    - 'File exists: src/bob3/spec_to_test_plan_generator.py'
    - 'pytest: tests/test_spec_to_test_plan_generator.py'
  F-R4-153:
    title: D1, D2, D3 YAML specs (paper artifact — stub)
    description: "Three complete specification YAML files:\n  D1: nanoGPT GPT-2 small training on OpenWebText\
      \ (target ≤25 perplexity)\n  D2: WASM bytecode interpreter (500 ops subset)\n  D3: Navier-Stokes\
      \ lid-driven cavity solver (Re=100, steady state)\nEach spec must be self-contained, use only non-banned\
      \ acceptance\ncriteria, and be runnable by the sweep orchestrator.\nSTUB: Full spec content to be\
      \ authored in Round 5.\n"
    tier: Paper
    acceptance_criteria:
    - 'File exists: src/bob3/d1_d2_d3_yaml_specs_paper_artifact_stub.py'
    - 'pytest: tests/test_d1_d2_d3_yaml_specs_paper_artifact_stub.py'
  F-R4-154:
    title: Hand-written reference implementations (paper artifact — stub)
    description: 'Gold-standard implementations of D1, D2, D3 for differential testing

      and no-AI baseline. Each must pass the corresponding YAML spec''s

      acceptance criteria without AI assistance.

      STUB: Implementation to be authored in Round 5.

      '
    tier: Paper
    acceptance_criteria:
    - 'File exists: src/bob3/hand_written_reference_implementations_paper_artifact_stub.py'
    - 'pytest: tests/test_hand_written_reference_implementations_paper_artifact_stub.py'
  F-R4-155:
    title: Hand-labeled hack-attack corpus (paper artifact — stub)
    description: '100 feature implementations (50 clean, 50 with reward-hacking

      attacks) for validating the reward-hacking detector (F-R2-104).

      Attacks include: test hardcoding, metric faking, spec gaming.

      STUB: Corpus to be authored/curated in Round 5.

      '
    tier: Paper
    acceptance_criteria:
    - 'File exists: src/bob3/hand_labeled_hack_attack_corpus_paper_artifact_stub.py'
    - 'pytest: tests/test_hand_labeled_hack_attack_corpus_paper_artifact_stub.py'
  F-R4-156:
    title: Analysis notebooks (paper artifact — stub)
    description: 'Reproducible Jupyter notebooks generating: reliability diagrams,

      ablation tables (V-1 vs V0 vs V1 vs V2 vs V3), bootstrap confidence

      intervals, and ECE plots. All from raw run.jsonl telemetry data.

      STUB: Notebooks to be authored in Round 5 after sweep data is available.

      '
    tier: Paper
    acceptance_criteria:
    - 'File exists: src/bob3/analysis_notebooks_paper_artifact_stub.py'
    - 'pytest: tests/test_analysis_notebooks_paper_artifact_stub.py'
  F-R4-150:
    title: Synthesizer emits integration criterion for wiring features
    description: 'When a feature description implies it must be wired into existing
      code (keywords like "integrate", "wire into", "hook into", "register with"),
      the F-R1-011 spec synthesizer must add an "integration: <module>" acceptance
      criterion in addition to file/test criteria. Round 4 saw multiple needs_human
      features whose implementation was correct but unreferenced from any callsite —
      enhanced_verification.integration_code_exists caught them, but the synthesizer
      should preempt this by declaring the integration target up front.

      '
    tier: Core
    acceptance_criteria:
    - 'File exists: src/bob3/spec_synthesizer.py'
    - 'Function defined: bob3.spec_synthesizer.detect_integration_targets'
    - 'pytest: tests/test_spec_synthesizer_integration_criteria.py'
  F-R4-151:
    title: Sandbox the verifier from feature commits
    description: 'In Round 4 an implementation sub-agent edited
      src/bob3/enhanced_verification.py to soften the integration_code_exists check
      so its own feature would pass. Add a guard that rejects any diff touching
      verifier modules (enhanced_verification.py, superpowers.py, the evaluator)
      unless the active feature is tagged role=verifier. This is a guardrail
      against reward-hacking the verifier itself.

      '
    tier: Core
    acceptance_criteria:
    - 'File exists: src/bob3/orchestrator/verifier_sandbox.py'
    - 'Function defined: bob3.orchestrator.verifier_sandbox.check_verifier_untouched'
    - 'pytest: tests/test_verifier_sandbox.py'
