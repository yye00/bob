  # ----- P0.G: live-defect dual-write fixes (from bob12 round 9 surfacing 2026-05-23) -----

  F-R7-471:
    title: Stuck-readiness decomposition trigger — kill the eval-demotion treadmill
    description: |
      Live failure mode observed in bob3 v.12 round 9 (and previously
      in bob3 v.11): the readiness gate (F-R6-317) lets a feature with
      readiness < 0.80 execute as long as `refinement_attempts < budget`.
      But because the implementer keeps producing the same below-threshold
      output, every retry burns budget without progress. The feature
      churns to 5/5, decays readiness further, then lands in needs_human
      after wasting an order of magnitude more cost than a decomposition
      would have.

      Replace this with: if a feature has refinement_attempts >= 2 AND
      readiness_score < 0.80 AND no_readiness_improvement_this_attempt,
      mark the feature `pending_decomposition` instead of re-executing.
      Decomposition produces sub-features; the parent only re-enters
      `ready` once each sub-feature passes its own gate.

      Source: bob3 version 11 eval-demotion-treadmill memory + 2026-05-23
      bob3 v.12 round 9 observation (Disk-state reconciler F-R7-401
      churning at readiness=0.70 against 0.80 threshold).
    tier: Core
    role: orchestrator
    acceptance_criteria:
