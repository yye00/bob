  F-R7-472:
    title: AC artifact-existence verifier — refuse to pass AC when referenced files are missing
    description: |
      Live failure mode observed in bob3 v.12 round 9: feature F-R7-401
      had AC `pytest: tests/test_disk_reconciler_idempotent.py` but the
      file was never written. pytest returned exit=4 ("no tests
      collected"); the verifier reported "pytest criterion failed" but
      this was an exit-code mismatch, not the actual root cause (file
      missing). Same class of bug for AC `File exists: X` where the
      file is silently not produced.

      A pre-pytest pass MUST verify that every AC of the form
      `pytest: <path>`, `File exists: <path>`, `File modified: <path>`,
      or `Function defined: <module>.<symbol>` resolves to an actual
      artifact in the produced workspace. Missing artifact → AC fails
      with reason "ARTIFACT_MISSING:<path>" — never swallowed as a
      generic pytest exit code.

      Source: bob3 v.12 round 9 disk-state-reconciler observation
      (2026-05-23).
    tier: Core
    role: verifier
    acceptance_criteria:
      - 'File exists: src/bob3/verification/ac_artifact_check.py'
      - 'Function defined: bob3.verification.ac_artifact_check.verify_ac_artifacts(feature, workspace_dir) -> list[ArtifactMiss]'
      - 'Recognized AC prefixes: "pytest:", "File exists:", "File modified:", "File modified or created:", "Function defined:"'
      - 'For "pytest: <path>" — path must exist and pytest --collect-only on it must report >=1 test'
      - 'For "File exists:" / "File modified:" — path must exist (modified time check optional)'
      - 'For "Function defined: <module>.<symbol>" — module must import without error AND symbol must be present in dir(module)'
      - 'Each miss recorded as ArtifactMiss(ac_text=..., expected_path=..., kind=..., reason="ARTIFACT_MISSING")'
      - 'Verifier fails the feature with explicit reason on any miss — NEVER reported as generic "pytest criterion failed"'
      - 'pytest: tests/test_ac_artifact_check_detects_missing_pytest_file.py'
      - 'pytest: tests/test_ac_artifact_check_detects_empty_pytest_file.py'
      - 'pytest: tests/test_ac_artifact_check_detects_missing_function_symbol.py'
      - 'pytest: tests/test_ac_artifact_check_passes_when_all_artifacts_present.py'
      - 'pytest: tests/test_ac_artifact_check_failure_message_includes_specific_path.py'
      - 'integration: bob3.verification.verifier (runs BEFORE pytest pass)'

  # ----- P0.LOOP_AUTO: research-fleet auto-landed features -----
  # Landed by the /loop research-fleet 2026-05-23 per user directive
  # (auto-land, no signoff, max 5 per bob version, focus on note-worthy
  # capabilities not low-model compensation).

  F-R7-473:
    title: Environment-capability preflight with research-driven workaround discovery
    description: |
      At spec-load: enumerate every external dependency referenced by the
      spec (CLI tools named in AC text like "sqlite3", "git", "pytest";
      python modules implied by "Function defined: pkg.mod.sym" paths;
      tools invoked in shell-AC blocks). Probe each at startup using
      `command -v` for CLIs and `python3 -c "import X"` for modules.

      For each MISSING dep, spawn a one-shot research sub-agent that
      surfaces a concrete workaround (stdlib equivalent, alternative
      package, shim script). Auto-apply the workaround when low-risk
      (e.g., shim a missing sqlite3 CLI via `python3 -m sqlite3`); halt
      with operator-actionable error + the discovered workaround as
      hint when not auto-applicable.

      Motivated by 2026-05-23 incident: sqlite3 CLI was missing on host,
      bob4/tools/weekend_watchdog.sh check_convergence shelled out to
      sqlite3, all queries returned "" silently, watchdog false-positive
      converged 3 times before being diagnosed.
    tier: Core
    role: orchestrator
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/env_preflight.py'
      - 'Function defined: bob3.orchestrator.env_preflight.enumerate_deps(spec_path) -> DepInventory'
      - 'Function defined: bob3.orchestrator.env_preflight.probe(dep) -> ProbeResult'
      - 'Function defined: bob3.orchestrator.env_preflight.discover_workaround(missing_dep) -> Workaround | None (spawns research sub-agent)'
      - 'Function defined: bob3.orchestrator.env_preflight.apply_or_halt(missing_deps, workarounds) -> None'
      - 'CLI dep enumeration recognizes bash blocks, AC "command:" lines, and AC verbs like "Run pytest:"'
      - 'Python dep enumeration parses "Function defined: <module>.<symbol>" AC text'
      - 'Halt message names the missing dep AND the discovered workaround verbatim — never silent skip'
      - 'Workaround application persisted to runs/<round>/applied_workarounds.yaml'
      - 'Demonstrator: bob4/research/demonstrators/F-R7-473/spec.yaml declares a feature requiring a deliberately-absent CLI (xxd)'
      - 'pytest: tests/test_env_preflight_enumerates_cli_deps.py'
      - 'pytest: tests/test_env_preflight_enumerates_python_deps.py'
      - 'pytest: tests/test_env_preflight_probe_detects_missing_cli.py'
      - 'pytest: tests/test_env_preflight_discovers_sqlite3_workaround.py'
      - 'pytest: tests/test_env_preflight_demo_xxd_in_worktree.py (runs bob3 against demonstrator in git worktree, asserts halt message contains both "xxd" and a workaround hint)'
      - 'integration: bob3.cli.run (preflight runs before any feature dispatch)'

  F-R7-474:
    title: Research-augmented retry — path-finding on ambiguous AC failure
    description: |
      When a feature reaches refinement_attempts >= 2 AND the previous
      attempt's failure is classifiable (missing test file, ImportError,
      type mismatch, contract violation, empty function body, AC text
      ambiguous on units/types/protocol), spawn a research sub-agent
      that surfaces 1-2 alternative implementation strategies tailored
      to the failure class and the AC text. Inject the strategies into
      the next implementer attempt's context as a "Prior attempts failed
      for reason X; consider approach A or B" prefix.

      Path-finding distinguishes this from blind retry. The implementer
      retries with NEW information, not the same prompt against the same
      stuck context. Cache surfaced strategies in
      runs/<feature>/research/<attempt_n>.yaml.

      Motivated by the recurring eval-demotion treadmill (F-R6-317 +
      F-R7-471) where features churn the retry budget without progress
      because the implementer has no new signal each attempt.
    tier: Core
    role: orchestrator
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/path_finding_retry.py'
      - 'Function defined: bob3.orchestrator.path_finding_retry.classify_failure(failure_log, ac_text) -> FailureClass'
      - 'FailureClass enum: missing_test_file | import_error | type_mismatch | contract_violation | empty_impl | ambiguous_ac | unknown'
      - 'Function defined: bob3.orchestrator.path_finding_retry.research_strategies(failure_class, ac_text, prior_impls) -> list[Strategy] (spawns research sub-agent; cached per feature/attempt)'
      - 'Function defined: bob3.orchestrator.path_finding_retry.inject_into_implementer_prompt(strategies, base_prompt) -> str'
      - 'Triggers ONLY on refinement_attempts >= 2 AND classify_failure() != unknown'
      - 'Strategies persisted to runs/<feature>/research/attempt_<n>.yaml'
      - 'Implementer prompt prefix verifiable in runs/<feature>/attempts/<n>/implementer_prompt.txt'
      - 'Demonstrator: bob4/research/demonstrators/F-R7-474/spec.yaml declares a deliberately ambiguous feature ("implement a fast sort, no further context")'
      - 'pytest: tests/test_path_finding_classify_missing_test_file.py'
      - 'pytest: tests/test_path_finding_classify_ambiguous_ac.py'
      - 'pytest: tests/test_path_finding_research_caches_per_attempt.py'
      - 'pytest: tests/test_path_finding_does_not_trigger_on_first_attempt.py'
      - 'pytest: tests/test_path_finding_demo_ambiguous_sort_in_worktree.py (runs bob3 against demonstrator in worktree; asserts attempt-2 implementer prompt differs from attempt-1 and contains strategy text)'
      - 'integration: bob3.orchestrator.run_loop._execute_feature (called before retry dispatch)'

  F-R7-475:
    title: Mutation-testing post-impl quality gate (mutmut)
    description: |
      Live defect surfaced in bob3 v.12 round 9: bob3 ships features
      with passing test suites that contain weak assertions
      (`assert result is not None`-class). F-R7-454 (test-writer
      sub-agent) and F-R7-462 (CodeT KxK triangulation) raise the floor
      on test EXISTENCE and tests-vs-impl AGREEMENT, but neither
      measures test STRENGTH against deliberate impl perturbations.

      Wire mutmut 3.x as a verifier-stage quality gate: after pytest
      passes, mutate the feature's implementation files (replace
      arithmetic operators, flip boolean conditions, mutate constants,
      drop statements) and re-run the test suite. Reject the feature
      if mutation_score < 0.75 (75% of mutants killed). Surviving
      mutants persisted to runs/<feature>/mutation_report.json — the
      implementer's next attempt sees the surviving mutants as
      "tests cannot distinguish your impl from these broken variants;
      strengthen assertions."

      Orthogonal to F-R7-462 (CodeT picks the winning impl) and
      F-R7-453 (property-based ACs); operates on the produced impl,
      not the spec.

      Source: mutmut 3.x (2024) + cosmic-ray (Sixty North) + Google
      "Practical Mutation Testing at Scale" (2021). Agent C
      research-fleet finding 2026-05-23.
    tier: Core
    role: verifier
    acceptance_criteria:
      - 'File exists: src/bob3/verification/mutation_gate.py'
      - 'Function defined: bob3.verification.mutation_gate.run_mutation_test(feature, workspace_dir) -> MutationReport'
      - 'Function defined: bob3.verification.mutation_gate.MutationReport (dataclass: total_mutants, killed, survived, score, surviving_diffs)'
      - 'Function defined: bob3.verification.mutation_gate.passes_gate(report, threshold=0.75) -> bool'
      - 'Operators: AOR (arithmetic), ROR (relational), COR (conditional), LCR (logical), SDL (statement deletion), constant-replacement (mutmut defaults)'
      - 'Runs ONLY after pytest_pass=True (no point mutating impl whose tests already fail)'
      - 'Surviving mutants written as unified diff blocks to runs/<feature>/mutation_report.json (so implementer can read them)'
      - 'On failure, feature.status returns to ready with mutation_report.json injected into next implementer prompt as "Tests do not kill these mutants; strengthen assertions to distinguish them."'
      - 'Mutation gate respects budget: default time_limit_sec=180 per feature; partial runs still report'
      - 'Demonstrator: bob4/research/demonstrators/F-R7-475/spec.yaml — declares an is_prime(n) feature with deliberately weak tests; assert mutation gate fails and lists surviving constant-mutant'
      - 'pytest: tests/test_mutation_gate_runs_mutmut.py'
      - 'pytest: tests/test_mutation_gate_score_calculation.py'
      - 'pytest: tests/test_mutation_gate_below_threshold_rejects.py'
      - 'pytest: tests/test_mutation_gate_surviving_mutants_persisted.py'
      - 'pytest: tests/test_mutation_gate_demo_is_prime_in_worktree.py (runs bob3 against demonstrator in git worktree; asserts mutation_score < 0.75 on weak test set, then asserts score ≥ 0.75 after strengthen-attempt)'
      - 'integration: bob3.verification.verifier (runs AFTER pytest_pass check)'

F-R7-476:
  name: triton_kernel_autotuner_subagent
  description: |
    GPU/Triton kernel synthesis + autotune sub-agent.

    When a feature's AC mentions GPU kernel, Triton, CUDA, ROCm,
    or "@triton.jit", the implementer routes through a specialized
    sub-agent that:
      1. Emits a Triton kernel skeleton matching the AC signature
      2. Wraps the kernel in @triton.autotune with a swept config
         space over BLOCK_M/BLOCK_N/BLOCK_K/num_warps/num_stages
      3. Runs the sweep on whatever accelerator is visible
         (torch.cuda.is_available() or torch.xpu / Triton-CPU fallback)
      4. Persists the winning config to runs/<feature>/triton_config.yaml
      5. Gates pass on numerical correctness vs a CPU torch reference
         (atol/rtol from AC, default 1e-5 / 1e-4)

    Restores the GPU code-generation capability that v0.10 had
    (F-R6-212/213/216 HPC bundle) and was dropped during v0.11
    spec compaction. Zero overlap with the 37 existing v.12 features.

    Quality bar: this is genuine note-worthy capability (kernel
    synthesis + autotune + cross-hardware numerical correctness),
    not prompt-engineering. Runs only when AC triggers it, so
    zero overhead for non-GPU features.

    Source: OpenAI Triton (Tillet et al. 2019); triton.autotune
    docs (triton-lang.org); inventory-diff agent finding 2026-05-23
    (GPU theme = zero coverage in v.12, dropped from v.10).
  tier: Core
  role: implementer
  acceptance_criteria:
    - 'File exists: src/bob3/implementers/triton_kernel.py'
    - 'Function defined: bob3.implementers.triton_kernel.is_gpu_feature(spec: FeatureSpec) -> bool (matches AC text for triton/cuda/rocm/@triton.jit/GPU kernel keywords)'
    - 'Function defined: bob3.implementers.triton_kernel.synthesize_kernel(spec, signature) -> str (returns Python source containing @triton.jit kernel + Python launcher)'
    - 'Function defined: bob3.implementers.triton_kernel.autotune_kernel(kernel_src, configs, sample_inputs) -> AutotuneResult (dataclass: best_config, all_timings, hardware_label)'
    - 'Function defined: bob3.implementers.triton_kernel.verify_numerical(kernel_callable, reference_callable, sample_inputs, atol, rtol) -> NumericalReport'
    - 'Default sweep space: BLOCK_M in [32,64,128], BLOCK_N in [32,64,128], num_warps in [2,4,8], num_stages in [2,3,4] (filtered by triton.autotune constraints)'
    - 'Hardware fallback order: CUDA -> ROCm (HIP) -> Triton-CPU backend; if none available, feature.status returns to ready with halt_reason="no_accelerator_visible" and skip count incremented'
    - 'Winning config written to runs/<feature>/triton_config.yaml with keys: best_config, hardware_label, ms_per_call, all_timings'
    - 'Numerical correctness gate: max_abs_err and max_rel_err vs CPU torch reference must be within AC-supplied tolerances (defaults atol=1e-5, rtol=1e-4); failure returns feature to ready with numerical_report injected into next implementer prompt'
    - 'Demonstrator: bob4/research/demonstrators/F-R7-476/spec.yaml — declares a softmax_2d(x: Tensor[M,N]) -> Tensor[M,N] feature with AC "implement as Triton kernel; numerically equal to torch.softmax(dim=-1) within atol=1e-5"; assert autotuner picks a config and numerical gate passes against torch.softmax reference'
    - 'pytest: tests/test_triton_is_gpu_feature_detection.py'
    - 'pytest: tests/test_triton_synthesize_kernel_signature_matches.py'
    - 'pytest: tests/test_triton_autotune_picks_best_config.py'
    - 'pytest: tests/test_triton_numerical_gate_catches_wrong_kernel.py'
    - 'pytest: tests/test_triton_cpu_fallback_when_no_gpu.py (skipif=triton.runtime has no cpu backend)'
    - 'pytest: tests/test_triton_demo_softmax_in_worktree.py (runs bob3 against demonstrator in git worktree; asserts triton_config.yaml exists, best_config has BLOCK_M+BLOCK_N keys, numerical_report.max_abs_err < 1e-5)'
    - 'integration: bob3.implementers.dispatcher routes to triton_kernel.synthesize_kernel when is_gpu_feature returns True (instead of default whole-file implementer)'

F-R7-477:
  name: voyager_persistent_skill_library
  description: |
    Voyager-style persistent skill library for env workarounds + shims.

    F-R7-473 (env-preflight) discovers workarounds for missing deps
    per-run and persists them only to runs/<round>/applied_workarounds.yaml
    (run-scoped, not retrievable). The next round / next feature /
    next bob generation re-pays the research cost to re-discover the
    same shim (e.g. "xxd missing -> python3 -c 'import binascii'").

    This feature adds a skill_library/ directory of executable shim
    modules, each with a docstring + natural-language capability
    description embedded for retrieval. On preflight, BEFORE spawning
    a research sub-agent, search the library by capability-description
    similarity; if a hit, apply it. On success of a newly-discovered
    workaround, write it back to the library. The library is persisted
    across bob generations via the same disk-state reconciler that
    already handles features (F-R6-307 / F-R7-401).

    Composes multiplicatively with F-R7-473: each discovered shim
    becomes a permanent capability, paying back across every future
    bob generation. Note-worthy capability — Voyager (Wang 2023) is
    the canonical reference for skill-library lifelong-learning for
    LLM agents; no recursive AI-builds-AI chain has documented this.

    Source: Wang et al. "Voyager: An Open-Ended Embodied Agent with
    Large Language Models" (arXiv 2305.16291; github.com/MineDojo/Voyager).
    Agent B research-fleet finding 2026-05-23 (deferred from prior
    tick; landed this tick after re-evaluation).
  tier: Core
  role: implementer
  acceptance_criteria:
    - 'File exists: src/bob3/skill_library/__init__.py'
    - 'File exists: src/bob3/skill_library/registry.py'
    - 'File exists: src/bob3/skill_library/embeddings.py'
    - 'Function defined: bob3.skill_library.registry.add_skill(capability_description: str, shim_module_src: str, provenance: dict) -> str (returns skill_id)'
    - 'Function defined: bob3.skill_library.registry.search_skills(capability_query: str, top_k: int = 3) -> list[SkillHit] (SkillHit dataclass: skill_id, capability_description, similarity, shim_module_src)'
    - 'Function defined: bob3.skill_library.registry.apply_skill(skill_id: str, context: dict) -> ApplyResult (executes shim in subprocess, captures stdout/stderr, returns success bool)'
    - 'Embeddings backend: sentence-transformers all-MiniLM-L6-v2 by default; pluggable via env var BOB3_SKILL_LIBRARY_EMBED_MODEL'
    - 'Skill storage: skill_library/<skill_id>/ with shim.py + meta.yaml (capability_description, embedding_vector, provenance, success_count, failure_count, created_at, last_used_at)'
    - 'Integration with F-R7-473: env_preflight.preflight() FIRST calls skill_library.search_skills(missing_dep) with top_k=3 before spawning research sub-agent; if any hit has similarity >= 0.75, apply it and verify; only research if all library hits fail or none returned'
    - 'On success of a NEW workaround (research path), call skill_library.registry.add_skill() to persist for future runs'
    - 'Cross-generation persistence: skill_library/ directory survives bob_N -> bob_(N+1) spawn (mirrors how F-R7-401 / F-R6-307 disk reconciler treats features)'
    - 'Demonstrator: bob4/research/demonstrators/F-R7-477/spec.yaml — declares two features both requiring missing `xxd` tool; first feature triggers research+library insertion; second feature MUST complete with ZERO research_subagent spawn calls (assert via mock-counted spawn_research_subagent)'
    - 'pytest: tests/test_skill_library_add_and_search.py'
    - 'pytest: tests/test_skill_library_embedding_similarity_threshold.py'
    - 'pytest: tests/test_skill_library_apply_skill_executes_shim.py'
    - 'pytest: tests/test_skill_library_preflight_integration_no_research_on_hit.py'
    - 'pytest: tests/test_skill_library_persists_new_workaround_after_success.py'
    - 'pytest: tests/test_skill_library_demo_two_features_xxd_in_worktree.py (runs bob3 against demonstrator in git worktree; asserts feature_2 completes with research_subagent.spawn_count == 0 because feature_1 populated the library)'
    - 'integration: bob3.env_preflight.preflight (search library FIRST, research only as fallback)'
