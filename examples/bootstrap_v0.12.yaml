  F-R7-462:
    title: CodeT mutual-agreement triangulation (KxK code-test matrix)
    description: |
      F-R7-454 commits to one test-writer pass. CodeT's stronger pattern
      (ICLR 2023): spawn K candidate test sets and K candidate impls,
      then score each (code, test) cell of the KxK matrix by
      mutual-agreement. Removes the failure mode where a single bad
      test rubber-stamps a single bad implementation.

      Combined with TestGen-LLM's Build/Pass/Coverage triple filter,
      this is the cheapest known guard against AI-judge sycophancy
      that recursive bob3 has documented for over a year.

      Source: Agent 4 Section 9 (CodeT, ICLR 2023; TestGen-LLM).
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/codet_triangulation.py'
      - 'Function defined: bob3.orchestrator.codet_triangulation.spawn_k_tests (default K=3, framings: positive/adversarial/boundary)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.spawn_k_impls (default K=2)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.score_matrix (mutual-agreement = passing_tests * tests_that_uniquely_fail_other_impls)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.triple_filter (Build/Pass/Coverage drop)'
      - 'Winning (code, tests) cell persisted; losers archived under runs/<feature>/variants/'
      - 'pytest: tests/test_codet_kxk_scoring.py'
      - 'pytest: tests/test_codet_triple_filter_drops_dud_tests.py'
      - 'pytest: tests/test_codet_winner_selection_against_golden.py'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-469:
    title: Self-Discover meta-agent for per-feature spec-section selection
    description: |
      bob3's PRD schema (F-R7-457) is fixed: every spec must fill every
      slot. For trivial features (e.g., add a CLI flag), that wastes
      tokens on irrelevant NFR/security/perf sections. For complex
      ones, it under-specifies the relevant axes. A meta-agent that
      first picks WHICH spec sections matter, then drives a focused
      extractor pass, beats one-size-fits-all.

      Source: Agent 4 Section 7 (Self-Discover, ICML 2024).
    tier: Core
    role: spec-extractor
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/section_selector.py'
      - 'Function defined: bob3.spec_quality.section_selector.select_sections'
      - 'Selection drawn from a fixed module set of 8 spec sections: functional, perf, security, error_handling, observability, ops, ux, compat'
      - 'Output sections.yaml schema-validated: {section_name: REQUIRED|OPTIONAL|SKIP}'
      - 'Extractor only attempts REQUIRED + OPTIONAL slots; SKIP slots null with rationale'
      - 'Critic SHALL NOT penalize a missing SKIP slot'
      - 'Decisions logged to reviews/section_selections.yaml for future training-set use'
