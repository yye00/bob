  F-R7-470:
    title: Python-based convergence checker with non-empty + name-based comparison
    description: |
      On 2026-05-23 the bob3 chain silent-exited the weekend_watchdog three
      times after round_complete. Root cause: bob4/tools/weekend_watchdog.sh
      check_convergence shelled out to `sqlite3` (not installed on host),
