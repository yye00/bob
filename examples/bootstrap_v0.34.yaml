  F-R7-568:
    title: F-R7-479 RCA auto-reset MUST grant fresh attempt budget when verification-gate-failure cause is plausibly-fixable code (not just infra/transient) — currently only infra reclassification reopens the budget, so legitimate verification failures NH at attempt 3 with unused budget
    description: |
      bob3 v.14 r12 (observed 2026-05-29 18:43:21 PDT): feature
      dd11d1f8 (Ownership-evidenced regression detection) NH'd at
      refinement_attempts=3 — TWO attempts of remaining budget were
      never used. Log path: feature went ready→executing→failed via
      verification gate, RCA classified the failure as terminal
      (NOT infra), F-R7-479 auto-reset path did not fire, run_loop
      then NH-demoted on next read because below-threshold AND
      RCA classified terminal.

      The 5-attempt cap exists precisely because verification
      failures are often code-fixable on retry (different subagent
      attempt may produce correct emission). Treating ALL non-infra
      verification failures as terminal-at-current-attempt defeats
      the budget.

      Fix at extraction (spec-over-code-fix): F-R7-479 auto-reset
      MUST also fire on `verification_gate_failed` classifications
      when `refinement_attempts < 5` AND the failure cause is
      classified as `code_emission_defect` (i.e. emitted code is
      wrong but plausibly fixable) — distinct from
      `spec_ambiguity` (which is genuinely terminal). Decision
      gate: if the failed AC is a behavior/integration AC that
      requires emitted code to satisfy, treat as
      `code_emission_defect` and allow another attempt.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/orchestrator/rca_attempt_budget.py"
      - "Function defined: bob3.orchestrator.rca_attempt_budget.classify_verification_failure"
      - "Function defined: bob3.orchestrator.rca_attempt_budget.should_grant_fresh_attempt"
      - "behavior: classify_verification_failure returns 'code_emission_defect' when failed ACs are behavior/integration/pytest type; returns 'spec_ambiguity' when failed ACs reference symbols that no plausible code could satisfy; returns 'infra_transient' on subprocess/io error patterns"
      - "behavior: should_grant_fresh_attempt returns True when classification is 'code_emission_defect' AND refinement_attempts < 5; returns True for 'infra_transient' regardless of attempt count (per existing F-R7-479); returns False for 'spec_ambiguity'"
      - "integration: bob3.orchestrator.rca_infra_recovery.auto_reset_if_infra extends to call should_grant_fresh_attempt; when True, transitions needs_human→ready with attempts unchanged (NOT reset to 0 — preserves budget accounting) and logs sentinel rca_granted_fresh_attempt=<feature_id>:<classification>"
      - "integration: dd11d1f8-class failures (verification gate failed on plausible-fixable emission, attempts<5) MUST trigger fresh-attempt grant rather than NH-demote"
      - "pytest: tests/test_rca_attempt_budget_code_defect.py asserts classify_verification_failure returns 'code_emission_defect' for a fixture failure list containing 'behavior: foo does X'"
      - "pytest: tests/test_rca_attempt_budget_grants_attempt.py asserts should_grant_fresh_attempt returns True for code_emission_defect at attempts=3"
      - "pytest: tests/test_rca_attempt_budget_caps_at_5.py asserts should_grant_fresh_attempt returns False at attempts=5 regardless of classification (boundary)"
      - "pytest: tests/test_rca_attempt_budget_dd11d1f8_regression.py asserts a dd11d1f8-shaped feature (ownership-detection verification-gate failure at attempt 3) gets reopened to ready (regression test for dd11d1f8 root cause)"

