    acceptance_criteria:
      - "File exists: src/bob3/verification/regression_attribution.py"
      - "Function defined: bob3.verification.regression_attribution.owning_feature_for_test"
      - "Function defined: bob3.verification.regression_attribution.attribute_regression_to_owner"
      - "Function defined: bob3.verification.regression_attribution.is_attributable_to_current_feature"
      - "behavior: owning_feature_for_test returns the feature_id whose tests/<feature_id>/ subtree contains the path, OR the feature_id whose pytest-prefix ACs declare the path; returns None when no owner found"
      - "behavior: attribute_regression_to_owner re-opens the owner feature (status=needs_human, attempts reset, audit-log sentinel test_regression_reattributed_to=<owner_id>) when owner is in a terminal state and the regression is newly-failing"
      - "behavior: is_attributable_to_current_feature returns True only when owning_feature_for_test matches the currently-verifying feature_id (False when owner is a sibling feature or unknown)"
      - "behavior: when owner unknown, log orphan_test_regression structured event with test path and previously_passed_at timestamp; do NOT gate-block the current feature"
      - "integration: bob3.verification.verifier regression-vs-baseline step filters its failing-test set through is_attributable_to_current_feature; only attributable failures count toward the current feature's gate result"
      - "integration: existing F-R7-532-style whole-suite invariant pass retains operation; reattribution is a layer on top, not a replacement"
