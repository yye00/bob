      - "behavior: is_cost_telemetry_lost returns False when work_events == 0 (clean spawn crash, no work done — correct free-retry path)"
      - "behavior: apply_pessimistic_cost returns the per-feature max-cost ceiling when telemetry is lost; returns the reported cost otherwise"
      - "behavior: emit_cost_telemetry_lost_event writes a structured WARN-level log line with feature_id, work_events, exit_code, attempt_number, applied_pessimistic_cost"
      - "integration: bob3.orchestrator.run_loop budget-enforcement path replaces the existing `if cost == 0: disable enforcement` branch with: if is_cost_telemetry_lost(cost, work_events): apply_pessimistic_cost + emit_cost_telemetry_lost_event + still enforce the per-feature ceiling"
      - "integration: F-R7-478 unlimited spawn-retry path remains unaffected for true zero-work crashes (work_events==0)"
      - "pytest: tests/test_cost_telemetry_lost_detection.py asserts (cost=0, work_events=176217) classified as telemetry-lost (true)"
      - "pytest: tests/test_cost_telemetry_lost_detection.py asserts (cost=0, work_events=0) classified as NOT telemetry-lost (clean spawn crash boundary)"
      - "pytest: tests/test_cost_telemetry_lost_detection.py asserts (cost=0.001, work_events=176217) classified as NOT telemetry-lost (cost was reported)"
      - "pytest: tests/test_cost_pessimistic_application.py asserts apply_pessimistic_cost charges per-feature ceiling on lost telemetry (error/safety path)"

  F-R7-562:
    title: tests_pass regression-vs-baseline MUST attribute failures to originating feature — sibling-feature broken test stubs currently gate-block unrelated current feature's verification
    description: |
      bob3 v.15 r12 (observed 2026-05-29 14:11 PDT): feature 9b2e1060
      verification logged
      "[FAIL] tests_pass: pytest regression vs baseline in tests:
       7 test(s) that previously passed now fail
       (tests/test_contract_grammar_emits_runnable_decorators.py,
        tests/test_f061_create_lesson_from_bug.py,
        tests/73879589/test_ac_12_pytest_tests_test_contract_grammar_blame.py,
        ...)".
      None of the 7 failing tests belong to 9b2e1060's own AC test
      tree (tests/9b2e1060/...) — they are stub regressions from
      PRIOR features (most notably 73879589 which was itself NH-
      demoted earlier, leaving broken test stubs uncleaned). The
      regression-vs-baseline check counts those failures against
      9b2e1060 and trips the verification gate, demoting 9b2e1060
      to NH at attempt=5.

      F-R7-558 fixed per-feature tests_pass scope but the
      regression-vs-baseline check (F-R7-532-style invariant pass)
      still runs whole-suite and attributes the diff to whichever
      feature is currently being verified.

      Fix at extraction (spec-over-code-fix): regression-vs-baseline
      MUST consult a test-path → owning-feature_id map (already
      derivable from tests/<feature_id>/ subtree convention OR from
      pytest-prefix ACs of completed features). A previously-passing
      test that now fails MUST be attributed to its OWN owning
      feature (re-opening that feature for repair if owner is in a
      terminal state, OR logged as orphan_test_regression if owner
      unknown) — NOT counted against the currently-verifying feature.
      Whole-suite regression detection retains its safety value
      while no longer mis-blaming unrelated features.
