      - "behavior: lock_holder_pid_alive parses PID from .bob3.lock and returns True when kill(pid, 0) succeeds"
      - "behavior: safe_to_remove_lock returns True only when is_orchestrator_alive is False AND lock_holder_pid_alive is False AND no feature row has status='executing' with updated_at within last 60s"
