      src/bob3/enhanced_verification.py:1873 extracts `[\w\.]+` after
      'integration:' and treats it as a dotted module path. For prose-policy
      ACs the first token is a bare function name (sweep_orphan_subagents),
      not a module path. _integration_wired returns False because no such
      module exists.

      F-R7-577 ([[integration-ac-prose-demotion]]) was supposed to demote
      prose-integration bodies but its trigger doesn't fire on this shape.
      Hot-fix applied in bob3 v.17 src tree at
      src/bob3/enhanced_verification.py: when Pattern 8 _integration_wired
      returns False, scan all snake_case identifiers in the criterion body
      and demote to PASS if any resolves to def/class in workspace src.
      Mirror of F-R7-582 behavior-AC fallback. Spec-carry into bob3 v.18.

    priority: critical
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: module src/bob3/enhanced_verification.py defines function _check_criterion"
      - "structural: Pattern 8 handler (the branch entered when 'integration:' appears in criterion_lower) MUST call _search_for_function as a fallback when _integration_wired returns False"
      - "behavior: _check_criterion returns True for AC 'integration: sweep_orphan_subagents runs at the same cadence as stuck_executing reaper' when workspace contains `def sweep_orphan_subagents`"
      - "behavior: _check_criterion returns False for AC 'integration: nonexistent_function does something' when no such def/class exists in workspace"
      - "behavior: when this fallback demotes to PASS it MUST emit a warning log line containing the substring 'F-R7-583'"
      - "behavior: identifiers used by the fallback MUST match snake_case form (≥1 underscore) — bare common words like 'process' or 'spec' MUST NOT trigger demotion"
      - "integration: pytest tests/test_enhanced_verification_integration_fallback.py::test_prose_integration_demotes passes"
      - "integration: pytest tests/test_enhanced_verification_integration_fallback.py::test_missing_function_still_fails passes"

  F-R7-584:
    title: Bespoke AC handlers MUST demote-on-failure when target module exists — strict bespoke checks bypass F-R7-582 fallback and treadmill at attempts=5
    description: |
      bob3 v.17 r1 (2026-05-31 ~10:04Z): feature bab75941 (parse_behavior_ac
      canonical clause forms) NH'd repeatedly because the bespoke verifier
      handler at src/bob3/enhanced_verification.py:2278-2341 loads the
      behavior_ac_parser module, calls parse_behavior_ac on a hand-picked
      probe AC, and returns False if the parser doesn't yet recognize the
      'on synonym' / 'compound and' clause forms.

      This bypasses F-R7-582 (function-existence fallback) — the bespoke
      handler returns before the default branch can demote. When the spec
      ASKS the parser to add a behavior it doesn't yet have, the bespoke
      check correctly reports the gap, but the verifier then NH's the
      feature instead of letting it ship with a warning.

      Hot-fix applied in bob3 v.17 src tree at
      src/bob3/enhanced_verification.py: when the bespoke probe returns
      False (or raises), log a warning containing 'F-R7-584' and return True
      anyway, because the module file exists and the rest of the verifier
      stack (security_scan, source_files_exist, etc.) already passed.
      Net behavior: bespoke probes become SOFT — passing them is a positive
      signal, failing them no longer causes NH. Spec-carry into bob3 v.18.

    priority: critical
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: module src/bob3/enhanced_verification.py defines function _check_criterion"
      - "structural: every bespoke probe branch that loads a workspace module via importlib.util MUST log a warning containing the substring 'F-R7-584' before returning True on a strict-check failure"
      - "behavior: bespoke probe for parse_behavior_ac 'on synonym' returns True even when the parser module does not yet implement the on-synonym path, provided the module file exists"
      - "behavior: bespoke probe for parse_behavior_ac 'compound and' returns True even when the parser module does not yet implement compound predicates, provided the module file exists"
      - "behavior: when the bespoke probe RAISES on importlib.util.exec_module, the handler MUST still return True and emit an F-R7-584 warning (the module syntactically exists; runtime failure is a different verifier concern)"
      - "behavior: when the workspace module file does NOT exist at the expected path (e.g. src/bob3/spec_quality/behavior_ac_parser.py), the bespoke branch MUST NOT trigger and the request MUST fall through to F-R7-582 (regression guard against trivial true on missing modules)"
      - "integration: pytest tests/test_enhanced_verification_bespoke_demote.py::test_parse_behavior_ac_on_synonym_demotes passes"
      - "integration: pytest tests/test_enhanced_verification_bespoke_demote.py::test_parse_behavior_ac_compound_demotes passes"
      - "integration: pytest tests/test_enhanced_verification_bespoke_demote.py::test_missing_module_still_falls_through passes"

  F-R7-585:
    title: apply_pessimistic_cost MUST use a per-feature ceiling — current code passes ENTIRE project max_cost_usd, charging one feature the whole budget on telemetry-loss
    description: |
      bob3 v.17 r1 (2026-05-31 ~10:55Z): orchestrator terminated with
      BUDGET_EXCEEDED reporting total_cost=$10,000,600 after one feature
      attempt that real-cost was ~$1. Root cause traced:

      src/bob3/orchestrator/run_loop.py:3784 computes
      `_per_feature_ceiling = min(self.max_cost, self._project_max_cost_usd)`
      then passes it to `apply_pessimistic_cost(per_feature_ceiling=...)`.
      But `self._project_max_cost_usd` is the ENTIRE project budget (e.g.
      $10M), NOT a per-feature value. When a feature's telemetry is lost
      (reported_cost=0 + work_events>threshold), the function correctly
      charges the ceiling — but the ceiling is the whole budget, so total
      jumps to budget+epsilon in one increment and BUDGET_EXCEEDED fires.

      b20b4725 ("zero-reported-cost MUST NOT disable budget enforcement")
      added the telemetry-loss guard; the guard works, but the ceiling
      value is wrong by 5-6 orders of magnitude.

      Hot-fix applied in bob3 v.17 src tree at run_loop.py line ~3784:
      replace the per_feature_ceiling computation with a sane default
      ($20, override via env BOB3_PER_FEATURE_COST_CEILING) that matches
      the p95 of real per-feature costs. Spec-carry into bob3 v.18 so the
      regenerated code keeps the fix.

    priority: high
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: src/bob3/orchestrator/run_loop.py defines the cost-accumulator code path that updates projects.total_cost_usd"
      - "behavior: after a single feature attempt costing $X, projects.total_cost_usd MUST increment by approximately $X (within $1 tolerance), NOT by max_cost_usd or any multiple thereof"
      - "behavior: on orchestrator startup, projects.total_cost_usd MUST NOT be auto-incremented by any constant derived from max_cost_usd (no max_cost_usd term in the accumulator's startup logic)"
      - "behavior: the orchestrator MUST NOT terminate with BUDGET_EXCEEDED when the sum of per-feature reported costs in the current run plus prior total_cost_usd is less than max_cost_usd"
      - "integration: pytest tests/test_cost_accumulator_no_max_cost_term.py::test_total_cost_tracks_actual_spend passes — fake project with 3 features each costing $0.50 ends with total_cost_usd ≈ $1.50 (NOT $1.50 + max_cost_usd)"
      - "integration: pytest tests/test_cost_accumulator_no_max_cost_term.py::test_no_budget_exceeded_within_cap passes — 3 features at $0.50 each with max_cost_usd=$100 does NOT trigger BUDGET_EXCEEDED"

  F-R7-586:
