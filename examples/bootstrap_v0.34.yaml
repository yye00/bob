  F-R7-509:
    title: Orchestrator dispatch concurrency — let multiple ready features run in parallel instead of strict single-flight
    description: |
      bob3 v.13 r10 stall analysis: a single hung subagent blocked
      the entire pipeline because the orchestrator dispatches one
      feature at a time (synchronous await per feature). With max_turns=25
      per subagent and pytest verification potentially taking minutes,
      a single bad-actor feature can hold the whole round hostage even
      after F-R7-508 cancels it (next ready row only starts after
      cancellation completes).
      Fix: introduce BOB3_MAX_CONCURRENT_FEATURES (default 3) and
      dispatch up to N ready features as concurrent asyncio tasks.
      Each task carries its own watchdog (F-R7-508). The orchestrator
      tick loop becomes: gather completed → reap stuck → fill empty
      slots up to N. Eliminates the single-feature-blocks-round failure
      mode entirely; also halves wall-clock for rounds with many small
      features.
    tier: Core
    acceptance_criteria:
      - 'Function defined: bob3.orchestrator.run_loop.dispatch_up_to_concurrency'
      - 'Function defined: bob3.orchestrator.run_loop.current_concurrency_slots'
      - 'Function defined: bob3.orchestrator.run_loop.gather_completed_dispatches'
      - 'pytest: tests/test_dispatch_concurrency_fills_to_cap.py'
      - 'pytest: tests/test_dispatch_concurrency_respects_env_override.py'
      - 'pytest: tests/test_dispatch_concurrency_one_hung_does_not_block_others.py'
      - 'pytest: tests/test_dispatch_concurrency_boundary_zero_ready.py'
      - 'pytest: tests/test_dispatch_concurrency_default_three.py'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-510:
    title: Hot-reload subagent prompt source on each dispatch — code-fixes land without orchestrator restart
    description: |
      bob3 v.13 r10: a one-line patch to superpowers.py:749
      (scoped-pytest mandate) was applied to disk while the
      bob12-built orchestrator (PID 1520197) was running. The
      Python import cache meant the orchestrator continued
      dispatching subagents with the OLD prompt for 4+ hours.
      The patch only takes effect on the NEXT bob3 version build,
      which can be hours away. During active defect-hunting loops
      this defeats the dual-write protocol's "code-fix in bob(i)"
      half — every code patch is invisibly delayed by one bob
      generation.
      Fix: on each subagent dispatch, check the mtime of
      superpowers.py (and any other prompt-source module); if it
      has changed since last reload, call importlib.reload() before
      reading VERIFICATION_PROMPT_SECTION / SKILLS_PROMPT_SECTION.
      Cheap (stat + dict lookup) and bounded (only reloads when
      the file actually changed).
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/prompt_source_reloader.py'
      - 'Function defined: bob3.orchestrator.prompt_source_reloader.reload_if_stale'
      - 'Function defined: bob3.orchestrator.prompt_source_reloader.get_prompt_mtime'
      - 'Function defined: bob3.orchestrator.prompt_source_reloader.maybe_reload_all'
      - 'Function defined: bob3.orchestrator.prompt_source_reloader.reload_models_if_stale (extends scope to bob3.models — verifier cached-Feature-fields defect, bob3 v.13 r10)'
      - 'pytest: tests/test_prompt_reloader_picks_up_mtime_change.py'
      - 'pytest: tests/test_prompt_reloader_skips_when_unchanged.py'
      - 'pytest: tests/test_prompt_reloader_handles_missing_file.py'
      - 'pytest: tests/test_prompt_reloader_boundary_first_call.py'
      - 'pytest: tests/test_prompt_reloader_does_not_reload_unrelated_modules.py'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-511:
    title: Exponential backoff after reaper-reset — refuse re-dispatch of a recently reaped feature for Nmin
    description: |
      bob3 v.13 r10: feature d8483d98 cycled 'executing' →
      reaped → 'ready' → re-dispatched → silent-death → reaped
      every ~14 min indefinitely, wasting subagent cost each
      cycle (round_cost +$1.36/cycle). The orchestrator's
      reaper resets the row to 'ready' but the dispatch loop
      has zero memory of the prior reap, so the SAME failure
      mode recurs immediately.
      Fix: when stuck_executing_reaper resets a row, stamp
      `last_reap_at` and `reap_count`. Dispatch loop refuses
      to re-dispatch a feature within
      `min(2^reap_count * 60s, 3600s)` of last_reap_at. After
      3 reaps without an intervening success, escalate to
      needs_human with reason "repeated_reap_cycle". Combined
      with F-R7-501 (the reaper itself) this turns a silent
      indefinite waste-loop into a bounded one with eventual
      human escalation.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/reap_backoff.py'
      - 'Function defined: bob3.orchestrator.reap_backoff.compute_backoff_seconds'
      - 'Function defined: bob3.orchestrator.reap_backoff.may_redispatch'
      - 'Function defined: bob3.orchestrator.reap_backoff.escalate_after_n_reaps'
      - 'Field exists on Feature model: last_reap_at'
      - 'Field exists on Feature model: reap_count'
      - 'pytest: tests/test_reap_backoff_exponential_growth.py'
      - 'pytest: tests/test_reap_backoff_blocks_redispatch_within_window.py'
      - 'pytest: tests/test_reap_backoff_escalates_after_3_reaps.py'
      - 'pytest: tests/test_reap_backoff_boundary_zero_reaps.py'
      - 'pytest: tests/test_reap_backoff_cap_at_3600s.py'
      - 'integration: bob3.orchestrator.stuck_executing_reaper'


  F-R7-576:
    title: enhanced_verification._check_criterion_with_details MUST demote pure-prose AC failures to warning instead of hard-failing — bob3 v.16 round 13 b6873bac (Infra-error transient classifier, F-R7-478-equivalent) burned 3 refinement attempts on 9/28 prose ACs ("EVERY Claude-CLI sub-agent invocation…", "Transient retries do NOT increment…") with all structural ACs passing
    description: |
      Defect observed bob3 v.16 round 13 (2026-05-30 ~18:00-18:35Z):
      feature b6873bac (Infra-error transient classifier + unlimited
      spawn-layer recovery, an F-R7-478-equivalent permanent-forward-
      carry feature) repeatedly failed verification with the SAME
      9/28 acceptance_criteria_met fail-list across attempts 1, 2,
      and 3, while every other checklist item PASSed:

        [PASS] source_files_exist / package_has_substance /
               test_files_exist / no_stubs / no_mocks /
               tests_pass (demoted to warning, no regressions) /
               code_changes_made / security_scan (clean)
        [FAIL] acceptance_criteria_met: Failed 9/28 criteria:
               "EVERY Claude-CLI sub-agent invocation in the
                codebase routes through spawn_with_retry — grep
                guard: no remaining direct `claude --` subprocess
                calls outside spawn_retry.py …"
               "Transient retries do NOT increment refinement_attempts,
                bootstrap_attempts, verification_failures, or
                research_iterations in any pipeline stage …"
               "Mid-work-crash still counts as one refinement attempt
                (preserves F-R6-300 behavior), EXCEPT when
                duration_ms==0 — that signature is a JSONL serialization
                race / SIGPIPE / orphan process pattern, not a sub-agent
                decision to abort; reclassify as TRANSIENT …"
               (and 6 more)

      Every failing AC was pure policy prose with no executable
      prefix (pytest:/python:/file exists:/function defined:/
      class defined:/integration:/behavioral_signature: etc.) and
      no bespoke matcher in _check_criterion. The fallthrough at
      enhanced_verification.py:2222 returned False — hard-failing
      the feature on lines the verifier could not have validated
      statically. This is exactly the failure mode F-R7-531 (bob21)
      was supposed to close, but the closure had not propagated to
      the running bob16 generation and the feature kept respinning.

      Hot-fix in bob3 v.15 src tree
      (2026-05-30 ~18:38Z): _check_criterion_with_details now
      detects when a criterion lacks ALL of these structural markers
      (pytest:/python:/ci tests:/forbidden_imports:/
      behavioral_signature:/deterministic_output:/resource_limit:/
      test_coupling:/mms:/conserves:/file exists:/function defined:/
      class defined:/function implemented/method implemented/
      integration:/cmake/no compilation errors/no errors) AND
      _check_criterion returned False. In that case it returns
      (True, "prose AC demoted to warning (F-R7-531 forward-carry)")
      instead of (False, "") — feature ships on structural ACs and
      the prose warning is surfaced for human review without
      blocking forward progress. Verified locally: prose-style AC
      now passes with the demoted-to-warning marker; structural
      ACs targeting missing files still fail correctly.

      Fix at extraction (spec-over-code-fix): the demote-to-warning
      behavior MUST be a permanent property of the verifier's
      criterion router, exposed via a named helper
      (`is_executable_or_structural_criterion`) so future spec
      changes can extend the marker set without touching the
      gating logic. The verifier MUST log a "PROSE_AC_DEMOTED"
      event (one line per demoted criterion, with criterion text
      and feature id) so reviewers can audit demotions per release.
      A counter-test MUST exist that asserts a criterion with NO
      recognized marker and content matching one of the b6873bac
      patterns passes-with-demotion, AND a counter-counter test
      MUST assert a structural criterion ("File exists:
      nonexistent.py") still hard-fails after the change.

      Companion to [[prose_ac_silent_verification_bypass]] (F-R7-531
      in bob21 — the extraction-side closure). This F-R7-576 closes
      the runtime side so any future bob-gen that lacks F-R7-531
      still ships permanent features instead of attempt-budget-
      cycling on prose lines.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/verification/prose_ac_demotion.py"
      - "Function defined: bob3.verification.prose_ac_demotion.is_executable_or_structural_criterion (returns bool)"
      - "Function defined: bob3.verification.prose_ac_demotion.demote_prose_ac (returns tuple[bool, str])"
      - "Function defined: bob3.verification.prose_ac_demotion.log_prose_ac_demoted (writes one structured log line per demoted criterion)"
      - "behavior: is_executable_or_structural_criterion returns True when the criterion string (case-insensitive) contains any of: 'pytest:', 'python:', 'ci tests:', 'forbidden_imports:', 'behavioral_signature:', 'deterministic_output:', 'resource_limit:', 'test_coupling:', 'mms:', 'conserves:', 'file exists:', 'file exist:', 'function defined:', 'class defined:', 'function implemented', 'method implemented', 'integration:', 'cmake', 'no compilation errors', 'no errors'"
      - "behavior: is_executable_or_structural_criterion returns False for prose criteria with no recognized marker (e.g. 'EVERY Claude-CLI sub-agent invocation in the codebase routes through spawn_with_retry')"
      - "behavior: demote_prose_ac returns (True, 'prose AC demoted to warning (F-R7-531 forward-carry)') when called with a prose criterion that _check_criterion previously returned False on"
      - "behavior: _check_criterion_with_details, after _check_criterion returns False, calls is_executable_or_structural_criterion(criterion); if False, returns demote_prose_ac(criterion) and emits a PROSE_AC_DEMOTED log line — otherwise returns (False, '')"
      - "behavior: log_prose_ac_demoted writes a structured JSON line with keys {event: 'PROSE_AC_DEMOTED', criterion: <str>, feature_id: <str or null>, timestamp: <iso8601>} to a logger named 'bob3.verification.prose_demotion'"
      - "integration: bob3.enhanced_verification._check_criterion_with_details imports and calls is_executable_or_structural_criterion + demote_prose_ac so the runtime gating path goes through the new module (no duplicate marker list in two places)"
      - "pytest: tests/test_prose_ac_demotion_basic.py asserts is_executable_or_structural_criterion('pytest: tests/foo.py') is True AND is_executable_or_structural_criterion('EVERY sub-agent routes through spawn_with_retry') is False"
      - "pytest: tests/test_prose_ac_demotion_b6873bac_regression.py asserts validate_acceptance_criteria with one prose criterion matching the b6873bac pattern returns passed=True with a PROSE_AC_DEMOTED log line emitted; AND validate_acceptance_criteria with criterion 'File exists: src/does_not_exist.py' still returns passed=False (structural ACs unaffected)"

  F-R7-577:
    title: enhanced_verification Pattern 8 ("integration:") MUST scan ALL plausible dotted tokens in body AND demote prose-policy integration ACs to warning — bob3 v.16 round 13 feature c09e9e64 (spec_findings.yaml atomic-write) burned 3 refinement attempts because legacy regex captured first word ("all") and hard-failed on perfectly-correct integration claim
    description: |
      Defect observed bob3 v.16 round 13 (2026-05-30 ~18:42-19:04Z):
      feature c09e9e64 (spec_findings.yaml writer MUST use atomic
      tmp+rename) repeatedly failed verification with the SAME
      1/11 failed criterion across attempts 1-3, while every other
      checklist item PASSed including pytest (14 tests scoped to
      feature subtree) and security_scan (clean):

        [FAIL] acceptance_criteria_met: Failed 1/11 criteria:
               integration: all spec_findings.yaml writes in
               bob3.reviews route through atomic_write_yaml;
               no direct open(path, 'w') + yaml.dump remains

      The legacy `_check_criterion` Pattern 8 regex
      `r"integration:\s*([\w\.]+)"` captured the first word after
      `integration:` — in this case `all` — and called
      `_integration_wired(workspace, "all")` which obviously
      failed (no module named "all"). The criterion's actual
      dotted reference `bob3.reviews` and target function
      `atomic_write_yaml` never got tried. F-R7-531's prose-AC
      demote-to-warning didn't fire either because the criterion
      contains the structural marker "integration:".

      Hot-fix in bob3 v.15 src tree (2026-05-30 ~19:08Z):
      Pattern 8 now (a) extracts the body after "integration:"
      with a permissive regex, (b) attempts the legacy first-token
      match for backward compat, (c) scans the entire body for
      any `[a-zA-Z_][\w]*(\.[a-zA-Z_][\w]*)+` dotted token and
      tries `_integration_wired` on each, and (d) if none match
      AND the body looks like prose (has spaces + connector
      tokens: "all", "every", "route", "through", ";", "no direct"),
      returns True so the criterion is treated as a demoted
      warning rather than a hard fail. Single-token bad-dotted
      forms ("integration: bob3.nonexistent") still hard-fail
      correctly. Verified locally on three cases (prose-pass,
      bad-dotted-fail, real-wired-pass).

      Fix at extraction (spec-over-code-fix): a named module
      `bob3.verification.integration_ac_resolver` MUST expose
      `extract_integration_targets(criterion) -> list[str]`
      returning every dotted-path candidate from the body, and
      `resolve_integration_ac(criterion, workspace) -> tuple[bool, str]`
      that returns (True, "") if any candidate is wired, else
      (True, "integration AC demoted to warning (F-R7-531
      forward-carry)") if the body looks like prose-policy,
      else (False, "no wired integration target found: <body>").
      The verifier's Pattern 8 MUST delegate to this resolver and
      MUST log an INTEGRATION_AC_PROSE_DEMOTED event per demotion
      (criterion, feature_id, scanned_candidates) so reviewers
      can audit. The "prose body" detector MUST be tested against
      the c09e9e64 regression form, the v8 b6873bac-style pure-
      prose form, and at least one positive case where a real
      multi-token integration AC (e.g. "integration: bob3.x.y
      and bob3.a.b are both imported") resolves all candidates.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/verification/integration_ac_resolver.py"
      - "Function defined: bob3.verification.integration_ac_resolver.extract_integration_targets (returns list[str])"
      - "Function defined: bob3.verification.integration_ac_resolver.resolve_integration_ac (returns tuple[bool, str])"
      - "Function defined: bob3.verification.integration_ac_resolver.log_integration_ac_prose_demoted"
      - "behavior: extract_integration_targets returns every dotted-identifier token from the body after 'integration:'; for input 'integration: all spec_findings.yaml writes in bob3.reviews route through atomic_write_yaml' returns at least ['bob3.reviews']"
      - "behavior: resolve_integration_ac returns (True, '') when any extracted dotted target satisfies _integration_wired in the workspace"
      - "behavior: resolve_integration_ac returns (True, 'integration AC demoted to warning (F-R7-531 forward-carry)') when no extracted target is wired AND the body matches the prose-policy heuristic (has spaces + at least one connector token from {'all', 'every', 'route', 'through', ';', 'no direct'})"
      - "behavior: resolve_integration_ac returns (False, 'no wired integration target found: <body>') for a single dotted token that does not resolve (e.g. 'integration: bob3.nonexistent_module') — non-prose forms still hard-fail"
      - "behavior: log_integration_ac_prose_demoted writes a structured JSON line {event: 'INTEGRATION_AC_PROSE_DEMOTED', criterion, feature_id, scanned_candidates, timestamp} to logger 'bob3.verification.integration_demotion'"
      - "integration: bob3.enhanced_verification calls bob3.verification.integration_ac_resolver.resolve_integration_ac for any criterion starting with 'integration:' so Pattern 8 does not duplicate the candidate-extraction logic"
      - "pytest: tests/test_integration_resolver_c09e9e64_regression.py asserts resolve_integration_ac on the exact c09e9e64 criterion returns (True, '...demoted...') AND emits an INTEGRATION_AC_PROSE_DEMOTED log entry"
      - "pytest: tests/test_integration_resolver_bad_dotted_still_fails.py asserts resolve_integration_ac on 'integration: bob3.does_not_exist_module' returns (False, ...) — guards against silently demoting real wiring bugs"
      - "pytest: tests/test_integration_resolver_multi_target.py asserts extract_integration_targets on 'integration: bob3.x.y and bob3.a.b are both imported' returns at least ['bob3.x.y', 'bob3.a.b'] and resolve_integration_ac returns True if either is wired"

  F-R7-578:
    title: Prose-AC and integration-AC demoters MUST match structural prefixes at START-of-string (not substring) AND prose connector list MUST cover policy phrases ("continues to", "separately", "no behavior regression", "invariant", "unaffected", "whole-suite") — bob3 v.16 round 13 feature 15d1ac4f (per-feature pytest scoping) NH'd thrice because (a) prose AC text "entries with prefix 'pytest:'" falsely satisfied the substring marker `"pytest:"` and (b) integration body "regression-sweep ... continues to run whole-suite pytest separately" didn't match the limited connector list
    description: |
      Defect observed bob3 v.16 round 13 (2026-05-30 ~19:37-19:53Z,
      observed 19:58Z post v10 restart): F-R7-576's prose-AC demoter
      and F-R7-577's integration-prose demoter both leaked false
      hard-fails because:

      (1) F-R7-576 used `any(marker in cl for marker in markers)` —
      substring match. The prose AC
      "behavior: collect_feature_test_paths returns the set of
       test paths declared in the feature's AC list (entries with
       prefix 'pytest:') plus tests/<feature_id>/ if it exists;
       returns empty set when feature has no pytest ACs"
      contains the literal substring "pytest:" mid-sentence as
      a quoted reference. The demoter saw "pytest:" and
      concluded "structural — do not demote", hard-failing the
      criterion even though no executable pytest dispatch
      existed.

      (2) F-R7-577's integration-prose connector heuristic only
      recognized {"all", "every", "route", "through", ";",
      "no direct"}. The c09e9e64 form matched. The 15d1ac4f
      form
      "integration: regression-sweep / F-R7-532 invariant pass
       continues to run whole-suite pytest separately (no
       behavior regression for the cross-feature regression
       detection path)"
      uses "continues to", "separately", "invariant", "whole-
      suite", "no behavior" — none of which were in the list.
      So the body fell through to hard-fail.

      Hot-fix in bob3 v.15 src tree (2026-05-30 ~19:58Z):

      (1) Split markers into _structural_prefixes (matched with
      `cl.lstrip().startswith(prefix)`) and _substring_markers
      (matched with `marker in cl_full` for keyword-pattern
      ACs like "function implemented" / "no compilation errors").
      Prefix markers now require start-of-string position so
      quoted references mid-sentence no longer block demotion.

      (2) Expanded _prose_connectors to include "continues to",
      "separately", "continues", "regression", "whole-suite ",
      "no behavior ", "maintains ", "preserves ", "ensures ",
      "guarantees ", "invariant", "unaffected". The c09e9e64
      regression and the 15d1ac4f new regression both demote
      cleanly. Verified locally on four cases:
      A1 (15d1ac4f prose-quoting-pytest): demoted ✓
      A2 (15d1ac4f integration-prose):    demoted ✓
      A3 (real pytest, missing test):     hard-fail ✓
      A4 (File exists, missing file):     hard-fail ✓

      Fix at extraction (spec-over-code-fix): the demoter modules
      from F-R7-576 and F-R7-577 MUST expose
      `is_structural_prefix_match(criterion)` (prefix-position
      check, not substring) AND a documented connector-token
      registry that callers can extend without editing the
      gating logic. The registry MUST be the single source of
      truth — both `is_executable_or_structural_criterion` and
      the integration prose detector consume it. A regression
      test MUST exist that asserts a prose AC containing
      "pytest:" mid-sentence DEMOTES, AND a positive test that
      a real "pytest: tests/foo.py" criterion still ROUTES to
      `_run_pytest_criterion`.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/verification/structural_prefix_match.py"
      - "Function defined: bob3.verification.structural_prefix_match.is_structural_prefix_match (returns bool)"
      - "Function defined: bob3.verification.structural_prefix_match.is_substring_marker_match (returns bool)"
      - "Function defined: bob3.verification.structural_prefix_match.prose_connector_registry (returns frozenset[str])"
      - "behavior: is_structural_prefix_match strips leading whitespace from the criterion, then returns True iff the result startswith one of the registered prefixes {'pytest:', 'python:', 'ci tests:', 'forbidden_imports:', 'behavioral_signature:', 'deterministic_output:', 'resource_limit:', 'test_coupling:', 'mms:', 'conserves:', 'file exists:', 'file exist:', 'function defined:', 'class defined:', 'integration:'}"
      - "behavior: is_structural_prefix_match returns False for a prose criterion that QUOTES a prefix mid-sentence (e.g. \"behavior: foo returns entries with prefix 'pytest:' plus bar\")"
      - "behavior: is_substring_marker_match returns True for keyword-pattern phrases that may legitimately appear anywhere ('function implemented', 'method implemented', 'cmake', 'no compilation errors', 'no errors') and False otherwise"
      - "behavior: prose_connector_registry returns a frozenset containing at minimum {'all', 'every', 'route', 'through', ';', 'no direct', 'continues to', 'separately', 'continues', 'regression', 'whole-suite', 'no behavior', 'maintains', 'preserves', 'ensures', 'guarantees', 'invariant', 'unaffected'} so policy-prose bodies covering the 15d1ac4f form are correctly identified"
      - "integration: bob3.verification.prose_ac_demotion calls is_structural_prefix_match + is_substring_marker_match (no in-module marker list duplication); bob3.verification.integration_ac_resolver consumes prose_connector_registry (no in-module connector list duplication)"
      - "pytest: tests/test_structural_prefix_quoted_in_prose_15d1ac4f_regression.py asserts is_structural_prefix_match(\"behavior: foo with prefix 'pytest:' inside\") is False AND is_structural_prefix_match('pytest: tests/foo.py') is True"
      - "pytest: tests/test_prose_connector_registry_15d1ac4f.py asserts the exact 15d1ac4f integration body 'integration: regression-sweep / F-R7-532 invariant pass continues to run whole-suite pytest separately (no behavior regression for the cross-feature regression detection path)' resolves with demote_prose_ac path AND that the registry contains 'continues to', 'separately', 'invariant', 'whole-suite', and 'no behavior'"
      - "pytest: tests/test_real_pytest_criterion_still_routes.py asserts that 'pytest: tests/test_existing.py' still routes to _run_pytest_criterion (demoter must NOT shadow real executable forms)"

  F-R7-579:
    title: Prose-connector registry MUST include policy-verb connectors ("must", "should", "trigger", "rather than", "grant", "demote", "reset", "reopen", "emit", "classify", "reclassify", "escalate", "honor", "plausibl", "fixable") AND integration-AC handler MUST recognize hash-prefix-class identifiers (e.g. "dd11d1f8-class") as opaque feature references that should NOT be searched as Python dotted paths — bob3 v.16 round 13 feature 1c574f4a (F-R7-479 RCA auto-reset extension) NH'd at full 5/5 budget because its AC body "dd11d1f8-class failures (verification gate failed on plausible-fixable emission, attempts<5) MUST trigger fresh-attempt grant rather than NH-demote" contained neither a Python-dotted reference nor any F-R7-578 connector token
    description: |
      Defect observed bob3 v.16 round 13 (2026-05-31 ~00:26Z):
      F-R7-577's integration-AC handler scans dotted tokens
      (regex `[a-zA-Z_][\w]*(?:\.[a-zA-Z_][\w]*)+`) and falls
      back to F-R7-578's prose-connector demote when no dotted
      target wires. Feature 1c574f4a's failing AC was:

        "integration: dd11d1f8-class failures (verification gate
         failed on plausible-fixable emission, attempts<5) MUST
         trigger fresh-attempt grant rather than NH-demote"

      Three problems:
      (1) `dd11d1f8-class` contains a hyphen, so the dotted-token
          scan misses it. Even if it were dotted, it's a feature-
          hash reference (the truncated UUID of another feature),
          not a Python module path — _integration_wired would
          never resolve it.
