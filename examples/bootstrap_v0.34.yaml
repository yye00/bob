  F-R7-476:
    title: GPU/Triton kernel synthesis + autotune sub-agent
    description: |
      When a feature's AC mentions GPU kernel, Triton, CUDA, ROCm, or
      "@triton.jit", the implementer routes through a specialized
      sub-agent that synthesizes a Triton kernel, wraps it in
      @triton.autotune over BLOCK_M/BLOCK_N/BLOCK_K/num_warps/num_stages,
      sweeps on the visible accelerator, persists the winning config,
      and gates on numerical correctness vs a CPU torch reference.

      Restores the GPU code-generation capability that v0.10 had and
      was dropped during v0.11 spec compaction.

      Source: OpenAI Triton (Tillet et al. 2019); triton.autotune docs.
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/implementers/triton_kernel.py'
      - 'Function defined: bob3.implementers.triton_kernel.is_gpu_feature (returns bool)'
      - 'Function defined: bob3.implementers.triton_kernel.gpu_keyword_set (returns frozenset of GPU-detection keywords {triton, cuda, rocm, @triton.jit, GPU kernel})'
      - 'Function defined: bob3.implementers.triton_kernel.synthesize_kernel (returns Python source containing @triton.jit kernel + Python launcher)'
      - 'Function defined: bob3.implementers.triton_kernel.autotune_kernel (returns AutotuneResult dataclass: best_config, all_timings, hardware_label)'
      - 'Function defined: bob3.implementers.triton_kernel.verify_numerical (returns NumericalReport dataclass: max_abs_err, max_rel_err)'
      - 'Function defined: bob3.implementers.triton_kernel.default_sweep_space (returns dict with BLOCK_M in [32,64,128], BLOCK_N in [32,64,128], num_warps in [2,4,8], num_stages in [2,3,4])'
      - 'Function defined: bob3.implementers.triton_kernel.hardware_fallback_order (returns tuple "CUDA", "ROCm", "Triton-CPU")'
      - 'Function defined: bob3.implementers.triton_kernel.handle_no_accelerator (sets feature.status to "ready" with halt_reason="no_accelerator_visible")'
      - 'Function defined: bob3.implementers.triton_kernel.persist_winning_config (writes runs/<feature>/triton_config.yaml with keys best_config, hardware_label, ms_per_call, all_timings)'
      - 'Function defined: bob3.implementers.triton_kernel.gate_on_numerical_correctness (raises NumericalGateError when max_abs_err > atol or max_rel_err > rtol)'
