       - src/bob3/orchestrator/run_loop.py (~line 5162): translate
         termination_name "ALL_BLOCKED" → "QUEUE_DRAINED" in the
         "Run finished: termination=%s ..." log line.
       - src/bob3/cli/__init__.py (~line 1037): CLI message becomes
         "Queue drained — no ready features left to claim
         (remaining are needs_human/executing/blocked)."

      Enum value `LoopTermination.ALL_BLOCKED = "all_blocked"` is unchanged
      (preserves DB / serialization compat). Only the user-visible string and
      log token differ. Spec-carry into bob3 v.19 so the regenerated tree
      keeps the rename.

    priority: low
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: src/bob3/orchestrator/run_loop.py emits a 'Run finished: termination=%s' log line"
      - "behavior: when the loop exits with LoopTermination.ALL_BLOCKED the emitted termination token in the log MUST be 'QUEUE_DRAINED' (not 'ALL_BLOCKED')"
      - "behavior: the CLI termination message for ALL_BLOCKED MUST mention 'Queue drained' and MUST NOT use the phrase 'All remaining features are blocked'"
      - "behavior: the enum value LoopTermination.ALL_BLOCKED == 'all_blocked' is preserved (DB compatibility — do NOT rename the member or change its string value)"
      - "integration: pytest tests/test_termination_label_rename.py::test_log_says_queue_drained passes — invoke the run-finished logger with termination=ALL_BLOCKED and assert 'QUEUE_DRAINED' in the formatted record"
      - "integration: pytest tests/test_termination_label_rename.py::test_cli_message_says_queue_drained passes — assert the CLI message string for ALL_BLOCKED contains 'Queue drained'"

  F-R7-587:
    title: Final reaper sweep on orchestrator exit — ALL_BLOCKED/BUDGET_EXCEEDED termination MUST flip orphan 'executing' rows to 'failed' before returning
    description: |
      bob3 v.17 r1+r2: orchestrator exited ALL_BLOCKED with 5 rows still in
      status='executing' (94c9de63, 14298e1d, b394aa24, 97fe3ec0, 630e1914).
      Their sub-agents had died/exited; orchestrator's main loop terminated
      before the F-R7-501 reaper could re-sweep. Cosmetic for the frozen gen
      but it pollutes inter-gen status reports (counts read "5 executing"
      forever).

      Hot-fix: in run_loop._run_locked, immediately before the function
      returns its LoopTermination, invoke the orphan-reaper one last time
      (sweep_orphan_subagents + flip orphans to 'failed' with reason
      'orchestrator_exit_during_execution'). Idempotent and safe — same
      reaper that runs in the main loop tick.

    priority: medium
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: src/bob3/orchestrator/run_loop.py defines a function _final_exit_sweep that runs after the main loop's last iteration"
      - "behavior: when run_loop terminates via ALL_BLOCKED with any feature in status='executing' whose claude/subagent PID is no longer alive, _final_exit_sweep MUST flip those rows to status='failed' before returning"
      - "behavior: _final_exit_sweep MUST be idempotent — calling it twice in a row with no state change yields zero additional DB writes"
