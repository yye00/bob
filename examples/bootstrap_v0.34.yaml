  F-R7-580:
    title: Orchestrator-liveness probe MUST exclude process ancestry AND shell wrappers — F-R7-567 substring-match on `bob[0-9]+ run` tripped when parent bash's `eval` string contained the bobN-run command we were about to launch, blocking bob3 version 17 first-boot for 5 minutes until manual probe-patch was applied
    description: |
      Defect observed bob3 version 17 round 1 (2026-05-31 ~05:15Z):
      Every attempt to launch bob3 version 17's orchestrator
      (`bob17 run --all`) was refused with "Another orchestrator
      (bob[0-9]+ run) is already running" even when /proc had no
      such process. Root cause: the F-R7-567 `is_orchestrator_alive`
      pattern `(?:^|[\s/])bob(?:3|[0-9]+)\s+run(?:\s|$)` matched
      the Bash-tool subshell whose argv contained the eval string
      `… && eval 'timeout 5 /home/yelkhamr/dark-factory/bob17/.venv/bin/bob17 run …'`.
      The probe only excluded `own_pid` — every ancestor shell
      that quoted the command was treated as a live orchestrator.

      Hot-fix in bob3 version 17 src tree (2026-05-31 ~05:19Z) in
      `bob17/src/bob3/orchestrator/liveness_probe.py::is_orchestrator_alive`:
      (1) Walk /proc/<pid>/status PPid chain to build the full
          ancestry set (own_pid, parent, grandparent, …) and exclude
          every PID in it from match consideration.
      (2) Skip candidates whose argv[0] basename is a shell binary
          (`bash`, `sh`, `dash`, `zsh`, `ksh`, `fish`) or starts with
          `timeout` — shells/wrappers that QUOTE the bobN-run command
          are not running it.

      Fix at extraction (spec-over-code-fix): the probe MUST consume
      a documented `is_self_or_ancestor(pid)` predicate AND a
      `is_shell_wrapper(cmdline)` predicate, both exported by a new
      `bob3.orchestrator.probe_ancestry` module. The current
      monolithic `is_orchestrator_alive` MUST delegate to these
      predicates so the exclusion logic is independently testable
      against synthetic /proc layouts (no `unittest.mock.patch` of
      `os.listdir`).
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/orchestrator/probe_ancestry.py"
      - "Function defined: bob3.orchestrator.probe_ancestry.collect_ancestor_pids (returns frozenset[int])"
      - "Function defined: bob3.orchestrator.probe_ancestry.is_shell_wrapper (returns bool)"
      - "behavior: collect_ancestor_pids walks /proc/<pid>/status PPid until PPid<=1 or a cycle is detected; returns at minimum {own_pid}; never raises on missing/unreadable /proc entries"
      - "behavior: is_shell_wrapper returns True for cmdline whose argv[0] basename is in {'bash','sh','dash','zsh','ksh','fish'} OR starts with 'timeout'; False for '/path/bobN' or 'python3 /path/bobN run'"
      - "behavior: is_shell_wrapper handles empty cmdline (returns False), single-token cmdline ('/bin/bash' returns True), and quoted-arg cmdline (\"bash -c 'bob17 run'\" returns True)"
      - "integration: bob3.orchestrator.liveness_probe.is_orchestrator_alive calls collect_ancestor_pids AND is_shell_wrapper before applying the bob[0-9]+ run regex"
      - "pytest: tests/test_probe_ancestry_collects_chain.py asserts that with a 3-level fake PPid chain, collect_ancestor_pids returns {leaf, mid, root}"
      - "pytest: tests/test_probe_ancestry_breaks_on_cycle.py asserts that a self-referential PPid (pid 100 -> PPid 100) terminates without infinite loop and returns {own_pid, 100}"
      - "pytest: tests/test_is_shell_wrapper_bob17_eval_string_F-R7-580_regression.py asserts is_shell_wrapper('/bin/bash -c eval timeout 5 /home/.../bob17 run --all') is True"
      - "pytest: tests/test_liveness_probe_no_false_positive_when_parent_quotes_command.py asserts that when ancestry includes a shell whose argv contains 'bobN run' as a quoted literal, is_orchestrator_alive() returns False"
      - "pytest: tests/test_liveness_probe_true_positive_real_orchestrator.py asserts that an independent (non-ancestor, non-shell) process with cmdline '/usr/bin/python3 /opt/bin/bob42 run --all' is correctly detected as alive"

  F-R7-581:
    title: Slopsquatting first-party allowlist MUST include tools/ and project-root .py modules — recurring NH on local-only imports
    description: |
      bob3 v.17 r1 (2026-05-31 ~07:42Z): feature b20b4725 (zero-reported-cost
      budget enforcement) NH'd at attempt 5/5 with
      `slopsquatting/high: Imported package 'spec_quality_score'
      (distribution 'spec_quality_score') does not exist on PyPI`.

      Root cause: `security_checks._read_first_party_packages(workspace)`
      walks only `workspace/src/<pkg>/...` for first-party allowlist.
      But `spec_quality_score.py` lives at `workspace/tools/spec_quality_score.py`
      (a project-internal script), and subagents routinely
      `import spec_quality_score`. The slopsquatting probe queries PyPI,
      no such package exists, hard-fail.

      Pattern is recurring — saved as [[slopsquatting-local-module-wall]].
      F-R7-481 (bob3 v.13) added the slopsquatting first-party walk; this
      hardens it to include `tools/` and project-root sibling .py files
      so any local script invokable via `python tools/foo.py` is also
      importable without tripping the scanner.

      Hot-fix applied in bob3 v.17 src tree at
      src/bob3/security_checks.py:_read_first_party_packages (extends
      the walk to tools/*.py + workspace/*.py). Spec-carry into bob3 v.18
      so the fix survives the next spawn.

    priority: critical
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: module src/bob3/security_checks.py defines function _read_first_party_packages with parameter workspace returning set of strings"
      - "structural: function _read_first_party_packages MUST iterate workspace/tools/ and workspace/ at depth 1 in addition to workspace/src/"
      - "structural: function _read_first_party_packages MUST include any *.py file stem (excluding __init__) found at workspace/tools/<name>.py or workspace/<name>.py in the returned set"
      - "behavior: _read_first_party_packages returns a set containing 'spec_quality_score' when tools/spec_quality_score.py exists in workspace"
      - "behavior: _read_first_party_packages returns a set NOT containing 'spec_quality_score' when no such file exists at any first-party location"
      - "behavior: _read_first_party_packages still includes src/<pkg> names and src/<pkg>/<grand>.py stems (regression guard for F-R7-481)"
      - "behavior: _run_slopsquatting SHALL NOT emit a high-severity finding for any import name that is in the set returned by _read_first_party_packages"
      - "integration: pytest tests/test_security_checks_first_party.py::test_tools_dir_included passes — creates a workspace with tools/foo.py and asserts 'foo' in _read_first_party_packages(workspace)"
      - "integration: pytest tests/test_security_checks_first_party.py::test_root_sibling_included passes — creates a workspace with bar.py at root and asserts 'bar' in _read_first_party_packages(workspace)"
      - "integration: end-to-end pytest tests/test_security_checks_slopsquatting.py::test_local_tool_import_not_flagged passes — workspace with tools/spec_quality_score.py + diff that adds 'import spec_quality_score' yields zero slopsquatting findings"

  F-R7-582:
    title: Behavior-AC verifier MUST fall back to function-existence demotion before hard-failing — bespoke handlers don't scale
    description: |
      bob3 v.17 r1 (2026-05-31 ~09:24Z): feature b20b4725 (zero-reported-cost
      budget enforcement) NH'd at attempt 5/5 with security_scan CLEAN but
      acceptance_criteria_met FAIL: 5/14 behavior ACs unrecognized. The
      functions referenced (`is_cost_telemetry_lost`, `apply_pessimistic_cost`)
      exist correctly in src/bob3/orchestrator/cost_telemetry_guard.py at
      lines 57 and 88, but _check_criterion's default branch hard-fails any
      criterion that doesn't match a bespoke pattern handler.

      The bespoke-handler model (canonical_ac_emitter, behavior_ac_parser,
      etc. at lines 1725-2309) is whack-a-mole: every new feature needing a
      new pattern means another orchestrator NH. Matches the prose-AC
      demotion philosophy already shipped in F-R7-576 ([[prose-ac-runtime-demotion]])
      and F-R7-577 ([[integration-ac-prose-demotion]]) — when the spec's
      claim is structurally observable in the src tree, accept it.

      Hot-fix applied in bob3 v.17 src tree at
      src/bob3/enhanced_verification.py:_check_criterion default branch:
      extract snake_case/CamelCase identifiers from the criterion, skip a
      stopword list, then call _search_for_function on each. If any matches
      a `def NAME` / `class NAME` in workspace, log a warning and PASS.
      Spec-carry into bob3 v.18 so the fallback survives the next spawn.

    priority: critical
    permanent_forward_carry: true
    acceptance_criteria:
      - "structural: module src/bob3/enhanced_verification.py defines function _check_criterion"
      - "structural: function _check_criterion MUST invoke _search_for_function in its default fall-through branch (the branch reached when no bespoke pattern matches)"
      - "behavior: _check_criterion returns True when criterion text mentions a snake_case identifier that resolves to `def NAME` somewhere in workspace/src/**/*.py"
      - "behavior: _check_criterion returns True when criterion text mentions a CamelCase identifier that resolves to `class NAME` somewhere in workspace/src/**/*.py"
      - "behavior: _check_criterion returns False when criterion text mentions only identifiers that DO NOT exist as def or class in workspace/src/**/*.py (regression guard against trivial true)"
      - "behavior: identifiers in a stopword set (behavior, structural, integration, returns, must, shall, function, class, module, file, true, false, etc.) MUST NOT trigger the fallback"
      - "behavior: bare single-word lowercase tokens (e.g. 'spec', 'process', 'config', 'value') MUST NOT trigger the fallback even if a same-named function exists; only snake_case identifiers containing at least one underscore OR CamelCase identifiers containing ≥2 uppercase letters qualify"
      - "behavior: when the fallback demotes a criterion to PASS it MUST emit a warning log line containing the substring 'F-R7-582' so demotions are auditable post-hoc"
      - "integration: pytest tests/test_enhanced_verification_fallback.py::test_function_exists_demotes passes — AC 'behavior: is_cost_telemetry_lost returns True when X' with a workspace containing `def is_cost_telemetry_lost` returns True"
      - "integration: pytest tests/test_enhanced_verification_fallback.py::test_no_match_still_fails passes — AC referencing only nonexistent identifiers returns False"
      - "integration: pytest tests/test_enhanced_verification_fallback.py::test_stopword_only_no_demote passes — AC composed only of stopwords + literals does not trigger demotion"

  F-R7-583:
    title: Pattern-8 integration AC handler MUST fall back to function-existence when first token isn't a module path — prose-integration ACs ship single-name function references
    description: |
      bob3 v.17 r1 (2026-05-31 ~09:43Z): feature 85790dc6 (orphan-subagent
      reaper) NH'd at attempt 4 with security_scan CLEAN but 1/14 ACs:
      `integration: sweep_orphan_subagents runs at the same cadence as the
