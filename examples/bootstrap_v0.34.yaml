      - 'Function defined: bob3.db.regression_ownership.record_unattributed_failure (writes row to unattributed_failures table)'
      - 'Function defined: bob3.db.regression_ownership.never_demotes_arbitrary_feature (returns True; documents record_unattributed_failure leaves all feature statuses untouched)'
      - 'Function defined: bob3.db.regression_ownership.may_demote_to_regression (returns True iff the feature owns at least one newly-failing test)'
