  F-R7-563:
    title: Per-feature subagent cost cap (default $10) — single subagent attempt currently has no per-feature ceiling, enabling runaway burn ($38 in 5min observed) when telemetry healthy
    description: |
      bob3 v.15 r12 (observed 2026-05-29 ~20:03 UTC monitor window):
      cost spiked $34.46 → $72.71 (+$38.25 in 5min) for a single
      subagent attempt on a feature in the refinement loop. The
      outer `bob3 run --all --max-cost 1000` flag caps TOTAL run
      cost but NOT per-feature attempts. A pathological subagent
      (genuine deep-think loop, runaway tool calls, etc.) can
      consume tens of dollars on a single attempt before either
      attempts-cap or run-cost-cap kicks. Cumulative chain cost
      $2762.93 across 49 features = avg $56/feature; one runaway
      attempt at $38 dwarfs the median.

      Fix at extraction (spec-over-code-fix): introduce a per-
      feature-attempt cost cap (default $10, env
      BOB3_PER_ATTEMPT_COST_CAP overrides, clamped [0.5, 100]).
      The orchestrator MUST send SIGTERM to a subagent whose
      reported cost crosses the cap mid-attempt (15s grace then
      SIGKILL). The attempt is counted (charges refinement
      budget per F-R7-561 lossless-cost rules) and the feature
      transitions back to ready for next attempt OR NH if attempts
      cap reached. Audit log records sentinel
      subagent_killed_on_attempt_cost_cap=<feature_id>:<cost>.
    risk_category: medium
    acceptance_criteria:
      - "File exists: src/bob3/orchestrator/per_attempt_cost_cap.py"
      - "Function defined: bob3.orchestrator.per_attempt_cost_cap.get_per_attempt_cap"
      - "Function defined: bob3.orchestrator.per_attempt_cost_cap.should_terminate_subagent"
      - "Function defined: bob3.orchestrator.per_attempt_cost_cap.terminate_subagent_on_cost_cap"
      - "behavior: get_per_attempt_cap returns float(env BOB3_PER_ATTEMPT_COST_CAP) clamped to [0.5, 100], default 10.0"
      - "behavior: should_terminate_subagent returns True iff reported_attempt_cost > get_per_attempt_cap()"
      - "behavior: terminate_subagent_on_cost_cap sends SIGTERM, waits 15s, SIGKILL if alive; appends sentinel subagent_killed_on_attempt_cost_cap=<feature_id>:<cost> to feature audit log"
      - "behavior: charges a refinement attempt (does NOT free-retry) per F-R7-561 lossless-cost rules"
      - "integration: bob3.orchestrator.run_loop periodically (every 30s) checks live subagent reported cost against cap; terminates when exceeded"
      - "pytest: tests/test_per_attempt_cost_cap_get.py asserts default 10.0 with no env"
      - "pytest: tests/test_per_attempt_cost_cap_get.py asserts env=200 clamped to 100 (boundary)"
      - "pytest: tests/test_per_attempt_cost_cap_get.py asserts env=0 clamped to 0.5 (error/boundary path)"
      - "pytest: tests/test_per_attempt_cost_cap_terminates.py asserts subagent SIGTERM'd when reported_cost > cap"

  F-R7-564:
    title: readiness_score MUST be rederived from current confidence components on each refinement attempt — currently stored as decaying state, ratcheting feature toward terminal demotion regardless of fresh signal
    description: |
      bob3 v.14 src inspection: run_loop._decay_confidence_after_failure
      drops readiness by 0.15 per failure but the inverse (readiness
      RECOMPUTE from improved confidence components) never fires
      during the refinement loop. db.calculate_readiness is only
      called at feature CREATION. F-R7-479 RCA auto-reset bounces
      the feature back to ready and resets attempts=0 but does NOT
      restore the decayed readiness_score nor recompute it from
      current confidence values. Net effect: a feature that crashes
      twice has readiness=0.85→0.70→0.55→0.40 monotonically, no
      matter what subsequent attempts achieve. The 5-attempt cap
      and the decomposition gate both depend on readiness signal,
      so the ratchet silently steers every flaky-but-recoverable
      feature into needs_human terminal state.

      Fix at extraction (spec-over-code-fix): readiness_score MUST
      be DERIVED, not STORED-AND-DECAYED. Every read of
      readiness_score MUST be the live recomputation:
      mean(conf_impl_correctness, conf_spec_understanding,
      conf_test_quality) — or whatever current component set
      calculate_readiness uses. Confidence components themselves
      may decay (those are signal); readiness aggregates them at
      read time. _decay_confidence_after_failure decays components
      ONLY; it no longer writes readiness_score. F-R7-479 auto-
      reset restores baseline confidence (snapshot at feature
      creation) when classified as infra/transient.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/db/readiness_recompute.py"
      - "Function defined: bob3.db.readiness_recompute.compute_live_readiness"
      - "Function defined: bob3.db.readiness_recompute.snapshot_baseline_confidence"
      - "Function defined: bob3.db.readiness_recompute.restore_baseline_confidence"
      - "behavior: compute_live_readiness reads conf_impl_correctness, conf_spec_understanding, conf_test_quality from the feature row and returns the canonical aggregate (mean by default)"
      - "behavior: snapshot_baseline_confidence stores (conf_impl_correctness, conf_spec_understanding, conf_test_quality) at feature creation as baseline_conf_* columns OR a serialized baseline_confidence JSON column"
      - "behavior: restore_baseline_confidence rewrites the live conf_* columns from the baseline snapshot; called by F-R7-479 auto-reset path"
      - "integration: bob3.orchestrator.run_loop _decay_confidence_after_failure decays component conf_* values but does NOT write readiness_score; readiness is rederived on read"
      - "integration: bob3.orchestrator.rca_infra_recovery.auto_reset_if_infra calls restore_baseline_confidence when transitioning needs_human→ready"
      - "integration: every read of feature.readiness_score in run_loop goes through compute_live_readiness; the column may remain in the DB schema for compatibility but its persisted value is ignored"
      - "pytest: tests/test_readiness_live_recompute.py asserts a feature whose conf_impl=0.9 conf_spec=0.9 conf_test=0.9 reads readiness=0.9 even if persisted readiness_score=0.1 (decayed)"
      - "pytest: tests/test_readiness_decay_no_ratchet.py asserts 2 successive failures decay components but a subsequent baseline restore returns readiness to the original value"
      - "pytest: tests/test_readiness_baseline_snapshot.py asserts snapshot_baseline_confidence at creation captures the original component triple (error/boundary: missing column raises ValueError)"

  F-R7-565:
    title: contract_grammar emitter MUST bind lambda parameters to free variables in precondition/postcondition expressions — currently emits zero-arg lambda causing icontract.require to fail at runtime, NH-demoting every Design-by-Contract feature
    description: |
      bob3 v.15 r12 (observed 2026-05-29 PDT): feature 73879589
      (Design-by-Contract sub-grammar on behavior — pre/post/inv/raises)
      NH-demoted at attempts=5 because the emitted contract_grammar
      decorator generator writes `@icontract.require(lambda: (x > 0))`
      — a zero-arg lambda referencing free variable `x` that the
      decorator cannot bind. Test cases test_require_decorator_executes
      and test_ensure_decorator_executes both fail at runtime with
      a NameError / signature-mismatch when icontract tries to apply
      the decorator. Per agent diagnosis on
      bob15/src/bob3/spec_quality/contract_grammar.py:138 —
      `decorator_lines.append(f"@icontract.require(lambda: ({condition}))")`.

      The @ensure variant at line 141 correctly binds `lambda result:`
      because `result` is hard-coded. The @require variant has no
      symmetric binding — it should extract identifiers from the
      condition expression and emit them as lambda parameters, OR
      fall back to `lambda *args, **kwargs: condition` as a safe
      universal binding.

      Fix at extraction (spec-over-code-fix): contract_grammar
      emitter MUST validate emitted decorators by AST-parsing the
      lambda body and asserting every free variable is bound by
      the lambda signature. Emission failure on this check rejects
      the contract-grammar synthesis BEFORE persistence.
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/spec_quality/contract_grammar_lambda_binder.py"
      - "Function defined: bob3.spec_quality.contract_grammar_lambda_binder.extract_free_variables"
      - "Function defined: bob3.spec_quality.contract_grammar_lambda_binder.emit_bound_require_decorator"
      - "Function defined: bob3.spec_quality.contract_grammar_lambda_binder.validate_lambda_binding"
      - "behavior: extract_free_variables takes a condition string (e.g. 'x > 0 and y < 10') and returns the sorted tuple of identifier names it references ('x', 'y')"
      - "behavior: emit_bound_require_decorator returns a string like '@icontract.require(lambda x, y: (x > 0 and y < 10))' — the lambda signature lists every free variable in canonical order"
      - "behavior: validate_lambda_binding takes a generated decorator string and returns True iff every name referenced in the lambda body is either bound by the lambda parameters or available in builtins/globals (i.e. no NameError at call time)"
      - "integration: bob3.spec_quality.contract_grammar emitter routes every @require / @ensure / @invariant emission through emit_bound_require_decorator + validate_lambda_binding; emission failure raises ContractGrammarBindingError instead of persisting a broken decorator"
      - "integration: existing @ensure variant retains 'lambda result:' binding (no regression)"
      - "pytest: tests/test_contract_grammar_lambda_binding.py asserts emit_bound_require_decorator('x > 0') returns a string containing 'lambda x:'"
      - "pytest: tests/test_contract_grammar_lambda_binding.py asserts emit_bound_require_decorator('x > 0 and y < 10') binds both x and y"
      - "pytest: tests/test_contract_grammar_lambda_binding.py asserts validate_lambda_binding raises ContractGrammarBindingError on the legacy '@icontract.require(lambda: (x > 0))' broken form (error/safety path)"
      - "pytest: tests/test_contract_grammar_lambda_binding.py asserts test_require_decorator_executes scenario passes when emitter is routed through emit_bound_require_decorator (regression test for 73879589 root cause)"

  F-R7-566:
    title: enhanced_verification MUST recognize "Class defined:" AC prefix — currently no handler exists, every Class-defined AC silently default-fails and NH-demotes features whose emission was correct
    description: |
      bob3 v.15 r12 (observed 2026-05-29 16:30:13 PDT): feature
      5779ecf7 (Mutation-testing post-impl quality gate / mutmut) was
      NH-demoted at refinement_attempts=5 despite emitting a correct
      MutationReport @dataclass at src/bob3/verification/mutation_gate.py:68.
      Root cause: bob14/src/bob3/enhanced_verification.py has
      handlers for "File exists:", "Function defined:", "pytest:",
      "integration:" and others, but NO handler for "Class defined:".
      The AC criterion "Class defined: bob3.verification.mutation_gate.MutationReport"
      falls through every pattern branch and ends up returning the
      default-False from the bottom of the criterion-checker. Every
      feature with a Class-defined AC therefore fails verification
      regardless of emission quality.

      The spec_quality scoring layer DOES recognize "Class defined:"
      (quality_score.py:57 _AC_CLASS_RE), so the gate accepts these
      ACs at plan --create time — but the verifier never honors them
      at run time. Net effect: spec-quality-gate-passing features with
      class-defined ACs are guaranteed NH-demotions.

      Fix at extraction (spec-over-code-fix): enhanced_verification
      criterion-checker MUST include a "Class defined:" branch
      symmetric to "Function defined:". Pattern: extract dotted
      path, take last component as class name, route through
      _search_for_function (which already matches `class Name:`
      definitions per the existing comment at line ~1931).
    risk_category: high
    acceptance_criteria:
      - "File exists: src/bob3/verification/class_defined_ac_check.py"
      - "Function defined: bob3.verification.class_defined_ac_check.check_class_defined_ac"
      - "Function defined: bob3.verification.class_defined_ac_check.extract_class_name_from_criterion"
      - "behavior: extract_class_name_from_criterion takes 'Class defined: pkg.mod.Foo' and returns 'Foo'; returns None for non-matching strings"
      - "behavior: check_class_defined_ac returns True when the named class exists as `class Foo:` (or `class Foo(Base):`) anywhere in the workspace source tree; False when absent"
      - "behavior: check_class_defined_ac handles dataclass / pydantic / abstract base forms (decorator above class line is irrelevant — only the `class Name` token is required)"
      - "integration: bob3.enhanced_verification criterion-checker routes 'Class defined:' ACs through check_class_defined_ac BEFORE the default-False fallthrough"
      - "integration: existing 'Function defined:' branch is unchanged (no regression for function ACs)"
      - "pytest: tests/test_class_defined_ac_extract.py asserts extract_class_name_from_criterion('Class defined: bob3.verification.mutation_gate.MutationReport') returns 'MutationReport'"
      - "pytest: tests/test_class_defined_ac_check_dataclass.py asserts check_class_defined_ac returns True for a fixture src/example.py containing '@dataclass\\nclass MutationReport:' (decorator above class line)"
      - "pytest: tests/test_class_defined_ac_check_missing.py asserts check_class_defined_ac returns False when the class is not present anywhere in workspace (error/safety path)"
      - "pytest: tests/test_class_defined_ac_regression_5779ecf7.py asserts a Class-defined AC for an emitted dataclass passes verification (regression test for 5779ecf7 root cause)"

  F-R7-567:
    title: orchestrator-liveness probe MUST match `bob[0-9]+` regex AND honor `.bob3.lock` holder PID — current operator/watchdog `pgrep bob3 run` misses gen-N binary alias `bobN`, false-stalls and races a second orchestrator on same DB
