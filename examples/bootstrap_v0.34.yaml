      - "behavior: when a feature does NOT modify any VERIFIER_EXTENSION_MODULES file, the orchestrator MUST use the existing needs_human path (regression guard)"
      - "behavior: on startup, disk_reconciler MUST scan features where status='pending_successor_verify' from a prior-gen DB import, re-run their ACs with the current verifier, and promote to 'completed' if all pass or 'failed' if any fail"
      - "behavior: the deferred verification MUST emit an INFO log line containing 'successor-gen verify (F-R7-592)' and the feature id"
