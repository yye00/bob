name: Bob3
version: "0.2.0"
description: |
  Bob3 - Build Orchestration Bot v3
  
  A recursive build orchestration system that uses Claude Code sub-agents
  to research, plan, and execute software projects.
  
  Bob3 extends Bob2 with:
  - MCP Plugin Integration (Perplexity, Puppeteer, Superpowers)
  - Automatic feature generation from natural language + PDFs
  - Sub-agent orientation protocol for context recovery
  - Research-enabled sub-agents for when implementation is stuck

# NOTE: the bootstrap spec does not assume a particular checkout location.
# Override this to your local clone path before running ``bob3 plan``.
workspace: /tmp/bob3-self-build

# ============================================================
# ⚠️  CRITICAL: CLAUDE CODE SDK ONLY - NO CLI ⚠️
# ============================================================
#
# Bob3 MUST use the `claude-code-sdk` Python package for ALL Claude
# interactions. DO NOT use the Claude CLI (`claude` command).
#
# ✅ CORRECT - Use the SDK:
#   from claude_code_sdk import ClaudeSDKClient, ClaudeCodeOptions
#   client = ClaudeSDKClient(options=options)
#   async with client:
#       await client.query(prompt)
#       async for msg in client.receive_response():
#           ...
#
# ❌ WRONG - DO NOT USE CLI:
#   subprocess.run(['claude', '-p', prompt])     # ABSOLUTELY NOT!
#   subprocess.run(['claude', 'code', ...])      # ABSOLUTELY NOT!
#   os.system('claude ...')                      # ABSOLUTELY NOT!
#   os.popen('claude ...')                       # ABSOLUTELY NOT!
#   Popen(['claude', ...])                       # ABSOLUTELY NOT!
#
# ❌ WRONG - DO NOT USE OTHER SDKS:
#   from anthropic import Anthropic              # Wrong SDK!
#
# WHY: The claude-code-sdk provides proper async streaming, message handling,
# and integrates with MCP servers. The CLI is for humans, not programs.
#
# Authentication: Handled automatically by Claude Code Max Pro subscription.
# ============================================================

# ============================================================
# Claude Code SDK vs MCP - Understanding the Difference
# ============================================================
#
# Bob3 uses TWO different systems that work together:
#
# 1. CLAUDE CODE SDK (claude-code-sdk package)
#    - Used to SPAWN Claude sub-agents that do the actual work
#    - Sub-agents run in their own context window
#    - Each sub-agent can use MCP tools if configured
#    - This is HOW we create workers
#
# 2. MCP (Model Context Protocol) SERVERS
#    - Provide TOOLS that Claude sub-agents can call
#    - TITANS Memory MCP provides memory tools (titans_add, titans_search, etc.)
#    - Perplexity MCP provides research tools
#    - Puppeteer MCP provides browser automation tools
#    - This is WHAT tools the workers can use
# ============================================================

# ============================================================
# ENVIRONMENT VARIABLES (CONSOLIDATED)
# ============================================================
#
# Bob3 requires the following environment variables. Set them in your shell
# profile (~/.bashrc, ~/.zshrc, or equivalent). Bob3 validates these at startup.
#
# REQUIRED:
#   OPENAI_API_KEY     - For TITANS Memory MCP (embeddings via mem0ai)
#
# OPTIONAL (enable additional features):
#   PERPLEXITY_API_KEY - For Perplexity MCP (web research)
#
# NOT REQUIRED (Claude Code Max Pro subscription):
#   CLAUDE_API_KEY     - Handled by claude-code-sdk automatically
#
# Bob3 validates required environment variables at startup and exits with
# a clear error message if any are missing.
# ============================================================

# ============================================================
# MCP PLUGIN CONFIGURATION  
# ============================================================
#
# Bob3 integrates MCP plugins for enhanced capabilities.
# Configuration is defined in src/bob3/orchestrator/mcp_config.py (F104).
#
# 1. TITANS-MEMORY - Persistent Memory with Surprise-Based Learning (REQUIRED)
#    LOCATION: /home/captain/clawd/work/titans-memory
#    START COMMAND: uv --directory /home/captain/clawd/work/titans-memory run titans-memory
#    Tools: titans_add, titans_search, titans_get, titans_update, titans_delete,
#           titans_record_feedback, titans_get_candidates, titans_demote,
#           titans_archive, titans_get_stats, titans_route, titans_search_pool
#    WHEN TO USE:
#    - Store learned facts, lessons, and project context
#    - Search for relevant past knowledge before implementing
#    - Record feedback (success/failure) after applying knowledge
#    - Archive outdated information
#    MEMORY POOLS:
#    - facts: Factual knowledge (API behaviors, library usage)
#    - preferences: User/project preferences
#    - lessons: Learned patterns from debugging, failures
#    - context: Session context and project state
#    IMPORTANT: Use titans_add for ALL persistent knowledge. Use titans_search
#    BEFORE implementing to check for existing knowledge.
#    LIFECYCLE: Bob3 starts/stops this MCP server (see F017)
#
# 2. PERPLEXITY - Web Research (OPTIONAL)
#    ALREADY INSTALLED IN CLAUDE CODE - do NOT start separately
#    Available automatically to Claude Code sub-agents
#    Tools: perplexity_search, perplexity_ask, perplexity_research, perplexity_reason
#    WHEN TO USE:
#    - Feature has research_required=True
#    - Implementation fails due to missing information
#    - Need to look up API docs, library usage, algorithms
#    - Debugging requires understanding external systems
#
# 3. PUPPETEER - Browser Automation (OPTIONAL)
#    ALREADY INSTALLED IN CLAUDE CODE - do NOT start separately
#    Available automatically to Claude Code sub-agents
#    Tools: puppeteer_navigate, puppeteer_screenshot, puppeteer_click, 
#           puppeteer_fill, puppeteer_select, puppeteer_hover, puppeteer_evaluate
#    WHEN TO USE:
#    - Testing web UI features
#    - Verifying visual requirements
#    - End-to-end browser tests
#    - Taking screenshots for evidence artifacts
#
# 4. SUPERPOWERS - Advanced Development Skills (BUILT-IN)
#    Skills: systematic-debugging, subagent-driven-development, 
#            test-driven-development, verification-before-completion
#    WHEN TO USE:
#    - systematic-debugging: ANY bug, test failure, or unexpected behavior
#      MUST complete root cause investigation before proposing fixes
#    - subagent-driven-development: Complex features needing parallel work
#    - test-driven-development: Writing tests before implementation
#    - verification-before-completion: Final checks before marking complete
#
# NOTE: MCP server configuration details are in mcp_config.py (F104).
# This section describes WHAT the plugins do, F104 defines HOW to configure them.
# ============================================================

# ============================================================
# TESTING GUIDELINES - MANDATORY
# ============================================================
#
# All tests MUST use isolated test databases, never the production database.
#
# CRITICAL RULES:
#   1. CLI command tests MUST mock _db.init_database() to return a temp path
#   2. Never rely on existing bob3.db data in tests
#   3. Use tempfile.TemporaryDirectory() for database isolation
#   4. Mock long-running operations (orchestration loops, sub-agent spawning)
#
# EXAMPLE - Testing CLI commands with database:
#   with tempfile.TemporaryDirectory() as tmpdir:
#       with patch("bob3.cli._db.init_database") as mock_db:
#           mock_db.return_value = pathlib.Path(tmpdir) / "test.db"
#           result = runner.invoke(main, ["run"])
#
# WHY: Tests that use the real bob3.db can:
#   - Trigger real orchestration loops (hours of CPU time)
#   - Spawn real Claude sub-agents (expensive API calls)
#   - Hang indefinitely waiting for external processes
#
# ============================================================

# ============================================================
# SUB-AGENT ORIENTATION PROTOCOL
# ============================================================
#
# Every sub-agent MUST start with an orientation sequence before working.
# This ensures context recovery in fresh context windows.
#
# MANDATORY ORIENTATION STEPS:
#   1. pwd && ls -la                    # Understand working directory
#   2. cat app_spec.txt | head -100     # Read project specification
#   3. Query feature status from DB     # Understand current state
#   4. cat claude-progress.txt          # Read previous session notes
#   5. git log --oneline -10            # See recent changes
#   6. titans_search for relevant context:
#      - titans_search("lessons {feature_name}")  # Past lessons
#      - titans_search("facts {technology}")      # Known facts
#      - titans_search("context {project}")       # Project context
#
# MANDATORY MEMORY OPERATIONS:
#   - BEFORE implementing: titans_search for existing knowledge
#   - AFTER learning something: titans_add to facts/lessons pool
#   - AFTER fixing a bug: titans_add lesson with trigger/solution
#   - AFTER success/failure: titans_record_feedback on used memories
#
# WHEN TO APPLY:
# - Every new sub-agent session
# - On retry after failure (especially important for debugging)
# - When resuming from checkpoint
# ============================================================

dependencies:
  python:
    - claude-code-sdk>=0.0.25  # REQUIRED - Claude Code SDK (NOT anthropic SDK)
    - click>=8.0               # CLI framework
    - rich>=13.0               # Terminal UI
    - pydantic>=2.0            # Data validation
    - PyMuPDF>=1.23.0          # PDF extraction (MUST BE USED - see F102)

structure:
  description: |
    src/bob3/
    ├── __init__.py
    ├── cli.py                    # Click CLI entry point
    ├── db.py                     # SQLite database layer
    ├── schema.sql                # Database schema
    ├── models.py                 # Pydantic data models
    ├── pdf_utils.py              # PDF text extraction (NEW in Bob3)
    ├── orientation.py            # Sub-agent orientation protocol (NEW in Bob3)
    └── orchestrator/
        ├── __init__.py
        ├── claude_executor.py    # Claude Code SDK wrapper
        └── mcp_config.py         # MCP plugin configuration (NEW in Bob3)

features:

