  F069:
    title: "Implement 'bob3 run' with Continuous Orchestration Loop"
    description: |
      Implement 'bob3 run' command with a CONTINUOUS while True loop.
      
      The loop MUST run continuously until termination conditions:
      ```python
      while True:
          # Check budget/limits
          if budget_exceeded(): break
          
          # Find next feature
          feature = find_next_ready_feature()
          if feature is None:
              if all_features_completed(): break
              if all_remaining_blocked(): break
              continue  # or handle refinement
          
          # Execute feature
          result = spawn_sub_agent(feature)
          update_feature_status(feature, result)
          
          # Cascade update dependents (F123)
          cascade_update_dependents(feature.id)
      ```
      
      CRITICAL: The loop continues until ALL features are done or blocked.
      Do NOT stop after just one feature.
    priority: high
    depends_on: ['F007', 'F008', 'F057']
    steps:
      - "Step 1: Implement run command with while True loop"
      - "Step 2: Check budget before each iteration"
      - "Step 3: Query features_ready view for next feature"
      - "Step 4: Spawn sub-agent to implement feature"
      - "Step 5: Update status and call cascade_update_dependents"
      - "Step 6: Handle graceful shutdown signals"
      - "Step 7: Test: Multiple features complete in sequence without manual restart"

