  F-R6-210:
    title: Auto-trigger research harness per round
    description: |
      The six research agents (r1_coverage, r2_stack, r3_perf,
      r4_security, r5_ecosystem, r6_self_critique) in
      src/bob3/research/ exist with a working harness but are only
      invoked manually. Wire the harness into `bob3 plan` so each
      round automatically runs all six agents in parallel, writes
      proposals to docs/recursion/round<N>/, and surfaces a short
      summary so the next spec can incorporate findings.
