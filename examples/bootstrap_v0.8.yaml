  F-R6-213:
    title: Scientific-domain skill bundles (CFD / geomech / NR / plasma / particle)
    description: |
      Five new domain bundles authored alongside F-R6-212:
        - cfd: FVM/FEM, SIMPLE/PISO, turbulence models, BCs.
        - geomech: poroelasticity (Biot), frictional contact, fault
