  F-R6-211:
    title: Numerical correctness verifier (MMS + conservation + convergence)
    description: |
      Add a verifier for scientific-compute acceptance criteria:
        - 'mms: order=N norm=L2' — manufactured-solution convergence,
          fits log-log slope of error vs mesh-spacing, asserts
          slope >= N - tolerance.
        - 'conserves: quantity=mass drift<=1e-9' — runs the
          implementation forward and asserts the named conserved
          quantity drifts no more than the bound.
      (The benchmark criterion variant from the old spec is dropped
      with the benchmark registry.)
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/numerical_verifier.py'
