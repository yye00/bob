    \ evaluator-result handler in src/bob3/run_loop.py (or\n wherever evaluator verdicts are consumed),\
    \ inspect the\n captured_stderr_head / captured_stderr_log if verdict is\n INSUFFICIENT_EVIDENCE AND\
    \ confidence==0.0 AND is_error=True.\n 2. If the stderr contains ANY of these substrings, classify\
    \ the\n failure as MCP_TRANSIENT and reset the feature to 'ready'\n (NOT failed, NOT needs_human):\n\
