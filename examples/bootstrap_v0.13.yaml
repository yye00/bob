name: bob14
version: 0.13.0
description: |
  Bob13 — Round 10 of the recursive bob-on-bob dark factory.

  Inherited from bob12/examples/bootstrap_v0.12.yaml with every previously
  BLOCKED / WARNING feature's acceptance_criteria rewritten to the
  structured forms required by the v.13 spec_quality_score gate:
    - File exists: <path>
    - File modified: <path>
    - Function defined: <module.path.symbol>
    - Class defined: <module.path.symbol>
    - Field exists on Feature model: <name>
    - pytest: tests/<path>
    - integration: <dotted.module>
    - Schema: <path>
    - Config: <path>
    - CLI command: <cmd>
    - Event emitted: <name>
    - bob4/research/demonstrators/<feature_id>/spec.yaml exists: <claim>

  All semantic intent is preserved; compound bullets were split into
  atomic observables. Three new infra-recovery + ownership features
  (F-R7-478, F-R7-479, F-R7-482) appended at end.

  Invariant (per memory/infra_recovery_features_are_permanent.md):
  F-R7-478 + F-R7-479 MUST never be pruned from any future bootstrap.

features:

  # ===================================================================
  # P0.A — Measurement-fix layer
  # ===================================================================

  F-R7-400:
    title: Convergence detector compares features by spec_slot, not UUID
    description: |
      The current weekend_watchdog.sh:check_convergence shell function
      compares feature sets across generations by features.id. Feature
      IDs are minted as fresh UUIDs in every `bob3 init`, so the
      cross-generation set diff is always 100%.

      Add a stable `spec_slot` column to the features table populated
      from the spec key. Rewrite check_convergence to set-diff by
      spec_slot. Backfill spec_slot for existing rows by parsing the
      spec yaml and matching by name.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/migrations/add_spec_slot.py'
      - 'Function defined: bob3.migrations.add_spec_slot.upgrade'
      - 'Function defined: bob3.migrations.add_spec_slot.downgrade'
      - 'Field exists on Feature model: spec_slot'
      - 'Function defined: bob3.models.Feature.spec_slot_layer (returns the spec layer string parsed from spec_slot, e.g. "R7" from "F-R7-400")'
      - 'Function defined: bob3.orchestrator.convergence.compares_by_spec_slot (returns True)'
      - 'Function defined: bob3.orchestrator.convergence.set_diff_uses_spec_slot (returns True; documents that set-diff key is spec_slot not id)'
      - 'pytest: tests/test_spec_slot_migration.py'
      - 'pytest: tests/test_spec_slot_migration_idempotent_on_existing_column.py'
      - 'pytest: tests/test_convergence_by_spec_slot.py'
      - 'pytest: tests/test_convergence_by_spec_slot_handles_null_slot_rows.py'
      - 'pytest: tests/test_convergence_by_spec_slot_rejects_uuid_comparison.py'
      - 'pytest: tests/test_convergence_boundary_empty_feature_set.py asserts compares_by_spec_slot([],[]) returns True (zero-element edge)'
      - 'pytest: tests/test_convergence_error_path_missing_spec_slot_column.py asserts compares_by_spec_slot raises ValueError with message containing "spec_slot" when column absent'
      - 'integration: bob3.orchestrator.weekend_watchdog'

  F-R7-401:
    title: Disk-state reconciler — promote built-on-disk features without re-spawn
    description: |
      Every generation re-runs every ready feature even when its
      acceptance-criteria artifacts already exist on disk from the
      parent generation. Add `reconcile_from_disk(project_id)` that
      evaluates each AC entry against the workspace and atomically
      promotes features whose artifacts pass in isolation.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/disk_reconciler.py'
      - 'Function defined: bob3.orchestrator.disk_reconciler.reconcile_from_disk'
      - 'Function defined: bob3.orchestrator.disk_reconciler.evaluate_ac_against_disk'
      - 'Function defined: bob3.orchestrator.disk_reconciler.promote_to_completed (atomic status transition with evidence_artifacts of type disk_reconciliation)'
      - 'Function defined: bob3.orchestrator.disk_reconciler.handle_missing_workspace (returns NOT_RECONCILED when workspace_dir does not exist)'
      - 'Function defined: bob3.orchestrator.disk_reconciler.never_raises_on_missing_workspace (returns True; documents that handle_missing_workspace never raises)'
      - 'Function defined: bob3.orchestrator.disk_reconciler.handle_failing_integration_ac (refuses promotion when any integration AC regresses)'
      - 'pytest: tests/test_disk_reconciler.py'
      - 'pytest: tests/test_disk_reconciler_idempotent.py'
      - 'pytest: tests/test_disk_reconciler_skips_when_artifacts_missing.py'
      - 'pytest: tests/test_disk_reconciler_records_evidence_artifacts.py'
      - 'pytest: tests/test_disk_reconciler_refuses_when_integration_regresses.py'
      - 'pytest: tests/test_disk_reconciler_boundary_empty_ac_list.py asserts reconcile_from_disk(project_id_with_zero_acs) returns NOT_RECONCILED (empty edge)'
      - 'pytest: tests/test_disk_reconciler_error_path_invalid_project_id.py asserts reconcile_from_disk(None) raises ValueError with message containing "project_id"'
      - 'integration: bob3.orchestrator.run_loop'

  # ===================================================================
  # P0.B — Spec-quality layer
  # ===================================================================

  F-R7-410:
    title: Spec ambiguity linter — reject vague acceptance criteria
    description: |
      Pre-plan gate that scans every acceptance_criteria entry and
      rejects ambiguous patterns. Each AC must match one of the
      structured forms; the linter fails the plan if any feature has
      an ambiguous AC and emits a structured report.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/ambiguity_linter.py'
      - 'Function defined: bob3.spec_quality.ambiguity_linter.lint_feature'
      - 'Function defined: bob3.spec_quality.ambiguity_linter.lint_spec'
      - 'Function defined: bob3.spec_quality.ambiguity_linter.is_ambiguous_ac (returns True for bare verbs like "works"/"handles"/"supports")'
      - 'Function defined: bob3.spec_quality.ambiguity_linter.has_concrete_identifier (returns False when no file path / function name / test path is present)'
      - 'Function defined: bob3.spec_quality.ambiguity_linter.format_remediation_report (returns dict keyed by feature_id with ac_index list)'
      - 'pytest: tests/test_ambiguity_linter.py'
      - 'pytest: tests/test_ambiguity_linter_rejects_vague_ac.py'
      - 'pytest: tests/test_ambiguity_linter_rejects_unbounded_quantifier.py'
      - 'pytest: tests/test_ambiguity_linter_accepts_structured_forms.py'
      - 'pytest: tests/test_ambiguity_linter_empty_ac_list_fails.py asserts lint_feature(feature_with_empty_ac_list) returns boundary failure (zero ACs edge case)'
      - 'pytest: tests/test_ambiguity_linter_single_ac_boundary.py asserts lint_feature handles minimum one-AC input without error'
      - 'pytest: tests/test_ambiguity_linter_error_path_invalid_yaml.py asserts lint_spec(malformed_yaml) raises ValueError with message containing "malformed"'
      - 'integration: bob3.cli.plan'

  F-R7-411:
    title: Integration-target reachability check at spec-load time
    description: |
      Every `integration: <dotted.module>` AC implies the generated
      code will be wired into that module. At plan time, verify the
      target module either exists in the workspace or is itself a
      feature in the spec being planned. Reject unreachable targets.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/integration_reachability.py'
      - 'Function defined: bob3.spec_quality.integration_reachability.check_spec'
      - 'Function defined: bob3.spec_quality.integration_reachability.resolve_target (returns "in_workspace" | "in_spec" | "unreachable")'
      - 'Function defined: bob3.spec_quality.integration_reachability.suggest_closest_match (returns nearest module name by Levenshtein distance)'
      - 'Function defined: bob3.spec_quality.integration_reachability.raises_on_unreachable (raises UnreachableIntegrationError naming the missing module)'
      - 'pytest: tests/test_integration_reachability.py'
      - 'pytest: tests/test_integration_reachability_accepts_in_workspace.py'
      - 'pytest: tests/test_integration_reachability_accepts_in_spec.py'
      - 'pytest: tests/test_integration_reachability_rejects_unreachable.py'
      - 'pytest: tests/test_integration_reachability_suggests_closest_match.py'
      - 'pytest: tests/test_integration_reachability_boundary_empty_target.py asserts resolve_target("") returns "unreachable" (empty edge)'
      - 'pytest: tests/test_integration_reachability_error_path_invalid_module_name.py asserts check_spec must raise an error on invalid input and reject the spec'
      - 'integration: bob3.cli.plan'

  F-R7-412:
    title: Structured EARS-style behavior acceptance criteria
    description: |
      Add a sixth AC grammar `behavior: <subject> <verb> <object> when
      <condition>`. Parse into structured tuple at load time. Evaluator
      gets a new check that uses the parsed structure rather than
      freeform prose.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/ears_parser.py'
      - 'Function defined: bob3.spec_quality.ears_parser.parse_behavior_ac'
      - 'Function defined: bob3.spec_quality.ears_parser.evaluate_behavior_ac'
      - 'Function defined: bob3.spec_quality.ears_parser.BehaviorAC (dataclass with fields subject, verb, object, condition)'
      - 'Function defined: bob3.spec_quality.ears_parser.raises_on_malformed (raises EARSParseError when "when" clause is missing)'
      - 'pytest: tests/test_ears_parser.py'
      - 'pytest: tests/test_ears_parser_rejects_missing_when_clause.py'
      - 'pytest: tests/test_ears_parser_rejects_empty_subject.py'
      - 'pytest: tests/test_ears_evaluator_uses_parsed_structure.py'
      - 'pytest: tests/test_ears_evaluator_returns_false_on_missing_condition.py'
      - 'pytest: tests/test_ears_parser_boundary_minimum_when_clause.py asserts parse_behavior_ac("a does b when c") returns BehaviorAC with single-character condition (minimum length edge)'
      - 'pytest: tests/test_ears_parser_error_path_empty_input.py asserts parse_behavior_ac must raise an error and reject an empty invalid input string'
      - 'integration: bob3.evaluator'

  F-R7-413:
    title: Spec quality score gate — features below threshold cannot reach ready
    description: |
      Combine F-R7-410 / F-R7-411 / F-R7-412 plus an AC-coverage
      metric into a per-feature spec_quality_score in [0,1]. Features
      with score < 0.85 stay pending with a structured remediation
      report.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/quality_score.py'
      - 'Function defined: bob3.spec_quality.quality_score.compute_score'
      - 'Function defined: bob3.spec_quality.quality_score.gate_for_ready'
      - 'Function defined: bob3.spec_quality.quality_score.score_threshold (returns 0.85)'
      - 'Function defined: bob3.spec_quality.quality_score.raises_below_threshold (raises BelowQualityScoreError with structured remediation)'
      - 'Function defined: bob3.spec_quality.quality_score.handle_zero_ac_list (returns 0.0 when feature has no ACs)'
      - 'Function defined: bob3.spec_quality.quality_score.never_divides_by_zero (returns True; documents zero-AC handler bypasses division)'
      - 'Field exists on Feature model: spec_quality_score'
      - 'pytest: tests/test_quality_score.py'
      - 'pytest: tests/test_quality_score_gate_blocks_ready.py'
      - 'pytest: tests/test_quality_score_gate_zero_ac_list.py asserts compute_score(feature_with_zero_acs) returns 0.0 (zero-element boundary)'
      - 'pytest: tests/test_quality_score_threshold_boundary_0_85.py asserts gate_for_ready returns True at exactly 0.85 minimum threshold'
      - 'pytest: tests/test_quality_score_error_path_invalid_feature.py asserts compute_score(None) raises TypeError with message containing "feature"'
      - 'integration: bob3.orchestrator.run_loop'

  # ===================================================================
  # P1 — Anti-treadmill / sticky-completed
  # ===================================================================

  F-R7-420:
    title: Sticky-completed gate — re-evaluation cannot un-complete persisted work
    description: |
      If a feature was status='completed' in the parent generation's
      DB AND its acceptance criteria still verify on disk, no
      evaluator FAIL or regression-cascade vote may flip its status
      below 'ready'. Reset the stamp only when a refinement attempt
      actually rewrites one of the AC-named source files.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/sticky_completed.py'
      - 'Function defined: bob3.orchestrator.sticky_completed.stamp_from_parent'
      - 'Function defined: bob3.orchestrator.sticky_completed.may_demote (returns False when parent_completed=True and AC artifacts still verify)'
      - 'Function defined: bob3.orchestrator.sticky_completed.clear_on_real_edit (clears parent_completed when AC-named file mtime changes)'
      - 'Function defined: bob3.orchestrator.sticky_completed.handle_missing_parent_db (returns False when parent_completed unset)'
      - 'Function defined: bob3.orchestrator.sticky_completed.never_raises_when_unset (returns True; documents handle_missing_parent_db swallows AttributeError)'
      - 'Field exists on Feature model: parent_completed'
      - 'pytest: tests/test_sticky_completed_blocks_demotion.py'
      - 'pytest: tests/test_sticky_completed_clears_on_real_edit.py'
      - 'pytest: tests/test_sticky_completed_allows_demotion_when_unstamped.py'
      - 'pytest: tests/test_sticky_completed_handles_missing_parent_db.py asserts may_demote(feature, parent_db=None) returns True (null/missing edge)'
      - 'pytest: tests/test_sticky_completed_boundary_zero_acs.py asserts may_demote returns True when feature has zero ACs (zero/min edge)'
      - 'pytest: tests/test_sticky_completed_error_path_invalid_feature.py asserts stamp_from_parent(None) raises ValueError with message containing "feature"'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-421:
    title: Blame-the-cause regression cascade — charge the breaking feature
    description: |
      For each failing test, walk the AC table to find the feature
      whose `pytest:` AC owns that test path. Charge a refinement
      attempt to that feature only. Features that merely ran during
      the same verification but don't own any failing test stay at
      their pre-verification status.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/blame_cascade.py'
      - 'Function defined: bob3.orchestrator.blame_cascade.find_owner_feature (returns feature_id whose pytest AC matches the failing test path)'
      - 'Function defined: bob3.orchestrator.blame_cascade.charge_refinement (increments refinement_attempts on the owning feature only)'
      - 'Function defined: bob3.orchestrator.blame_cascade.preserve_innocent_status (leaves non-owning features at pre-verification status)'
      - 'Function defined: bob3.orchestrator.blame_cascade.handle_unowned_failure (records unattributed_failure event when no owner found)'
      - 'pytest: tests/test_blame_cascade_charges_owner_only.py'
      - 'pytest: tests/test_blame_cascade_does_not_charge_innocent.py'
      - 'pytest: tests/test_blame_cascade_handles_unowned_failure.py'
      - 'pytest: tests/test_blame_cascade_supersedes_F_R6_320.py'
      - 'pytest: tests/test_blame_cascade_boundary_empty_failing_tests.py asserts charge_refinement([]) returns 0 charges (empty/zero edge)'
      - 'pytest: tests/test_blame_cascade_error_path_unowned_failure.py asserts find_owner_feature must raise an error and reject an invalid orphan test path with no owner'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-422:
    title: Parent-gen DB inheritance at seed time
    description: |
      When spawn_next_generation.sh seeds bob_(N+1), read every
      completed/needs_human/regression feature row from bob_N's
      bob3.db. Match by spec_slot (F-R7-400). Stamp the matched
      bob_(N+1) row with parent_status, parent_completed_at,
      parent_evidence_hash.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/parent_gen_inheritance.py'
      - 'Function defined: bob3.orchestrator.parent_gen_inheritance.inherit_from_parent_db'
      - 'Function defined: bob3.orchestrator.parent_gen_inheritance.match_by_spec_slot (returns dict mapping spec_slot to parent feature row)'
      - 'Function defined: bob3.orchestrator.parent_gen_inheritance.stamp_provenance (writes parent_status, parent_completed_at, parent_evidence_hash atomically)'
      - 'Function defined: bob3.orchestrator.parent_gen_inheritance.handle_missing_parent_db (returns empty dict; never raises FileNotFoundError)'
      - 'Field exists on Feature model: parent_status'
      - 'Field exists on Feature model: parent_completed_at'
      - 'Field exists on Feature model: parent_evidence_hash'
      - 'pytest: tests/test_parent_gen_inheritance.py'
      - 'pytest: tests/test_parent_gen_inheritance_missing_db_safe.py'
      - 'pytest: tests/test_parent_gen_inheritance_matches_by_spec_slot.py'
      - 'integration: tools/spawn_next_generation.sh'

  # ===================================================================
  # P1 — Self-healing bootstrap
  # ===================================================================

  F-R7-430:
    title: Bootstrap readiness override — one bypass execute per feature
    description: |
      Add a per-feature `bootstrap_attempts` counter (default 0,
      max 1). When the readiness gate would block a feature AND
      bootstrap_attempts < 1 AND research_iterations == 0, allow one
      execute pass that bypasses the readiness gate.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/bootstrap_override.py'
      - 'Function defined: bob3.orchestrator.bootstrap_override.may_bypass_readiness (returns True iff bootstrap_attempts < 1 and research_iterations == 0)'
      - 'Function defined: bob3.orchestrator.bootstrap_override.increment_bootstrap_attempts (atomic counter increment)'
      - 'Function defined: bob3.orchestrator.bootstrap_override.handle_second_attempt_denied (returns False when bootstrap_attempts >= 1)'
      - 'Function defined: bob3.orchestrator.bootstrap_override.max_bootstrap_attempts (returns 1)'
      - 'Field exists on Feature model: bootstrap_attempts'
      - 'pytest: tests/test_bootstrap_override.py'
      - 'pytest: tests/test_bootstrap_override_one_shot.py'
      - 'pytest: tests/test_bootstrap_override_denied_after_first_use.py'
      - 'pytest: tests/test_bootstrap_override_denied_when_research_done.py'
      - 'pytest: tests/test_bootstrap_override_boundary_max_attempts.py asserts may_bypass_readiness returns False when bootstrap_attempts == max (1) boundary'
      - 'pytest: tests/test_bootstrap_override_error_path_negative_counter.py asserts increment_bootstrap_attempts raises ValueError with message containing "negative" when counter < 0'
      - 'integration: bob3.orchestrator.run_loop'

  # ===================================================================
  # P2 — Process hygiene
  # ===================================================================

  F-R7-440:
    title: Stale-bytecode guard at relaunch
    description: |
      Self-heal compares mtime of every file under
      src/bob*/orchestrator/ against the previous bob_N process's
      start time. If any orchestrator source file is newer than
      process start, kill+relaunch the process even when the DB
      looks recoverable.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/stale_bytecode_guard.py'
      - 'Function defined: bob3.orchestrator.stale_bytecode_guard.check_freshness'
      - 'Function defined: bob3.orchestrator.stale_bytecode_guard.record_start_time'
      - 'Function defined: bob3.orchestrator.stale_bytecode_guard.is_stale (returns True when any orchestrator file mtime > recorded start_time)'
      - 'Function defined: bob3.orchestrator.stale_bytecode_guard.log_stale_file (emits log line naming the stale path so operators can correlate)'
      - 'Function defined: bob3.orchestrator.stale_bytecode_guard.handle_missing_lock_file (returns True conservatively when .bob3.lock absent)'
      - 'pytest: tests/test_stale_bytecode_guard.py'
      - 'pytest: tests/test_stale_bytecode_guard_detects_newer_file.py'
      - 'pytest: tests/test_stale_bytecode_guard_handles_missing_lock.py'
      - 'pytest: tests/test_stale_bytecode_guard_emits_named_log_line.py'
      - 'pytest: tests/test_stale_bytecode_guard_boundary_zero_files.py asserts is_stale returns False when orchestrator dir has zero source files (empty/zero edge)'
      - 'pytest: tests/test_stale_bytecode_guard_error_path_unreadable_dir.py asserts check_freshness raises PermissionError with message containing "permission" when dir unreadable'
      - 'integration: tools/self_heal.sh'

  # ===================================================================
  # P0.C — Research-informed spec-layer additions
  # ===================================================================

  F-R7-450:
    title: Adversarial spec-critic sub-agent — gate codegen on spec quality
    description: |
      Dedicated spec-critic sub-agent that runs after the spec-extractor
      and before any implementer fires. Loads a versioned
      spec_constitution.md and emits per-feature structured defects.
      Findings persist to reviews/spec_findings.yaml keyed by spec hash.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/spec_critic.py'
      - 'File exists: src/bob3/spec_quality/spec_constitution.md'
      - 'Function defined: bob3.spec_quality.spec_critic.critique_feature'
      - 'Function defined: bob3.spec_quality.spec_critic.persist_findings'
      - 'Function defined: bob3.spec_quality.spec_critic.run_revise_loop (bounded to 1 revise pass)'
      - 'Function defined: bob3.spec_quality.spec_critic.escalates_to_clarification_on_second_round (returns True; escalates to F-R7-456 on second-round defects)'
      - 'Function defined: bob3.spec_quality.spec_critic.handle_empty_constitution (raises ConstitutionMissingError when spec_constitution.md absent)'
      - 'Function defined: bob3.spec_quality.spec_critic.defect_type_is_known (returns True for defect_type in ambiguity/missing_edge_case/untestable/implementation_leak/vague_quantifier/missing_actor/unreachable_integration)'
      - 'pytest: tests/test_spec_critic_emits_structured_defects.py'
      - 'pytest: tests/test_spec_critic_revise_loop_bounded.py'
      - 'pytest: tests/test_spec_critic_findings_registry.py'
      - 'pytest: tests/test_spec_critic_rejects_unknown_defect_type.py asserts critique_feature raises ValueError with message containing "unknown defect_type" on bad defect input'
      - 'pytest: tests/test_spec_critic_handles_missing_constitution.py asserts critique_feature raises ConstitutionMissingError when spec_constitution.md absent (missing-file error path)'
      - 'pytest: tests/test_spec_critic_boundary_empty_feature_list.py asserts critique_feature([]) returns empty findings list (zero/empty edge)'
      - 'integration: bob3.orchestrator.run_loop'

  F-R7-451:
    title: Sub-translation provenance — every AC traces to source-intent span
    description: |
      Each emitted AC must carry a provenance field naming the
      contiguous character spans of the original human intent that
      produced it. CLI `bob spec trace <feature>:<ac>` prints the AC
      alongside its spans. Round-trip coverage of source intent must
      be >=90% of load-bearing tokens.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/provenance.py'
      - 'Function defined: bob3.spec_quality.provenance.attach_provenance'
      - 'Function defined: bob3.spec_quality.provenance.validate_coverage (returns True iff load-bearing token coverage >= 0.90)'
      - 'Function defined: bob3.spec_quality.provenance.trace_ac'
      - 'Function defined: bob3.spec_quality.provenance.reject_empty_provenance (raises EmptyProvenanceError when spans list is empty)'
      - 'Function defined: bob3.spec_quality.provenance.reject_non_overlapping (raises NonOverlappingProvenanceError when spans do not cover the AC text)'
      - 'Field exists on Feature model: provenance_spans'
      - 'pytest: tests/test_cli_spec_trace_command.py asserts running "bob spec trace F-R7-451:0" exits 0 and stdout contains "span="'
      - 'pytest: tests/test_provenance_round_trip.py'
      - 'pytest: tests/test_provenance_rejects_empty.py asserts attach_provenance(ac, []) raises EmptyProvenanceError with message containing "empty" (error path on empty span list)'
      - 'pytest: tests/test_provenance_rejects_non_overlapping.py'
      - 'pytest: tests/test_provenance_coverage_threshold_boundary.py asserts validate_coverage returns True at exactly 0.90 minimum coverage boundary'
      - 'integration: bob3.cli.spec_trace'

  F-R7-452:
    title: Design-by-Contract sub-grammar on behavior — pre / post / inv / raises
    description: |
      Extend the F-R7-412 EARS `behavior:` AC with four optional
      sub-keys: pre (precondition), post (postcondition), inv
      (invariant), raises (declared exception types). Codegen emits
      matching icontract decorators; verifier runs them during pytest.
      Pre violations charge the caller, post violations charge the
      implementer.
    tier: Core
    acceptance_criteria:
      - 'File exists: src/bob3/spec_quality/contract_grammar.py'
      - 'Function defined: bob3.spec_quality.contract_grammar.parse_contract'
      - 'Function defined: bob3.spec_quality.contract_grammar.emit_icontract_decorators'
      - 'Function defined: bob3.spec_quality.contract_grammar.parse_pre_clause (returns precondition AST node)'
      - 'Function defined: bob3.spec_quality.contract_grammar.parse_post_clause (returns postcondition AST node)'
