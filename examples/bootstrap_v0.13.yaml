  # ===================================================================
  # P0.INFRA — Permanent forward-carry infra-recovery features
  # (per memory/infra_recovery_features_are_permanent.md)
  # ===================================================================

  F-R7-478:
    title: Infra-error transient classifier + unlimited spawn-layer recovery (no budget impact)
    description: |
      Today every Claude-CLI sub-agent exit-1 counts as a refinement attempt
      somewhere in the pipeline — even when the cause is pure infrastructure:
      HTTP 429 / rate-limit, network blip (ECONNRESET, ETIMEDOUT), midstream
      Claude abort with no work output, env-config ENOENT.

      The principle: spurious infra errors are NOT signal about feature
      quality. The system should recover from them naturally and silently.
      They MUST NOT consume any planning, execution, refinement, or
      evaluation budget at any layer.

      Implementation: wrap EVERY Claude-CLI sub-agent spawn with a single
      shared spawn_with_retry helper that classifies via classify_exit
      and retries TRANSIENT signatures UNLIMITED times with exponential
      backoff capped at 5 minutes.

      Source: 2026-05-24 marketplace-path incident + user directive on
      transient infra errors.
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/spawn_retry.py'
      - 'File exists: config/spawn_retry.yaml with TRANSIENT_PATTERNS regex list (hot-reloadable)'
      - 'Function defined: bob3.orchestrator.spawn_retry.classify_exit (returns "transient" | "mid_work_crash" | "real_failure")'
      - 'Function defined: bob3.orchestrator.spawn_retry.spawn_with_retry (UNLIMITED retries on transient; exponential backoff capped at 300s)'
      - 'Function defined: bob3.orchestrator.spawn_retry.load_patterns (hot-reloads config/spawn_retry.yaml on each spawn)'
      - 'EVERY Claude-CLI sub-agent invocation in the codebase routes through spawn_with_retry — grep guard: no remaining direct `claude --` subprocess calls outside spawn_retry.py (assert via AST/regex scan in tests/test_no_direct_claude_invocation.py)'
      - 'Transient retries do NOT increment refinement_attempts, bootstrap_attempts, verification_failures, or research_iterations in any pipeline stage (planning, spec-extraction, implementation, verification, evaluation, research, RCA)'
      - 'Mid-work-crash still counts as one refinement attempt (preserves F-R6-300 behavior), EXCEPT when duration_ms==0 — that signature (work_events>0 AND duration_ms==0) is a JSONL serialization race / SIGPIPE / orphan process pattern, not a sub-agent decision to abort; reclassify as TRANSIENT and retry without budget impact. Observed 2026-05-24 in F-0bf30902 + F-9f58051a logs.'
      - 'Each retry logged to .bob3/agent_logs/<job>.retry.jsonl with {attempt, classification, matched_pattern, backoff_seconds, elapsed_total}'
      - 'Retry storm (>20 retries in 10min for one feature) emits WARN event but does NOT halt or fail the feature'
      - 'pytest: tests/test_classify_exit_marketplace_enoent_is_transient.py'
      - 'pytest: tests/test_classify_exit_rate_limit_is_transient.py'
      - 'pytest: tests/test_classify_exit_network_errors_are_transient.py'
      - 'pytest: tests/test_classify_exit_midwork_crash_is_not_transient.py'
      - 'pytest: tests/test_classify_exit_real_failure_is_not_transient.py'
      - 'pytest: tests/test_spawn_with_retry_unlimited_on_transient.py'
      - 'pytest: tests/test_spawn_with_retry_backoff_caps_at_300s.py'
      - 'pytest: tests/test_spawn_with_retry_does_not_increment_any_budget_counter.py'
      - 'pytest: tests/test_no_direct_claude_invocation.py'
      - 'pytest: tests/test_spawn_retry_patterns_hot_reload.py'
      - 'integration: bob3.orchestrator.spawn_dispatcher'
      - 'bob4/research/demonstrators/F-R7-478/spec.yaml exists with a fake-flaky-spawner integration test (fails first 10 spawns with each transient signature, succeeds on 11th) asserting end-to-end recovery inside git worktree, with refinement_attempts=0 at the end'
      - 'Pre-retry health probe: before each retry, run `claude --version` with 5s timeout. If probe fails 3 consecutive times → switch to BROKEN_ENV mode: backoff jumps to 600s, log ERROR-level event, continue retrying (env may self-heal) but emit a single `env_broken` event for watchdog (does NOT halt the feature; the feature stays in current state, no budget burn)'
      - 'Idempotency: spawn_with_retry cleans up partial workspace state between retries (orphan .bob3/locks/<feature>, partial git index entries) so retry N+1 starts from the same baseline as retry 1'
      - 'Per-feature cost ceiling (default $50 from config) for the retry loop alone (not the feature overall). When hit, raises a distinct `retry_cost_ceiling` event — NOT a refinement failure, NOT NH; just pauses the feature for the next round to retry (acts as a soft circuit breaker against runaway cost)'
      - 'pytest: tests/test_spawn_with_retry_health_probe_triggers_broken_env.py'
      - 'pytest: tests/test_spawn_with_retry_cleans_partial_state.py'
      - 'pytest: tests/test_spawn_with_retry_cost_ceiling_pauses_not_fails.py'

  F-R7-479:
    title: RCA-layer infra-error recovery — second-line defense against false NH
    description: |
      F-R7-478 guards the spawn layer with a regex set of known transient
      signatures. But a brand-new infra signature will slip past it. F-R7-479
      adds the second line: BEFORE the orchestrator transitions a feature to
      `needs_human`, the RCA sub-agent inspects the history of failed
      attempts and answers — were ALL N attempts infra-caused?

      If the RCA verdict is `infra_only`: the feature is reset to `ready`
      with refinement_attempts=0, and the discovered novel signature is
      auto-appended to config/spawn_retry.yaml. The system learns the new
      transient pattern WITHOUT a human edit.

      Source: 2026-05-24 user directive: claude cli having a bad day just
      retry it, do not count it as needs human.
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/rca_infra_recovery.py'
      - 'Function defined: bob3.orchestrator.rca_infra_recovery.classify_attempts (returns "infra_only" | "feature_defect" | "mixed", with cited heuristics)'
      - 'Function defined: bob3.orchestrator.rca_infra_recovery.harvest_novel_pattern (extracts a regex from N matching stderr tails using longest-common-subsequence; returns None if no pattern emerges)'
      - 'Function defined: bob3.orchestrator.rca_infra_recovery.auto_reset_if_infra (called by run_loop BEFORE transitioning to needs_human)'
      - 'Pre-NH transition hook: orchestrator MUST call auto_reset_if_infra before any feature.status="needs_human" assignment'
      - 'Reset behavior: when verdict=infra_only, status -> ready, refinement_attempts -> 0, append novel pattern (if any) to config/spawn_retry.yaml under `discovered_patterns:` key with `confidence: medium` and `discovered_at`/`feature_id` annotations'
      - 'Auto-reset cap: max 3 RCA-driven resets per feature per generation; on 4th attempt NH stands regardless of verdict (logged as `auto_reset_cap_reached`)'
      - 'Pattern graduation: a MEDIUM-confidence discovered pattern that matches a successful spawn within 24h is promoted to `confidence: high`; otherwise pruned (housekeeping job runs each round)'
      - 'Cross-feature crash clustering: classify_attempts checks .bob3/agent_logs/ for OTHER features that crashed in same 30min window with similar exit signature (boosts infra_only verdict)'
      - 'Telemetry: every RCA-driven reset emits structured event to reviews/rca_resets.jsonl with full evidence trail'
      - 'pytest: tests/test_classify_attempts_all_zero_work_events_is_infra.py'
      - 'pytest: tests/test_classify_attempts_with_real_work_is_feature_defect.py'
      - 'pytest: tests/test_classify_attempts_cross_feature_cluster_boosts_infra.py'
      - 'pytest: tests/test_classify_attempts_requires_2_of_4_heuristics.py'
      - 'pytest: tests/test_harvest_novel_pattern_extracts_lcs.py'
      - 'pytest: tests/test_harvest_novel_pattern_returns_none_for_dissimilar_stderrs.py'
      - 'pytest: tests/test_auto_reset_if_infra_writes_back_to_ready.py'
      - 'pytest: tests/test_auto_reset_cap_3_then_nh_stands.py'
      - 'pytest: tests/test_discovered_pattern_appended_to_config.py'
      - 'pytest: tests/test_pattern_graduation_medium_to_high_on_success.py'
      - 'pytest: tests/test_pattern_pruned_if_no_success_in_24h.py'
      - 'pytest: tests/test_pre_nh_hook_called_by_orchestrator.py'
      - 'integration: bob3.orchestrator.run_loop'
      - 'bob4/research/demonstrators/F-R7-479/spec.yaml exists: a feature whose spawn ALWAYS hits a never-before-seen infra error (new ENOENT path); demonstrator asserts (a) feature avoids NH, (b) novel pattern appears in spawn_retry.yaml after first RCA pass, (c) F-R7-478 spawn layer catches subsequent occurrences preemptively'

  F-R7-482:
    title: Ownership-evidenced regression detection (no scapegoat without proof)
    description: |
      bob3's `detect_regression` currently demotes arbitrary previously-completed
      features to `regression` status when downstream breakage appears, without
      establishing a causal link. Observed live in bob3 v.12 round 9:
      F-15f5b3b8 ("Blame-the-cause regression cascade") was itself scapegoated.

      Per memory/regression_scapegoat_mechanism.md: detection must require
      evidence that the demoted feature's own code/tests were touched (or
      transitively depended-upon) by the breaking commit. Without that
      evidence, the demotion is rejected and a `regression_unattributed`
      event is filed instead.
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/regression_attribution.py'
      - 'Function defined: bob3.orchestrator.regression_attribution.build_ownership_map (returns dict[feature_id, set[file_path]] from feature_id→commit→files_touched)'
      - 'Function defined: bob3.orchestrator.regression_attribution.attribute_breakage (inputs: failing_test_id, recent_commits, ownership_map; output: {attributed_feature: id|None, evidence: [...], confidence: 0..1})'
      - 'Function defined: bob3.orchestrator.regression_attribution.demote_with_evidence (atomic: only transitions status→regression when evidence non-empty AND confidence ≥ 0.60)'
      - 'detect_regression MUST call demote_with_evidence; bare-heuristic demotion path is removed (grep for `status=regression` in src/ shows ONLY the evidenced path)'
      - 'When evidence is empty: emit `regression_unattributed` event with failing_test_id + recent_commits; do NOT touch any feature status'
      - 'Previously-completed feature with NO file in the breaking commit set gets IMMUNITY (cannot be re-demoted in the same round)'
      - 'Transitive dependency: if feature A imports module owned by feature B and B was the only feature touched in the breaking commit, attribute to B not A (depth-3 max)'
      - 'Hard guard: a feature cannot be its own scapegoat (F-15f5b3b8 case) — if the attribution heuristic points back to a feature that itself implements regression_attribution, mark as `false_positive_self_blame` and skip'
      - 'pytest: tests/test_attribution_requires_file_overlap.py'
      - 'pytest: tests/test_attribution_rejects_scapegoat_without_evidence.py'
      - 'pytest: tests/test_attribution_transitive_dependency_chain.py'
      - 'pytest: tests/test_attribution_self_blame_guard.py'
      - 'pytest: tests/test_attribution_immunity_after_clear.py'
      - 'integration: bob3.orchestrator.detect_regression'
      - 'bob4/research/demonstrators/F-R7-482/spec.yaml exists: replay scenario where a v.12-style breakage is fed in; demonstrator asserts (a) feature NOT touched by breaking commit is NEVER demoted, (b) `regression_unattributed` fires when attribution fails, (c) self-blame guard fires on the F-15f5b3b8 reproduction'
