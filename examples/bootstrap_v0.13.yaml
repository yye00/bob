  F-R7-462:
    title: CodeT mutual-agreement triangulation (KxK code-test matrix)
    description: |
      F-R7-454 commits to one test-writer pass. CodeT's stronger pattern
      (ICLR 2023): spawn K candidate test sets and K candidate impls,
      then score each (code, test) cell of the KxK matrix by
      mutual-agreement. Removes the failure mode where a single bad
      test rubber-stamps a single bad implementation.

      Combined with TestGen-LLM's Build/Pass/Coverage triple filter,
      this is the cheapest known guard against AI-judge sycophancy
      that recursive bob3 has documented for over a year.

      Source: Agent 4 Section 9 (CodeT, ICLR 2023; TestGen-LLM).
    tier: Core
    role: implementer
    acceptance_criteria:
      - 'File exists: src/bob3/orchestrator/codet_triangulation.py'
      - 'Function defined: bob3.orchestrator.codet_triangulation.spawn_k_tests (default K=3, framings: positive/adversarial/boundary)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.spawn_k_impls (default K=2)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.score_matrix (mutual-agreement = passing_tests * tests_that_uniquely_fail_other_impls)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.triple_filter (Build/Pass/Coverage drop)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.persist_winning_cell (writes runs/<feature>/winner.yaml)'
      - 'Function defined: bob3.orchestrator.codet_triangulation.archive_losers (moves losing cells under runs/<feature>/variants/)'
      - 'pytest: tests/test_codet_kxk_scoring.py'
      - 'pytest: tests/test_codet_triple_filter_drops_dud_tests.py'
      - 'pytest: tests/test_codet_winner_selection_against_golden.py'
      - 'pytest: tests/test_codet_persists_winner.py'
      - 'pytest: tests/test_codet_archives_losers.py'
