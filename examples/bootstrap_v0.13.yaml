      - 'Function defined: bob3.verifier.baseline_capture.write_baseline_unstable_status (writes baseline_unstable status to runs/<round>/baseline.yaml with failing_test_file field)'
      - 'Function defined: bob3.verifier.baseline_capture.block_regression_demotion_while_unstable (returns True)'
