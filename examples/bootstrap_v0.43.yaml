  F-R7-611:
    title: Brownfield scope correction — vendor RepoMapper, reduce BF-5/BF-6 to enforcement
    description: "Post-research scope reductions. Three of the BF-1..BF-8 features\nshipped in sidecars\
      \ 031-034 are partially duplicative of Claude\nCode platform features. This sidecar reduces them\
      \ to thin\nenforcement layers, freeing tokens for things only bob3 can do.\n\n(A) BF-1 → vendor\
