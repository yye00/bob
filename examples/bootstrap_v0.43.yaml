  F-R7-507:
    title: Subagent observability mandate — forbid pytest stdout redirection to /dev/null
    description: 'bob3 v.13 r10: subagent d8483d98 (PID 2135582) invoked

      `python -m pytest tests/ -q --tb=short 2>&1 | grep -E "FAILED|ERROR" | head -10`,

      which redirected pytest stdout into a grep filter that produced

      no output until the (never-arriving) end of the run. The pytest

      child (PID 2164763) ran 43+ min at 49% CPU with /proc/2164763/fd/1

      pointing at a closed pipe — zero observability for the entire

      session. Combined with the unscoped-pytest defect (F-R7-505)

      this created a fully silent 50+min stall.

      Fix: the subagent verification prompt MUST explicitly forbid

      stdout/stderr redirection of pytest to /dev/null, capture-only

      grep filters, or `-q --no-header` modes. For long-running tests

      the streaming output is the ONLY signal that the run is not hung.

      Code patch already applied to bob12/superpowers.py:749; this

      feature locks the rule into the bob3 v.17 spec so future

      bootstraps re-apply it.

      '
    tier: Core
    acceptance_criteria:
    - 'Function defined: bob3.superpowers.get_verification_prompt'
    - 'Function defined: bob3.superpowers.verification_prompt_forbids_stdout_redirect (returns True iff
      prompt contains the no-redirect mandate)'
    - 'pytest: tests/test_verification_prompt_forbids_dev_null_redirect.py'
    - 'pytest: tests/test_verification_prompt_forbids_quiet_capture_modes.py'
    - 'pytest: tests/test_verification_prompt_mentions_observability_rationale.py'
    - 'pytest: tests/test_verification_prompt_boundary_no_pytest_section.py'
    - 'integration: bob3.superpowers'
  F-R7-508:
    title: Per-feature subagent watchdog — external timer cancels hung subagent independent of run-loop
      await
    description: 'bob3 v.13 r10: feature d8483d98 subagent hung in unscoped pytest

      for 50+ min; the orchestrator''s run-loop was synchronously

      awaiting that subagent''s exit, so even though the

      stuck_executing_reaper reset the DB row to ''ready'' at 21:30Z,

      the run-loop did NOT advance — it remained blocked in

      `await dispatch_subagent(...)`. Result: 5 ready rows, x:0,

      cumulative cost flat for 50+ min, pipeline visibly stalled.

      The 3600s _DEFAULT_FEATURE_TIMEOUT_SECONDS (run_loop.py:677)

      is the ONLY cancellation path and it lives inside the awaited

      coroutine — if asyncio scheduling delays it, the orchestrator

      stays blocked indefinitely.

      Fix: spawn a per-feature `asyncio.create_task` watchdog at

      dispatch time that holds the subagent PID and forcibly cancels

      (signal subagent process + cancel awaiting task) at a hard

      wall-clock deadline derived from BOB3_FEATURE_TIMEOUT_SECONDS.

      Watchdog runs on the orchestrator event loop, NOT inside the

      subagent coroutine, so it fires regardless of subagent state.

      '
    tier: Core
    acceptance_criteria:
    - 'File exists: src/bob3/orchestrator/feature_watchdog.py'
    - 'Function defined: bob3.orchestrator.feature_watchdog.arm_feature_watchdog'
    - 'Function defined: bob3.orchestrator.feature_watchdog.cancel_subagent_at_deadline'
    - 'Function defined: bob3.orchestrator.feature_watchdog.compute_deadline'
    - 'pytest: tests/test_feature_watchdog_fires_at_deadline.py'
    - 'pytest: tests/test_feature_watchdog_cancels_subagent_pid.py'
    - 'pytest: tests/test_feature_watchdog_skips_when_subagent_already_exited.py'
    - 'pytest: tests/test_feature_watchdog_boundary_zero_deadline.py'
    - 'pytest: tests/test_feature_watchdog_respects_env_override.py'
    - 'integration: bob3.orchestrator.run_loop'
  F-R7-509:
    title: Orchestrator dispatch concurrency — let multiple ready features run in parallel instead of
      strict single-flight
    description: 'bob3 v.13 r10 stall analysis: a single hung subagent blocked

      the entire pipeline because the orchestrator dispatches one

      feature at a time (synchronous await per feature). With max_turns=25

      per subagent and pytest verification potentially taking minutes,

      a single bad-actor feature can hold the whole round hostage even

      after F-R7-508 cancels it (next ready row only starts after

      cancellation completes).

      Fix: introduce BOB3_MAX_CONCURRENT_FEATURES (default 3) and

      dispatch up to N ready features as concurrent asyncio tasks.

      Each task carries its own watchdog (F-R7-508). The orchestrator

      tick loop becomes: gather completed → reap stuck → fill empty

      slots up to N. Eliminates the single-feature-blocks-round failure

      mode entirely; also halves wall-clock for rounds with many small

      features.

      '
    tier: Core
    acceptance_criteria:
    - 'Function defined: bob3.orchestrator.run_loop.dispatch_up_to_concurrency'
    - 'Function defined: bob3.orchestrator.run_loop.current_concurrency_slots'
    - 'Function defined: bob3.orchestrator.run_loop.gather_completed_dispatches'
    - 'pytest: tests/test_dispatch_concurrency_fills_to_cap.py'
    - 'pytest: tests/test_dispatch_concurrency_respects_env_override.py'
    - 'pytest: tests/test_dispatch_concurrency_one_hung_does_not_block_others.py'
    - 'pytest: tests/test_dispatch_concurrency_boundary_zero_ready.py'
    - 'pytest: tests/test_dispatch_concurrency_default_three.py'
    - 'integration: bob3.orchestrator.run_loop'
  F-R7-510:
    title: Hot-reload subagent prompt source on each dispatch — code-fixes land without orchestrator restart
    description: 'bob3 v.13 r10: a one-line patch to superpowers.py:749

      (scoped-pytest mandate) was applied to disk while the

      bob12-built orchestrator (PID 1520197) was running. The

      Python import cache meant the orchestrator continued

      dispatching subagents with the OLD prompt for 4+ hours.

      The patch only takes effect on the NEXT bob3 version build,

      which can be hours away. During active defect-hunting loops

      this defeats the dual-write protocol''s "code-fix in bob(i)"

      half — every code patch is invisibly delayed by one bob

      generation.

      Fix: on each subagent dispatch, check the mtime of

      superpowers.py (and any other prompt-source module); if it

      has changed since last reload, call importlib.reload() before

      reading VERIFICATION_PROMPT_SECTION / SKILLS_PROMPT_SECTION.

      Cheap (stat + dict lookup) and bounded (only reloads when

      the file actually changed).

      '
