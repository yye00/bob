    - 'pytest: tests/test_contract_grammar_lambda_binding.py asserts test_require_decorator_executes scenario
      passes when emitter is routed through emit_bound_require_decorator (regression test for 73879589
      root cause)'
  F-R7-566:
    title: enhanced_verification MUST recognize "Class defined:" AC prefix — currently no handler exists,
      every Class-defined AC silently default-fails and NH-demotes features whose emission was correct
    description: 'bob3 v.15 r12 (observed 2026-05-29 16:30:13 PDT): feature

