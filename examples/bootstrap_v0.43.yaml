  F-R7-482:
    title: Ownership-evidenced regression detection (no scapegoat without proof)
    description: 'bob3''s `detect_regression` currently demotes arbitrary previously-completed

      features to `regression` status when downstream breakage appears, without

      establishing a causal link. Observed live in bob3 v.12 round 9:

      F-15f5b3b8 ("Blame-the-cause regression cascade") was itself scapegoated.


      Per memory/regression_scapegoat_mechanism.md: detection must require

      evidence that the demoted feature''s own code/tests were touched (or

      transitively depended-upon) by the breaking commit. Without that

      evidence, the demotion is rejected and a `regression_unattributed`

      event is filed instead.

      '
    tier: Core
    role: implementer
    acceptance_criteria:
    - 'File exists: src/bob3/orchestrator/regression_attribution.py'
    - 'Function defined: bob3.orchestrator.regression_attribution.build_ownership_map (returns dict[feature_id,
      set[file_path]] from feature_id→commit→files_touched)'
    - 'Function defined: bob3.orchestrator.regression_attribution.attribute_breakage (inputs: failing_test_id,
      recent_commits, ownership_map; output: {attributed_feature: id|None, evidence: [...], confidence:
      0..1})'
    - 'Function defined: bob3.orchestrator.regression_attribution.demote_with_evidence (atomic: only transitions
      status→regression when evidence non-empty AND confidence ≥ 0.60)'
    - detect_regression MUST call demote_with_evidence; bare-heuristic demotion path is removed (grep
      for `status=regression` in src/ shows ONLY the evidenced path)
    - 'When evidence is empty: emit `regression_unattributed` event with failing_test_id + recent_commits;
      do NOT touch any feature status'
    - Previously-completed feature with NO file in the breaking commit set gets IMMUNITY (cannot be re-demoted
      in the same round)
    - 'Transitive dependency: if feature A imports module owned by feature B and B was the only feature
      touched in the breaking commit, attribute to B not A (depth-3 max)'
    - 'Hard guard: a feature cannot be its own scapegoat (F-15f5b3b8 case) — if the attribution heuristic
      points back to a feature that itself implements regression_attribution, mark as `false_positive_self_blame`
      and skip'
    - 'pytest: tests/test_attribution_requires_file_overlap.py'
    - 'pytest: tests/test_attribution_rejects_scapegoat_without_evidence.py'
    - 'pytest: tests/test_attribution_transitive_dependency_chain.py'
    - 'pytest: tests/test_attribution_self_blame_guard.py'
    - 'pytest: tests/test_attribution_immunity_after_clear.py'
    - 'integration: bob3.orchestrator.detect_regression'
    - 'bob4/research/demonstrators/F-R7-482/spec.yaml exists: replay scenario where a v.12-style breakage
