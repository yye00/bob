    acceptance_criteria:
    - 'File exists: src/bob3/spec_quality/spec_critic.py'
    - 'File exists: src/bob3/spec_quality/spec_constitution.md'
    - 'Function defined: bob3.spec_quality.spec_critic.critique_feature'
    - 'Function defined: bob3.spec_quality.spec_critic.persist_findings'
    - 'Function defined: bob3.spec_quality.spec_critic.run_revise_loop (bounded to 1 revise pass)'
    - 'Function defined: bob3.spec_quality.spec_critic.escalates_to_clarification_on_second_round (returns
      True; escalates to F-R7-456 on second-round defects)'
    - 'Function defined: bob3.spec_quality.spec_critic.handle_empty_constitution (raises ConstitutionMissingError
      when spec_constitution.md absent)'
    - 'Function defined: bob3.spec_quality.spec_critic.defect_type_is_known (returns True for defect_type
      in ambiguity/missing_edge_case/untestable/implementation_leak/vague_quantifier/missing_actor/unreachable_integration)'
    - 'pytest: tests/test_spec_critic_emits_structured_defects.py'
    - 'pytest: tests/test_spec_critic_revise_loop_bounded.py'
    - 'pytest: tests/test_spec_critic_findings_registry.py'
    - 'pytest: tests/test_spec_critic_rejects_unknown_defect_type.py asserts critique_feature raises ValueError
