  F-R7-605:
    title: BF-3 — Elicitation classifier + clarification-budget gate
    description: "Intent-research synthesis (ae2a9.. + a9eaa..). Convert free-text\nuser requests into\
      \ the BrownfieldIntent schema, score ambiguity\nvia k-sample stub consistency (ClarifyGPT), and\
      \ gate\nAskUserQuestion invocation by value-of-information.\n\nConcrete:\n  1. New module src/bob3/brownfield/elicit.py\n\
      \  2. Pydantic schema BrownfieldIntent:\n       intent_kind: Literal[add,modify,refactor,fix,delete,\n\
      \                            migrate,configure,integrate,explain,test]\n       capability, target_subsystem,\
      \ mechanism, provider\n       jtbd: {situation, motivation, outcome}\n       acceptance_criteria:\
      \ list[EARS-typed AC with source_span]\n       ambiguity_score: float 0..1\n       ambiguity_loci:\
      \ list[str]   # field names needing clarification\n       user_prompt_raw: str        # verbatim,\
      \ never summarized\n  3. Extraction: Instructor (Pydantic + function-calling) with\n     re-prompt\
      \ loop; closed-vocab fields (intent_kind, mechanism)\n     use constrained decoding.\n  4. Ambiguity\
      \ score: generate K=3 candidate stubs; if EARS\n     triggers/states diverge across them, score\
      \ high.\n  5. Clarification gate (3-rule policy, per a9eaa..):\n     - ASK only for external bindings\
      \ (package, provider, persistence,\n       public API). Cap 2 questions/stub.\n     - ASSUME for\
      \ internal/reversible (naming, layout, helper sigs).\n       Log to assumption_record.\n     - BRANCH-INTO-CANDIDATES\
      \ (default) when ≥2 interpretations\n       have comparable prior — emit N stubs tagged interpretation=A|B.\n\
      \  6. Headless `claude -p` workers MUST take branch path; ASK is\n     reserved for interactive\
      \ `bob3 init` shell.\n  7. Persisted assumptions are POLICY-level only (e.g. 'prefer pnpm'),\n \
      \    never task-answers (e.g. 'use port 8080') — re-confirm on\n     stack/version change.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
