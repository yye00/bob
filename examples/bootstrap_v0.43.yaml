  F-R7-556:
    title: spec_findings.yaml writer MUST use atomic tmp+rename — partial-write corruption kills bob3
      boot with ScannerError mapping-values-not-allowed
    description: 'bob3 v.13 r10 (observed 2026-05-29 00:37 UTC): bob3 process

      2551581 launched and exited within 5.6s with

      yaml.scanner.ScannerError at

      /home/yelkhamr/dark-factory/bob13/reviews/spec_findings.yaml

      line 1239 column 9. Manual inspection: line 1238 began with

      the truncated key `me: perf-orphan-69` instead of a record

      header — evidence of a concurrent or interrupted partial

      overwrite of the findings file. Net effect: bob3 cannot boot

      until operator manually repairs the YAML; 6 watchdog

      relaunch attempts all hit the same error and ALL_BLOCKED

      clean-exited; chain stalled for hours.


      Fix at extraction (spec-over-code-fix): every spec emitting

      writes to spec_findings.yaml (or any persisted YAML state

      file under reviews/) MUST require the writer to perform an

      atomic tmp+rename (write to <path>.tmp, fsync, os.rename

      onto target). Mid-write SIGTERM/SIGKILL or concurrent

      writers MUST NOT leave a malformed YAML on disk. Reader

      side: on ScannerError at boot, the loader MUST log a

      structured spec_findings_corrupt event AND quarantine the

      file to spec_findings.yaml.corrupt.<ts> rather than crash —

      empty findings is recoverable; boot-loop crash is not.

      '
    risk_category: medium
    acceptance_criteria:
    - 'File exists: src/bob3/reviews/spec_findings_writer.py'
    - 'Function defined: bob3.reviews.spec_findings_writer.atomic_write_yaml'
    - 'Function defined: bob3.reviews.spec_findings_writer.quarantine_corrupt_findings'
    - 'behavior: atomic_write_yaml writes the serialized YAML to <path>.tmp, calls fsync on the tmp file
      handle, then os.rename onto the target path'
    - 'behavior: atomic_write_yaml never leaves a partially-written target file on disk even when interrupted
      between write and rename'
    - 'behavior: quarantine_corrupt_findings on yaml.scanner.ScannerError moves the offending file to
      <path>.corrupt.<unix_ts> and returns an empty findings dict so boot proceeds'
    - 'integration: all spec_findings.yaml writes in bob3.reviews route through atomic_write_yaml; no
      direct open(path, ''w'') + yaml.dump remains'
    - 'integration: bob3 boot path catches yaml.scanner.ScannerError from spec_findings.yaml load and
      invokes quarantine_corrupt_findings; logs spec_findings_corrupt structured event; does NOT crash'
    - 'pytest: tests/test_spec_findings_atomic_writer.py asserts SIGKILL mid-write leaves target file
      unchanged (only .tmp present)'
    - 'pytest: tests/test_spec_findings_atomic_writer.py asserts quarantine_corrupt_findings on a hand-crafted
      malformed YAML quarantines + returns empty dict'
    - 'pytest: tests/test_spec_findings_atomic_writer.py asserts post-quarantine boot continues (no exception
      propagates)'
  F-R7-557:
    title: run_loop MUST reap claude subagent process on feature terminal-state transition — orphan subagents
      persist indefinitely after completed/needs_human, leaking resources and confusing pgrep-based reapers
    description: "bob3 v.14 round 11 (observed 2026-05-29 12:14 UTC): claude\nsubagent PID 3679066 was\
      \ launched for feature 5cba1ba1 around\n04:38 PDT; the feature transitioned to status='completed'\
      \ at\n05:04:13 PDT after evaluator pass; run_loop moved on (picked\nb01eb4d1 at 05:00:26), but PID\
      \ 3679066 was STILL RUNNING 57\nminutes later, holding sonnet-4.6 API connections and a 25-turn\n\
      claude harness alive against a feature that no longer needs it.\nSame pattern observable for additional\
      \ stale claude PIDs from\nearlier features.\n\nTwo failure modes follow:\n(a) Resource leak: each\
      \ orphan subagent holds an API connection,\n    a stream-json parser, an MCP plugin loader, and\
      \ ~50 zombie\n    memory_mcp helper processes (49+ observed in pgrep). At\n    steady state this\
      \ can pin gigabytes of RSS and burn API\n    tokens against work the orchestrator no longer cares\
      \ about.\n(b) Reaper confusion: bob4/tools/stuck_executing_reaper.sh uses\n    `pgrep -af \"claude.*--print\"\
      \ | grep -oE \"feature [a-f0-9-]+\"`\n    to identify live subagent PIDs by feature id. An orphan\n\
      \    subagent for feature X makes the reaper believe X is still\n    actively executing — but the\
      \ DB row for X is already\n    completed, so any future pick of an unrelated row with a\n    similar\
      \ id pattern could be misclassified.\n\nFix at extraction (spec-over-code-fix): run_loop's\nfeature-completion\
      \ handler MUST SIGTERM the claude subagent\nprocess tagged with the just-completed feature id, then\
      \ SIGKILL\nafter a 15s grace window if SIGTERM is ignored. Applies to all\nterminal transitions:\
      \ completed, needs_human, regression,\nfailed. A backstop sweeper MUST also reap orphan subagents\n\
      whose tagged feature id is in a terminal state for >5min\n(catches handler-bypass paths like SIGKILL'd\
      \ orchestrator\nrestart mid-completion). Audit log records sentinel\nsubagent_reaped_on_terminal=<feature_id>\
      \ on each reap.\n"
    risk_category: medium
    acceptance_criteria:
    - 'File exists: src/bob3/orchestrator/subagent_reaper.py'
    - 'Function defined: bob3.orchestrator.subagent_reaper.find_subagent_pid_for_feature'
    - 'Function defined: bob3.orchestrator.subagent_reaper.reap_subagent_for_feature'
    - 'Function defined: bob3.orchestrator.subagent_reaper.sweep_orphan_subagents'
    - 'behavior: find_subagent_pid_for_feature scans live processes for `claude.*--print` invocations
      tagged with `feature <feature_id>` in the prompt argv and returns the PID list (empty when none
      found)'
    - 'behavior: reap_subagent_for_feature sends SIGTERM to each PID returned by find_subagent_pid_for_feature,
      waits up to 15 seconds for the process to exit, then sends SIGKILL if still alive; appends sentinel
      subagent_reaped_on_terminal=<feature_id> to feature audit log'
    - 'behavior: sweep_orphan_subagents queries features where status IN (''completed'',''needs_human'',''regression'',''failed'')
      AND (julianday(''now'') - julianday(updated_at)) * 1440 > 5, calls reap_subagent_for_feature for
      each, returns the list of reaped (feature_id, pid) pairs'
    - 'behavior: reap_subagent_for_feature MUST NOT kill the bob3 main orchestrator process or any unrelated
      claude subagent — process matching requires both the `claude` binary AND the specific feature_id
      token in argv'
    - 'integration: bob3.orchestrator.run_loop completion handler invokes reap_subagent_for_feature(feature_id)
      within 30s of every status transition to a terminal state (completed/needs_human/regression/failed)'
    - 'integration: sweep_orphan_subagents runs at the same cadence as the existing stuck_executing reaper
      (watchdog tick); both reapers are idempotent and safe to run concurrently'
    - 'pytest: tests/test_subagent_reaper_terminal_transition.py asserts subagent for newly-completed
      feature is reaped within 30s window'
    - 'pytest: tests/test_subagent_reaper_sweep_orphans.py asserts orphan subagent for feature whose terminal-state
      dwell >5min is reaped by sweep'
    - 'pytest: tests/test_subagent_reaper_safety.py asserts reap_subagent_for_feature with a non-matching
      feature_id returns 0 reaped PIDs (no false-positive kills) — error/safety path'
    - 'pytest: tests/test_subagent_reaper_safety.py asserts the bob3 main orchestrator PID is NEVER in
