    - 'Function defined: bob3.synthesis.canonical_ac_emitter.emit_negative_path_ac'
    - 'Function defined: bob3.synthesis.canonical_ac_emitter.synthesise_with_canonical_gate'
    - 'behavior: validate_canonical_form takes a list of AC strings and returns the subset that does NOT
