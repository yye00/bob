  F-R7-600:
    title: BF-4 — Hierarchical Localizer (file → class/symbol → edit-site)
    description: "Agentless-style hierarchical localization. Given an intent stub,\nnarrow to (file, symbol,\
      \ lineno) before any code-write subagent\nfires. Populates feature.touches / feature.symbols / feature.edit_sites\n\
      so coordinator can enforce disjoint write surfaces (per\n[[feedback-always-8-workers]]).\n\nPipeline:\n\
      \  1. New module src/bob3/brownfield/localizer.py\n  2. Input: feature intent (capability + target_subsystem\
      \ + keywords)\n  3. Stage A — file shortlist:\n     - BM25 over survey.db symbol names + docstrings\
      \ + file paths\n     - Top-K=15 files\n  4. Stage B — symbol shortlist:\n     - For each candidate\
      \ file, rank its symbols by:\n       pagerank(symbol) * cosine(symbol.signature, intent.text)\n\
      \     - Top-K=5 symbols\n  5. Stage C — edit-site (lineno + scope):\n     - For each candidate symbol,\
      \ emit (path, start_line, end_line,\n       scope='function'|'class'|'module')\n  6. Persist to\
      \ feature.localization JSON column\n  7. Disjointness check: if two ready features overlap on\n\
      \     (path, scope), serialize them — never dispatch concurrently.\n\nDepends on F-R7-599 (survey.db).\n"
