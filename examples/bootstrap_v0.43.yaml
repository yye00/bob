  F-R7-610:
    title: Search-subagent pattern (WarpGrep) + multi-candidate patch + LLM-judge vote
    description: "Two leaderboard-validated multi-agent patterns. WarpGrep v2\nreports +2.1-2.2pp on Verified\
      \ across all models tested.\nAnthropic high-compute (parallel-N + visible-regression-filter\n+ LLM\
      \ judge) reports +4.8pp over baseline.\n\n(A) Search subagent\n    - Spawn a dedicated 'locator'\
      \ Task sub-agent whose ENTIRE\n      job is grep → return 3-5 (file, span) candidates.\n    - Its\
      \ transcript is DISCARDED after return (don't pollute\n      parent context).\n    - Bypasses the\
      \ localizer (F-R7-600) when the localizer\n      returns >20 candidate symbols.\n    - New module\
      \ src/bob3/brownfield/search_subagent.py\n    - Output schema: list[{path, start_line, end_line,\n\
      \      confidence, rationale_snippet}]\n\n(B) Multi-candidate patch + LLM-judge\n    - For features\
      \ with feature.difficulty >= 'hard' (set by\n      spec_quality or prior_attempts >= 1):\n     \
      \   1. Spawn N=3 worker candidates in parallel worktrees.\n        2. Each produces a patch + test\
      \ result.\n        3. Filter: drop any patch that breaks visible existing\n           regression\
      \ tests.\n        4. Survivors: LLM-judge sub-agent ranks by patch quality\n           (test-pass\
      \ count, code-style adherence, minimal-diff,\n           spec-AC coverage).\n        5. Commit the\
      \ winner; archive losers to\n           .bob3/features/<id>/losers/.\n    - Cost: 3× per hard feature.\
      \ Use feature.difficulty gate.\n    - Telemetry: {\"event\":\"MULTI_CANDIDATE_WIN\",\"feature_id\"\
      :...,\n       \"winner_idx\":N, \"judge_reason\":\"...\"}\n"
