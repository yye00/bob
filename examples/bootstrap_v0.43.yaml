  F-R7-606:
    title: BF-5 — Resurrection gate (Tier-1 partial-work detector)
    description: "Before bob3 implements a \"new\" feature in a brownfield repo,\ncheck whether someone\
      \ already started it and abandoned the work.\nThree Tier-1 signals; if any fire, demote to needs_human\
      \ with a\nresurrection_report instead of dispatching a fresh implementer.\n\nConcrete:\n  1. New\
      \ module src/bob3/brownfield/resurrection.py\n  2. Signal A — Stale PR/branch:\n     - `gh pr list\
      \ --state open --search 'is:draft updated:<90d-ago'`\n       filtered by feature.capability keywords\
      \ in title/body\n     - `git for-each-ref refs/heads` for branches diverged >=30d\n       touching\
      \ feature.touches paths\n  3. Signal B — Export-without-impl (AST):\n     - For each path in feature.touches:\
      \ parse with tree-sitter;\n       find symbols that are exported (in __all__ or `export`\n     \
      \  keyword) but whose body is `pass`, `raise NotImplementedError`,\n       `throw new Error('TODO')`,\
      \ or empty.\n  4. Signal C — Disk-scoped TODO clusters:\n     - `git log -p --since=180d --grep='TODO\\\
      |FIXME' -- <touches>`\n       where ≥3 commits in the touch-set reference the same TODO.\n  5. If\
      \ any signal fires, write\n     .bob3/features/<id>/resurrection_report.md with:\n       - signal_kind,\
      \ evidence (URLs/SHAs/line refs), staleness_days\n       - recommended_action: resume_pr | rebase_branch\
      \ | finish_stub\n     …and demote feature to needs_human with reason='partial_work_detected'.\n\
      \  6. Counts toward NH budget but NEVER toward retry budget.\n"
    priority: high
    permanent_forward_carry: true
