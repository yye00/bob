    - 'behavior: get_per_attempt_cap returns float(env BOB3_PER_ATTEMPT_COST_CAP) clamped to [0.5, 100],
      default 10.0'
    - 'behavior: should_terminate_subagent returns True iff reported_attempt_cost > get_per_attempt_cap()'
    - 'behavior: terminate_subagent_on_cost_cap sends SIGTERM, waits 15s, SIGKILL if alive; appends sentinel
