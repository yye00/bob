  F-R7-604:
    title: BF-2 — Research-as-documentarian sub-agent (hide-the-ticket pattern)
    description: "Dex Horthy / HumanLayer brownfield key tactic: when researching\nan existing codebase\
      \ to add a feature, the research subagent\nmust NOT see the ticket/intent text — only the repo.\
      \ Otherwise\nit confirmation-biases its findings toward the ticket and\nmisses adjacent code that's\
      \ the real culprit.\n\nConcrete:\n  1. New role 'researcher' in src/bob3/agents/roles.py\n  2. Researcher\
      \ prompt template includes ONLY:\n     - the target_subsystem path glob (from localizer)\n     -\
      \ the survey.db symbol shortlist\n     - instruction: \"Document what this code does, its callers,\n\
      \       its invariants, and any inconsistencies. Do NOT speculate\n       about what changes might\
      \ be needed.\"\n  3. Output: .bob3/features/<id>/research_notes.md\n  4. Coordinator merges research_notes.md\
      \ + intent stub for the\n     implementer subagent (which DOES see both).\n  5. Research is a separate\
      \ dispatch slot from implementer;\n     cached across retries (same survey sha + same path glob\
      \ =\n     same notes, skip re-research).\n\nIncorporates intent-capture research (a9eaa..clarification):\
      \ the\nresearcher's output is what the elicitation classifier (F-R7-605)\ndiffs against the user\
      \ prompt to compute ambiguity_score.\n"
