      \     for genuinely incomplete features).\n  3. Emit structured count: {\"event\":\"FINAL_SWEEP_SUMMARY\"\
      ,\n     \"promoted\":N,\"flipped_failed\":M} at end of sweep.\n\nSafety: only PROMOTES on disk evidence\
