      > cap'
  F-R7-564:
    title: readiness_score MUST be rederived from current confidence components on each refinement attempt
      — currently stored as decaying state, ratcheting feature toward terminal demotion regardless of
      fresh signal
    description: 'bob3 v.14 src inspection: run_loop._decay_confidence_after_failure

      drops readiness by 0.15 per failure but the inverse (readiness

      RECOMPUTE from improved confidence components) never fires

      during the refinement loop. db.calculate_readiness is only

      called at feature CREATION. F-R7-479 RCA auto-reset bounces

      the feature back to ready and resets attempts=0 but does NOT

      restore the decayed readiness_score nor recompute it from

      current confidence values. Net effect: a feature that crashes

      twice has readiness=0.85→0.70→0.55→0.40 monotonically, no

      matter what subsequent attempts achieve. The 5-attempt cap

      and the decomposition gate both depend on readiness signal,

      so the ratchet silently steers every flaky-but-recoverable

      feature into needs_human terminal state.


      Fix at extraction (spec-over-code-fix): readiness_score MUST

      be DERIVED, not STORED-AND-DECAYED. Every read of

      readiness_score MUST be the live recomputation:

      mean(conf_impl_correctness, conf_spec_understanding,

      conf_test_quality) — or whatever current component set

      calculate_readiness uses. Confidence components themselves

      may decay (those are signal); readiness aggregates them at

      read time. _decay_confidence_after_failure decays components

      ONLY; it no longer writes readiness_score. F-R7-479 auto-

      reset restores baseline confidence (snapshot at feature

      creation) when classified as infra/transient.

      '
    risk_category: high
    acceptance_criteria:
    - 'File exists: src/bob3/db/readiness_recompute.py'
    - 'Function defined: bob3.db.readiness_recompute.compute_live_readiness'
    - 'Function defined: bob3.db.readiness_recompute.snapshot_baseline_confidence'
    - 'Function defined: bob3.db.readiness_recompute.restore_baseline_confidence'
    - 'behavior: compute_live_readiness reads conf_impl_correctness, conf_spec_understanding, conf_test_quality
      from the feature row and returns the canonical aggregate (mean by default)'
    - 'behavior: snapshot_baseline_confidence stores (conf_impl_correctness, conf_spec_understanding,
      conf_test_quality) at feature creation as baseline_conf_* columns OR a serialized baseline_confidence
      JSON column'
    - 'behavior: restore_baseline_confidence rewrites the live conf_* columns from the baseline snapshot;
      called by F-R7-479 auto-reset path'
    - 'integration: bob3.orchestrator.run_loop _decay_confidence_after_failure decays component conf_*
      values but does NOT write readiness_score; readiness is rederived on read'
    - 'integration: bob3.orchestrator.rca_infra_recovery.auto_reset_if_infra calls restore_baseline_confidence
      when transitioning needs_human→ready'
    - 'integration: every read of feature.readiness_score in run_loop goes through compute_live_readiness;
      the column may remain in the DB schema for compatibility but its persisted value is ignored'
    - 'pytest: tests/test_readiness_live_recompute.py asserts a feature whose conf_impl=0.9 conf_spec=0.9
      conf_test=0.9 reads readiness=0.9 even if persisted readiness_score=0.1 (decayed)'
    - 'pytest: tests/test_readiness_decay_no_ratchet.py asserts 2 successive failures decay components
      but a subsequent baseline restore returns readiness to the original value'
    - 'pytest: tests/test_readiness_baseline_snapshot.py asserts snapshot_baseline_confidence at creation
      captures the original component triple (error/boundary: missing column raises ValueError)'
  F-R7-565:
    title: contract_grammar emitter MUST bind lambda parameters to free variables in precondition/postcondition
      expressions — currently emits zero-arg lambda causing icontract.require to fail at runtime, NH-demoting
      every Design-by-Contract feature
    description: 'bob3 v.15 r12 (observed 2026-05-29 PDT): feature 73879589

      (Design-by-Contract sub-grammar on behavior — pre/post/inv/raises)

      NH-demoted at attempts=5 because the emitted contract_grammar

