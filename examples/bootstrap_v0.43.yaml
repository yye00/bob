  F-R7-595:
    title: pending_successor_verify — auto-defer verifier-self-extension features to the next generation
    description: "bob3 v.25, v.26, v.27 all hit the same convergence floor: 3-4 features\nthat EXTEND\
      \ enhanced_verification.py itself can never close, because the\nrunning verifier cannot validate\
      \ code that modifies the very mechanism\ndoing the validation (self-reference treadmill).\n\nConcretely,\
      \ v.27 ended 81c/3f with the failed cluster:\n  - d0b94fd0 (AC artifact-existence verifier — refuse\
      \ to pass AC when\n    referenced files are missing)\n  - d5879353 (enhanced_verification._check_criterion_with_details\
      \ MUST\n    demote pure-prose AC failures to warning)\n  - 899825df (Prose-AC and integration-AC\
      \ demoters MUST match structural\n    prefixes at START-of-string)\n\nAll three modify enhanced_verification.py.\
      \ The running v.27 verifier\nlacks the proposed behavior, so its own behavior-ACs against the new\n\
      logic fail. v.25 and v.26 saw the same shape (80c/4f, same ID cluster).\n\nF-R7-592 ALREADY SPECCED\
      \ `pending_successor_verify` as a status — but\nno v.27 src has implemented it (`grep pending_successor_verify\n\
      bob27/src/` returns nothing). The feature spec existed in a prior\nsidecar but the orchestrator\
      \ never closed it because it too tripped on\nverifier self-reference. We break the loop here with\
      \ a STRUCTURAL-ONLY\nspec (per [[F-R7-593]] discipline) so the running verifier of the\ngeneration\
      \ that inherits this sidecar (v.28) can close it without\nexecuting the behavior.\n\nFix (runtime\
      \ hot-detect + status transition):\n  1. At feature-claim time (before the test-writer subagent\
      \ runs),\n     the orchestrator scans the feature's acceptance_criteria for any\n     AC whose body\
      \ references `enhanced_verification`, `verifier`,\n     `_check_criterion`, or `_demote_` AND whose\
      \ prefix is `behavior:`.\n  2. If matched, the orchestrator updates the feature row to\n     `status='pending_successor_verify'`\
      \ and skips the subagent\n     dispatch. Cost: 0. The feature is excluded from `failed_count`\n\
      \     and counted toward `deferred_count` in the run summary.\n  3. On `bob3 spawn`, the next generation's\
      \ bootstrap merger copies\n     every `pending_successor_verify` row into the child's feature\n\
      \     queue with status reset to `ready`. The child's verifier now\n     HAS the prior generation's\
      \ verifier-extension code already\n     applied to its src tree (because v.N+1's src is a snapshot\
      \ of\n     v.N's post-build state), so the behavior-ACs evaluate against\n     the new logic and\
      \ pass on first attempt.\n\nSafe: only behavior-ACs against the verifier itself are deferred.\n\
      Structural/integration/file-existence ACs continue down their normal\npath. Non-verifier features\
      \ are unaffected. If the heuristic\nfalse-positives, the worst case is that a feature defers one\n\
      generation late — no closure regressions.\n"
    priority: high
    permanent_forward_carry: true
    acceptance_criteria:
    - 'structural: src/bob3/run_loop.py contains the literal string ''pending_successor_verify'''
    - 'structural: src/bob3/run_loop.py contains the literal string ''F-R7-595'''
    - 'structural: src/bob3/run_loop.py contains the literal string ''enhanced_verification'' within 80
      lines of the F-R7-595 marker'
    - 'structural: src/bob3/spawn.py contains the literal string ''pending_successor_verify'''
    - 'structural: src/bob3/spawn.py contains the literal string ''F-R7-595'''
    - 'file_exists: src/bob3/run_loop.py'
    - 'file_exists: src/bob3/spawn.py'
    - 'integration: tests/test_pending_successor_verify.sh'
  F-R7-596:
    title: pending_successor_verify — broaden detection to target-file scan (not just AC body wording)
    description: "F-R7-595 (sidecar_027) deferred verifier-self-extension features by\npattern-matching\
      \ AC body text for \"enhanced_verification\", \"_check_\",\n\"_demote_\". bob3 v.28 round 1 closed\
      \ 84/85 but missed feature\nd34c40f0 (\"AC artifact-existence verifier — refuse to pass AC when\n\
      referenced files are missing\"). Its behavior-ACs describe NEW\nverifier semantics but the AC bodies\
      \ say \"refuse to pass\" / \"AC\nartifact\" without naming `enhanced_verification`, so the F-R7-595\n\
      heuristic missed it. Result: the feature ran subagents that produced\na diff extending enhanced_verification.py,\
      \ but the running\nverifier could not validate the new behavior against itself\n(self-reference).\
      \ Status -> failed (orphan-executing sweep).\n\nFix (F-R7-596, broaden the detector):\n  1. Before\
      \ subagent dispatch, scan EACH structural and integration\n     AC body for any of these path-tokens:\n\
      \       - 'src/bob3/enhanced_verification.py'\n       - 'enhanced_verification'  (anywhere in body)\n\
      \       - any path ending in '_verification.py' OR '_verifier.py'\n  2. If ANY AC body contains\
      \ such a token AND the feature has at\n     least one behavior-AC, mark the feature\n     status='pending_successor_verify'\
      \ (same machinery as\n     F-R7-595) BEFORE any subagent fires. Cost: 0.\n  3. Title-fallback: if\
      \ title contains the substring 'verifier'\n     AND the feature has at least one behavior-AC referencing\n\
      \     verification/AC/criterion semantics, also defer.\n  4. Successor merger (F-R7-595 step 3)\
      \ is unchanged: child gen's\n     bootstrap merge re-readies any pending_successor_verify rows.\n\
      \nSafety: detector only adds defers; it cannot un-defer or close\nanything. False-positives just\
      \ push a feature one gen forward\n(no regression vs current behavior, which would have failed it\n\
      anyway). False-negatives reduce to the v.28 ceiling.\n"
    priority: high
    permanent_forward_carry: true
    acceptance_criteria:
    - 'structural: src/bob3/run_loop.py contains the literal string ''F-R7-596'''
    - 'structural: src/bob3/run_loop.py contains the literal string ''pending_successor_verify'' within
