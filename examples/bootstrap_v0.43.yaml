      \ ACs satisfied on workspace),\n        update status to 'completed' and emit:\n          {\"event\"\
      :\"FINAL_SWEEP_DISK_PROMOTED\",\"feature_id\":...}\n        Skip the flip-to-failed.\n  2. If reconciler\
