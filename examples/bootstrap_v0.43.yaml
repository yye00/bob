  F-R7-608:
    title: Claude-Code worker leverage — enable prompt cache, slim per-worker context, re-declare settings
    description: "Research synthesis from 4 brownfield agents identifies three\nhigh-ROI Claude-Code platform\
      \ fixes bob3 must apply to every\nspawned worker, before the BF-* features even matter for cost.\n\
      \n(A) Enable prompt caching on every spawned worker\n    - Issue #29966: Agent SDK sub-agents hardcode\n\
      \      enablePromptCaching=false, causing ~378K wasted tokens\n      per session from ~7K system\
      \ prompts re-billed every call.\n    - bob3 dispatches ~8 workers concurrently per feature → this\n\
      \      is the single largest cost leak in the pipeline.\n    - Fix: in src/bob3/dispatch.py worker\
      \ spawn, explicitly set\n      enable_prompt_caching=True on every Anthropic API call\n      and\
      \ every claude -p invocation. Add structured event\n      {\"event\":\"WORKER_CACHE_HIT\",\"cache_read\"\
      :N,\"cache_write\":M}\n      per worker exit for cost telemetry.\n\n(B) Slim worker context — split\
      \ CLAUDE.md\n    - CLAUDE.md is reloaded into every sub-agent's fresh context.\n    - bob3's CLAUDE.md\
      \ (loop-operator memory ~70 bullets) is not\n      relevant to a feature-implementing worker.\n\
      \    - Fix: rename loop-operator CLAUDE.md → CLAUDE_OPERATOR.md\n      (loaded by orchestrator only).\
      \ Generate per-worker\n      WORKER.md at dispatch time containing ONLY:\n        - feature title\
      \ + description\n        - the resolved AC list (post-extraction)\n        - the localization shortlist\
      \ (BF-4 output)\n        - the workspace path\n      Workers get WORKER.md loaded, NOT CLAUDE_OPERATOR.md.\n\
      \    - Save ~6K tokens × 8 workers × 88 features ≈ 4.2M tokens/round.\n\n(C) Re-declare settings\
      \ per worker\n    - Issue #27661: sub-agents do NOT inherit hooks/permissions\n      from parent\
      \ .claude/settings.json.\n    - bob3 currently assumes workers inherit\n      permissions.allow;\
      \ permission prompts fire silently inside\n      workers and they appear stalled.\n    - Fix: write\
      \ per-feature .bob3/features/<id>/settings.json\n      at dispatch time, pass via `claude -p --settings\
      \ <path>`.\n      Settings include the union of (project default +\n      feature-specific tool\
      \ allowlist from localization).\n    - Telemetry: {\"event\":\"WORKER_PERM_PROMPT\",\"feature_id\"\
      :...,\n      \"tool\":...} if a permission prompt is detected.\n\nWhy permanent_forward_carry: this\
      \ is bob3-platform plumbing —\nevery future generation pays this cost without the fix.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'structural: src/bob3/dispatch.py contains the literal string ''F-R7-608'''
    - 'structural: src/bob3/dispatch.py contains the literal string ''enable_prompt_caching'' within 300
      lines of the F-R7-608 marker'
    - 'structural: src/bob3/dispatch.py contains the literal string ''WORKER.md'' within 300 lines of
      the F-R7-608 marker'
    - 'structural: src/bob3/dispatch.py contains the literal string ''WORKER_CACHE_HIT'' within 300 lines
      of the F-R7-608 marker'
    - 'structural: src/bob3/dispatch.py contains the literal string ''WORKER_PERM_PROMPT'' within 400
      lines of the F-R7-608 marker'
    - 'file_exists: src/bob3/dispatch.py'
    - 'integration: tests/test_worker_cache_and_perms.sh'
  F-R7-609:
    title: SWE-Bench cheap wins — repo tree, failing-test-first, adaptive edit mode, mutation-pass check
    description: "Four leaderboard-validated brownfield prompt/edit directives\nthat cost <5% complexity\
      \ and add measurable accuracy. Synthesis\nfrom Anthropic's SWE-Bench scaffold (Sonnet 4.5 77.2%,\
      \ high-comp\n82.0%), Agentless 1.5 (50.8%), SWE-Edit (NeurIPS 2025,\n+2.1% / -17.9% cost), and ICSE\
      \ 2026 false-pass study (12-22%).\n\n(A) Repo tree in worker system prompt\n    - Cheapest localization\
      \ lift on Verified — addresses the #1\n      failure mode \"right file wrong abstraction\" + the\
      \ secondary\n      \"wrong file\" mode.\n    - In src/bob3/dispatch.py, before spawning a worker:\n\
      \        tree -L 3 -I '.git|.venv|node_modules|__pycache__' <workspace>\n      Cap at 200 lines;\
      \ truncate with \"… (N more)\".\n      Prepend to WORKER.md from F-R7-608.\n\n(B) \"Write a failing\
      \ repro test first\" directive\n    - Anthropic's own +pp prompt addendum: before editing,\n   \
      \   worker writes a failing test that captures the bug/missing\n      behavior, runs it to confirm\
      \ RED, then edits, then runs\n      again to confirm GREEN.\n    - Implement: add to WORKER.md system\
      \ block a STANDING\n      DIRECTIVE section with this text verbatim. Toggleable via\n      feature.skip_repro_test:\
      \ true for AC-kind=structural.\n\n(C) Adaptive edit mode\n    - SWE-Edit: string-replace as default;\
      \ switch to whole-file\n      rewrite when edit-site count > 3 OR span > 40 lines.\n    - In src/bob3/dispatch.py\
      \ edit dispatch, compute\n      edit_site_count and edit_span from F-R7-600 localizer\n      output;\
      \ pick mode; record choice as\n      {\"event\":\"EDIT_MODE\",\"mode\":\"replace|rewrite\",\n  \
      \     \"sites\":N,\"span\":L}.\n\n(D) Mutation-pass check (don't trust own pass)\n    - ICSE 2026:\
      \ 12-22% of \"passing\" patches are logically wrong\n      — they pass because tests under-specify.\n\
      \    - After worker reports test-pass, flip one constant or\n      negate one boolean in the edited\
      \ region; re-run target\n      test. If test still passes, mark feature with\n      {\"event\":\"\
      WEAK_TEST_DETECTED\",\"feature_id\":...} and\n      require a stronger AC.\n    - Cost: 1 extra\
      \ test run per feature. Worth it.\n\nAll four wired through src/bob3/dispatch.py worker-spawn path.\n\
      All four toggleable via feature YAML (defaults ON).\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
