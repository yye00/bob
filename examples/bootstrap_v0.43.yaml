  F-R7-451:
    title: Sub-translation provenance — every AC traces to source-intent span
    description: 'Each emitted AC must carry a provenance field naming the

      contiguous character spans of the original human intent that

      produced it. CLI `bob spec trace <feature>:<ac>` prints the AC

      alongside its spans. Round-trip coverage of source intent must

      be >=90% of load-bearing tokens.

      '
    tier: Core
    acceptance_criteria:
    - 'File exists: src/bob3/spec_quality/provenance.py'
    - 'Function defined: bob3.spec_quality.provenance.attach_provenance'
    - 'Function defined: bob3.spec_quality.provenance.validate_coverage (returns True iff load-bearing
      token coverage >= 0.90)'
    - 'Function defined: bob3.spec_quality.provenance.trace_ac'
    - 'Function defined: bob3.spec_quality.provenance.reject_empty_provenance (raises EmptyProvenanceError
      when spans list is empty)'
    - 'Function defined: bob3.spec_quality.provenance.reject_non_overlapping (raises NonOverlappingProvenanceError
      when spans do not cover the AC text)'
    - 'Field exists on Feature model: provenance_spans'
    - 'pytest: tests/test_cli_spec_trace_command.py asserts running "bob spec trace F-R7-451:0" exits
      0 and stdout contains "span="'
    - 'pytest: tests/test_provenance_round_trip.py'
    - 'pytest: tests/test_provenance_rejects_empty.py asserts attach_provenance(ac, []) raises EmptyProvenanceError
      with message containing "empty" (error path on empty span list)'
    - 'pytest: tests/test_provenance_rejects_non_overlapping.py'
    - 'pytest: tests/test_provenance_coverage_threshold_boundary.py asserts validate_coverage returns
      True at exactly 0.90 minimum coverage boundary'
    - 'integration: bob3.cli.spec_trace'
  F-R7-452:
    title: Design-by-Contract sub-grammar on behavior — pre / post / inv / raises
    description: 'Extend the F-R7-412 EARS `behavior:` AC with four optional

      sub-keys: pre (precondition), post (postcondition), inv

      (invariant), raises (declared exception types). Codegen emits

      matching icontract decorators; verifier runs them during pytest.

      Pre violations charge the caller, post violations charge the

      implementer.

      '
    tier: Core
