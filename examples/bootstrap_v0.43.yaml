    - 'structural: src/bob3/run_loop.py contains the literal string ''_verification.py'' within 200 lines
      of the F-R7-596 marker'
    - 'structural: src/bob3/run_loop.py contains the literal string ''enhanced_verification'' within 200
      lines of the F-R7-596 marker'
