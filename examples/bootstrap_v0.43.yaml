  F-R7-599:
    title: BF-1 — Brownfield Survey/Index (tree-sitter symbol graph + SQLite + PageRank)
    description: "Brownfield prerequisite. Before bob3 can edit an existing repo, it\nneeds a queryable\
      \ map of what's already there. Build on the\nAider/Augment pattern: tree-sitter parse → symbol graph\n\
      (defs/refs/imports) → SQLite cache keyed by (path, sha) →\nPageRank-ranked node ordering for context-budget\
      \ triage.\n\nConcrete:\n  1. New module src/bob3/brownfield/survey.py\n  2. On `bob3 init --brownfield\
      \ <path>`:\n     - Walk repo (respect .gitignore + .bob3ignore)\n     - For each source file: parse\
      \ with tree-sitter (py/js/ts/go/rust)\n     - Extract definitions (class/func/method), references,\
      \ imports\n     - Persist to .bob3/survey.db with schema:\n         symbols(id, path, kind, name,\
      \ sha, lineno, parent_id)\n         edges(src_id, dst_id, kind)  -- kind in {ref, import, inherits}\n\
      \         file_hashes(path, sha, mtime, parsed_at)\n  3. Compute PageRank over edges, store in symbols.pagerank\n\
      \  4. Incremental update: on `bob3 survey --refresh`, re-parse only\n     files whose mtime/sha\
      \ changed (git status diff)\n  5. Implicit-feature scan: any module/class with a docstring\n   \
      \  starting \"TODO:\" or matching r'\\b(stub|placeholder|notimpl)\\b'\n     is emitted as a candidate\
      \ feature with provenance.\n\nWhy slot 031: BF-1 is the foundation for BF-4 (Localizer) and\nBF-5\
      \ (Resurrection); they read survey.db.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'File exists: src/bob3/brownfield/survey.py'
    - 'Function defined: bob3.brownfield.survey.build_survey'
    - 'Function defined: bob3.brownfield.survey.refresh_survey'
