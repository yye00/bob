      \nFix (F-R7-598, reconciler-before-sweep guard):\n  1. In src/bob3/run_loop.py at _final_exit_sweep,\
      \ BEFORE the\n     \"flipping orphan executing ... to failed\" branch:\n     a. For each orphan\
      \ executing feature, invoke disk_reconciler's\n        promote-if-ACs-satisfied check (the same\
