  F-R7-613:
    title: Sub-agent startup-crash exempt from retry budget — closes 5-gen chronic F-R7-597 NH
    description: "F-R7-597 + F-R7-607 hoist MCP-transient classifier above\ngit-hook-rejection demotion.\
      \ F-R7-612 promotes-on-disk\nwhen verification fails but ACs satisfy. Five consecutive\ngenerations\
      \ (v.35, v.37, v.38, v.39, v.40) STILL show\nthe same chronic NH on the same feature class: F-R7-597\n\
      ordering fix itself.\n\nRoot cause traced from v.38/v.39/v.40 logs (same UUID-class\nfeature, same\
      \ crash signature each time):\n\n- Test_writer emits 6-14 failing tests (normal).\n- Sub-agent spawns,\
      \ accumulates 4000-5000 work_events\n  over 15-20 minutes, MCP transport fails mid-task\n  (self-signed\
      \ cert chain on github plugin, evaluator\n  connection reset), sub-agent throws Exception with\n\
      \  exit code 1 BEFORE writing any persistent implementation\n  artifact to the workspace src/ tree.\n\
      - F-R6-300 mid_work_crash classifier sees work_events > 0\n  and DOES charge a retry — \"this is\
      \ NOT a free retry\"\n  per its own log message.\n- F-R7-612 disk_reconciler doesn't promote because\
      \ the\n  structural marker (literal 'F-R7-597' string in\n  src/bob3/run_loop.py) was never persisted.\n\
      - Feature exhausts 5/5 retries on the same crash mode,\n  flips to needs_human, blocks chain drain.\n\
      \nDistinction this fix introduces: separate the \"did the\nsub-agent perform reasoning work (4000+\
      \ events)\" signal\nfrom the \"did the sub-agent persist any code-fix artifact\nto disk\" signal.\
      \ Mid_work_crash with NO persistent\nartifact is fundamentally different from mid_work_crash\nWITH\
      \ a persistent artifact — the former produced nothing\nretry-able; the latter produced a partial\
      \ fix worth\niterating on.\n\nImplementation in src/bob3/run_loop.py, inside the\nmid_work_crash\
      \ branch (the one that calls F-R6-300's\ncharge_refinement_attempt):\n\n1. After classification\
      \ but BEFORE incrementing the retry\n   counter, compute persisted_artifact_count by globbing\n\
      \   workspace_dir/src/**/*.py modified after spawn_ts.\n2. If persisted_artifact_count == 0 AND\
      \ the exit_signature\n   matches transport-transient regex (compiled from\n   literals: \"Command\
      \ failed with exit code 1\",\n   \"MCP server.*Connection failed\",\n   \"self signed certificate\"\
      , \"ConnectionResetError\",\n   \"ReadTimeout\", \"broken pipe\"), branch to a new\n   SUBAGENT_STARTUP_CRASH\
      \ classification.\n3. SUBAGENT_STARTUP_CRASH path: reset feature.status to\n   'ready', do NOT increment\
      \ retry_counter, apply 60s\n   exponential backoff per attempt (60, 120, 240, 480, ...),\n   emit\
      \ telemetry event SUBAGENT_STARTUP_CRASH_EXEMPT with\n   feature_id, error_pattern matched, retry_counter_preserved,\n\
      \   persisted_artifact_count, exit_signature_excerpt.\n4. Lifetime cap: track exempt_count in feature.metadata.\n\
      \   After 10 lifetime exemptions, fall through to the\n   original retry-increment path. Emit\n\
      \   SUBAGENT_STARTUP_CRASH_EXEMPT_CAPPED at the cap.\n\nWorktree note: also check\nbob_root/.worktrees/hotfix-*/src/bob3/\
      \ for persisted\nartifacts since some sub-agents write to worktrees rather\nthan the primary src\
      \ tree.\n\nWhy permanent_forward_carry: F-R7-597 / F-R7-607 / F-R7-612\nhave each proved that fixing\
      \ the verification or\nclassification path alone doesn't stop this defect class.\nThe retry-budget\
      \ accounting itself is the remaining attack\nsurface — five generations of features die from upstream\n\
      transport crashes they didn't cause and were never given\na fair retry on.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'File exists: src/bob3/run_loop.py'
    - 'Function defined: bob3.run_loop.classify_subagent_startup_crash'
    - 'Function defined: bob3.run_loop.compute_persisted_artifact_count'
    - 'pytest: tests/test_run_loop.py::test_subagent_startup_crash_exempt_from_retry'
    - 'pytest: tests/test_run_loop.py::test_subagent_startup_crash_lifetime_cap_at_10'
    - 'integration: bob3.cli'
  F-R7-614:
    title: Re-assert sub-agent startup-crash retry-exempt (escapes own-id demotion that hollowed F-R7-613)
    description: "F-R7-613 (sidecar_040) shipped 21 ACs but was hollow-completed:\nevery structural AC\
      \ contained the literal token \"F-R7-613\" as a\n\"within 500 lines of the F-R7-613 marker\" phrasing.\
      \ The\ncross-feature-reference fallback (F-R7-589 hot-fix) saw the\n\"F-R7-NNN\" token and demoted\
      \ EVERY structural AC to PASS as a\nforeign cross-reference, even though F-R7-613 IS the feature's\n\
      own ID. Bob3 version 41 chain: 95C/1NH/7P — same shape as\nv.38/v.39/v.40 — F-R7-597 still hit 5/5\
      \ mid_work_crash retries\nvia F-R6-300's unchanged path, F-R7-613 implementation never\nwent live\
      \ in run_loop.py.\n\nTwo-pronged fix:\n\nA. Structural verification of startup-crash exempt implementation,\n\
      \   restated WITHOUT any F-RX-YYY token in the AC body. Anchors\n   on bare function/class names\
      \ and file paths only.\n\nB. New classifier file src/bob3/startup_crash_exempt.py (separate\n  \
      \ from crash_classifier.py to avoid coupling with F-R7-613's\n   not-yet-implemented file). Houses\
      \ the artifact-count check,\n   transport-transient regex, exempt counter, exponential backoff.\n\
      \nC. Hook in run_loop.py: BEFORE F-R6-300's charge_refinement_attempt\n   in the mid_work_crash\
      \ branch, call\n   startup_crash_exempt.try_exempt(feature, exit_signature,\n   spawn_ts, workspace_dir).\
      \ On True return, reset to ready\n   without retry charge; on False, fall through to F-R6-300.\n\
      \nImplementation hard requirements (escape own-id demotion):\n\n- All structural ACs reference identifiers\
      \ like\n  try_exempt, persisted_artifact_count, exempt_counter,\n  startup_crash_exempt — NEVER\
      \ include F-RX-YYY tokens.\n- Behavior ACs phrase as \"<subject> <verb> <object> when <cond>\"\n\
      \  per EARS parser requirement seen in v.41 log\n  \"Behavior AC could not be fully parsed\".\n\
      - Integration ACs name pytest test functions in\n  tests/test_startup_crash_exempt.py.\n\nAlso fix\
      \ the upstream cross-reference fallback to never demote\na structural AC whose F-RX-YYY token equals\
      \ the owning feature's\nown ID. Implemented in src/bob3/enhanced_verification.py.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'File exists: src/bob3/startup_crash_exempt.py'
    - 'Function defined: bob3.startup_crash_exempt.try_exempt'
    - 'Function defined: bob3.startup_crash_exempt.persisted_artifact_count'
    - 'pytest: tests/test_startup_crash_exempt.py'
    - 'integration: bob3.run_loop'
    - 'File exists: src/bob3/enhanced_verification.py'
  F-R7-615:
    title: Spec synthesizer score-gate loop — re-synthesize TBD ACs until _score_feature >= threshold
    description: "Current F-R1-011 synthesizer (src/bob3/spec_synthesizer.py)\nfills TBD/TODO/FIXME/XXX\
      \ placeholder acceptance_criteria via a\nHaiku sub-agent and emits whatever the model returns, with\
      \ a\ndeterministic fallback. There is no gate-loop: synthesized ACs\ncan still score below BOB3_SPEC_QUALITY_THRESHOLD\
      \ (default 0.85)\nand immediately re-block at plan --create time. Today's bob3\nversion 42 stall\
      \ has 8 features blocked this way (BF-1, BF-3,\nBF-4, BF-5, BF-6, BF-7, F-R7-613, F-R7-614) — the\
      \ second tier\nsub-agent gate (F-R7-583) cannot rescue them because the\nsynthesizer never re-tries\
      \ with feedback.\n\nAdd a score-gate loop around sanitize_spec_file:\n\n1. After synthesize_for_feature\
      \ returns AC list, call\n   _score_feature(feature_with_synth_acs) from\n   enhanced_verification.\n\
      2. If score >= BOB3_SPEC_QUALITY_THRESHOLD (read env or\n   hardcoded 0.85), accept.\n3. If score\
      \ < threshold, retry synthesize_for_feature with an\n   additional prompt segment listing exactly\
      \ which scoring\n   sub-dimensions came up short (structural_marker_count,\n   ears_behavior_count,\
      \ integration_target_resolvability,\n   own_id_token_absent, integration_target_kind_diversity).\n\
      \   Up to 3 retries.\n4. On 4th miss, fall through to deterministic_fallback (already\n   exists)\
      \ AND emit telemetry event\n   SPEC_SYNTH_SCORE_GATE_EXHAUSTED with feature_id, attempts,\n   final_score,\
      \ missing_dimensions.\n5. Aggregate report in sanitize_spec_file return dict gains\n   fields: gate_passed,\
      \ gate_failed, gate_avg_attempts.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'File exists: src/bob3/spec_synthesizer.py'
    - 'Function defined: bob3.spec_synthesizer.sanitize_spec_file'
    - 'Function defined: bob3.spec_synthesizer._score_gate_loop'
    - 'pytest: tests/test_spec_synthesizer.py'
    - 'integration: bob3.enhanced_verification'
  F-R7-616:
    title: bob3 explain-gate-block CLI — surface why a feature failed spec_quality_gate
    description: "Operator-visibility fix. When the spec_quality_gate blocks a\nfeature with \"score=0.2083\
      \ from reaching 'ready'\", the operator\ncurrently has no way to know which scoring sub-dimension\
      \ failed\nor what the cheapest AC additions would be to clear threshold.\nThey must reverse-engineer\
      \ _score_feature in\nenhanced_verification.py.\n\nAdd a CLI subcommand:\n  bob3 explain-gate-block\
      \ <feature_id_prefix>\n\nIt loads the feature row from bob3.db, re-runs _score_feature on\nits current\
      \ ACs, and prints:\n\n  Feature: <id> (<title>)\n  Score: 0.2083 (threshold 0.85)\n  Sub-dimension\
      \ breakdown:\n    structural_marker_count:     2  (need >= 8)\n    ears_behavior_count:        \
      \ 0  (need >= 4)\n    integration_target_kinds:    1  (need >= 3 distinct kinds)\n    own_id_token_absent:\
      \         FAIL (AC body contains F-R7-NNN matching own id; cross-ref demotion will hollow these)\n\
      \  Cheapest fixes to clear threshold:\n    + Add 6 structural ACs of form 'Function defined: <module.symbol>'\n\
      \    + Add 4 EARS-form behavior ACs '<subj> <verb> <obj> when <cond>'\n    + Add 2 integration ACs\
      \ naming pytest test functions\n    - Remove own-id token from existing structural ACs\n\nEmits\
      \ same JSON via --json flag for programmatic consumption.\n"
    priority: high
    permanent_forward_carry: true
    acceptance_criteria:
    - 'CLI command: bob3 explain-gate-block'
    - 'Function defined: bob3.enhanced_verification.explain_gate_block'
    - 'File exists: src/bob3/enhanced_verification.py'
    - 'pytest: tests/test_explain_gate_block.py'
    - 'integration: bob3.cli'
  F-R7-617:
    title: PEAS pipeline — bob3 extract-from-peas prose-only spec to features.yaml via synthesizer + score-gate
    description: "The Plain English Application Spec (PEAS) workflow. Today the\noperator writes YAML\
      \ feature blocks by hand and the synthesizer\nonly fills ACs when present as TBD placeholders. The\
      \ synthesizer\nnever sees prose-only input; the operator must already know\nevery feature key, title,\
      \ tier, priority, and description before\nbob3 helps.\n\nAdd a CLI subcommand:\n  bob3 extract-from-peas\
      \ <peas.md> [--out features.yaml]\n\nWhere peas.md is a markdown file structured as:\n\n  ## <feature\
      \ title>\n  Tier: Core  |  Priority: high  |  Slot: F-R7-NNN\n  <one-paragraph plain-English description\
      \ of what it does, why,\n   where the code lives.>\n\n  ## <next feature title>\n  ...\n\nPipeline:\n\
      \  1. Parse markdown into per-feature blocks.\n  2. For each block, emit a stub YAML feature with\
      \ key F-R7-NNN\n     (from header or auto-mint by walking existing bootstrap),\n     title, tier,\
      \ priority, description verbatim, and ACs as\n     ['TBD: synthesize via F-R1-011'].\n  3. Run the\
      \ F-R7-615 score-gate-loop synthesizer on the stub\n     features list to fill ACs scoring >= threshold.\n\
      \  4. Concatenate into one YAML and either print to stdout or\n     write to --out path.\n  5. Print\
      \ summary: extracted=N, synthesized=N, gate_passed=N,\n     gate_failed=N (each per-feature score\
      \ listed).\n\nRound-trip guarantee: emit YAML must pass `bob3 plan --create`\nwithout further sanitize\
      \ step.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'CLI command: bob3 extract-from-peas'
    - 'File exists: src/bob3/extract_from_peas.py'
    - 'Function defined: bob3.extract_from_peas.parse_peas_markdown'
    - 'Function defined: bob3.extract_from_peas.emit_stub_features'
    - 'pytest: tests/test_extract_from_peas.py'
    - 'integration: bob3.cli'
