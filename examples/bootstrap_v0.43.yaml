  F-R7-607:
    title: F-R7-597 ordering fix — classify MCP transient BEFORE git-hook-rejection demotion
    description: "bob3 v.33 round 1: F-R7-598 disk_reconciler-before-flip feature\n(6176b430) itself surfaced\
      \ an F-R7-597 gap. The evaluator subagent\ncrashed with the same self-signed-cert MCP error sidecar_029\
      \ was\ndesigned to neutralize. Stderr CONTAINED:\n  \"self signed certificate in certificate chain\"\
      \n  \"MCP server\" + \"Connection failed\"\n  \"Streamable HTTP error\"\n  \"Server rejected the\
      \ configured Authorization header\"\n…i.e., F-R7-597's full token set. But the classifier did NOT\
      \ fire.\nInstead the feature went through:\n  verdict=INSUFFICIENT_EVIDENCE → \"blocked by git hook\
      \ rejection\n  ; needs human review\" → (rescued only because F-R7-598\n  disk_reconciler promotion\
      \ ran in the same tick).\n\nRoot cause hypothesis: F-R7-597 was wired to reset feature→ready\nONLY\
      \ when status transition target == 'failed'. The git-hook-\nrejection path demotes to 'needs_human'\
      \ via a different code\npath (run_loop \"blocked by git hook rejection\" branch), which\nF-R7-597\
      \ doesn't intercept.\n\nFix (F-R7-607, classifier-precedence hoist):\n  1. In src/bob3/run_loop.py,\
      \ locate the\n     \"blocked by git hook rejection; needs human review\"\n     emit site (the same\
      \ line that fired for 6176b430 at 12:49:57).\n  2. BEFORE that emit, run the F-R7-597 MCP-transient\
      \ classifier\n     against captured_stderr_head / captured_stderr_log.\n  3. If any of the F-R7-597\
      \ token set matches:\n       - 'self signed certificate in certificate chain'\n       - 'self-signed\
      \ certificate'\n       - 'MCP server' + 'Connection failed'\n       - 'HTTP Connection failed'\n\
      \       - 'Streamable HTTP error'\n       - 'Server rejected the configured Authorization header'\n\
      \       - '403 Forbidden' (only when paired with 'MCP server')\n     …then reset feature to 'ready',\
      \ emit\n       {\"event\":\"EVALUATOR_MCP_TRANSIENT_PRE_HOOK\",\"feature_id\":...,\n        \"matched_token\"\
      :...}\n     and SKIP the git-hook-rejection emit.\n  4. Subject to the same 5-retry cap as F-R7-597.\n\
      \  5. Telemetry: emit count\n       {\"event\":\"PRE_HOOK_TRANSIENT_SUMMARY\",\"intercepted\":N}\n\
      \     on drain.\n\nSafety: ONLY reroutes when the explicit MCP-transient token set\nmatches; any\
      \ other evaluator-rejection path is untouched.\n\nWhy permanent_forward_carry: this is a precedence/ordering\
      \ fix\nto an already-permanent feature (F-R7-597). Without it, the\nnext gen will keep relying on\
      \ F-R7-598 as the sole net.\n"
    priority: high
    permanent_forward_carry: true
    extended_thinking: true
    acceptance_criteria:
    - 'structural: src/bob3/run_loop.py contains the literal string ''F-R7-607'''
