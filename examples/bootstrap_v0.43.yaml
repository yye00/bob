  F-R7-597:
    title: Evaluator-MCP transient cert/conn crashes — classify as retryable, not feature-failure
    description: "bob3 v.31 round 1: same persistent feature \"AC artifact-existence\nverifier — refuse\
      \ to pass AC when referenced files are missing\"\n(32110500-class, formerly a1200707/d34c40f0) failed\
      \ AGAIN at v.31\ndrain. Root cause this round was NOT the verifier-self-reference\ntreadmill (F-R7-595/596\
      \ deferral did fire) — it was an EVALUATOR\nsub-agent crash with captured_stderr_head:\n  \"Error:\
      \ self signed certificate in certificate chain\n   MCP server 'plugin:github:github': Connection\
      \ failed ... self\n   signed certificate in certificate chain\"\nThe evaluator subagent (independent\
      \ commit-gate evaluator) exited\nwith is_error=True before producing a verdict, and the orchestrator\n\
      mapped verdict=INSUFFICIENT_EVIDENCE → commit blocked → feature\nflipped to failed at drain.\n\n\
      The MCP cert failure is upstream infrastructure noise (Claude-CLI\nMCP startup), exactly the same\
      \ shape as the transient-API-400 /\nrate-limit class users have flagged as \"retry silently, don't\n\
      triage\" ([[feedback-rate-limits-external]], [[feedback-retry-400]]).\nIt should NOT count as feature-rejection.\n\
      \nFix (F-R7-597, retry-classifier extension):\n  1. In the evaluator-result handler in src/bob3/run_loop.py\
      \ (or\n     wherever evaluator verdicts are consumed), inspect the\n     captured_stderr_head /\
      \ captured_stderr_log if verdict is\n     INSUFFICIENT_EVIDENCE AND confidence==0.0 AND is_error=True.\n\
      \  2. If the stderr contains ANY of these substrings, classify the\n     failure as MCP_TRANSIENT\
      \ and reset the feature to 'ready'\n     (NOT failed, NOT needs_human):\n       - 'self signed certificate\
      \ in certificate chain'\n       - 'self-signed certificate'\n       - 'MCP server' + 'Connection\
      \ failed'\n       - 'HTTP Connection failed'\n       - 'Streamable HTTP error'\n       - 'Server\
      \ rejected the configured Authorization header'\n       - '403 Forbidden' (only when paired with\
      \ 'MCP server')\n  3. Emit a structured log event:\n       {\"event\":\"EVALUATOR_MCP_TRANSIENT\"\
      , \"feature_id\": ..., \"matched_token\": \"...\"}\n  4. Cap re-readies at 5 per feature per round\
      \ to avoid infinite\n     loops; if exceeded, demote to needs_human with reason\n     'evaluator_mcp_persistent'\
      \ (so user can intervene).\n  5. Counts toward retries, not toward the 5/5 NH budget.\n\nSafety:\
      \ classifier ONLY downgrades failed→ready on the explicit\nMCP-transient token set; any other evaluator\
      \ failure (real test\nregression, real rubric rejection) is untouched.\n"
    priority: high
    permanent_forward_carry: true
    acceptance_criteria:
    - 'structural: src/bob3/run_loop.py contains the literal string ''F-R7-597'''
    - 'structural: src/bob3/run_loop.py contains the literal string ''EVALUATOR_MCP_TRANSIENT'' within
      200 lines of the F-R7-597 marker'
    - 'structural: src/bob3/run_loop.py contains the literal string ''self signed certificate'' within
      200 lines of the F-R7-597 marker'
    - 'structural: src/bob3/run_loop.py contains the literal string ''evaluator_mcp_persistent'' within
      200 lines of the F-R7-597 marker'
    - 'file_exists: src/bob3/run_loop.py'
    - 'integration: tests/test_evaluator_mcp_transient_classifier.sh'
  F-R7-598:
    title: _final_exit_sweep — check disk_reconciler BEFORE flipping orphan-executing to failed
    description: "bob3 v.32 round 1: same persistent feature 536768ff\n\"AC artifact-existence verifier\
      \ — refuse to pass AC when\nreferenced files are missing\" failed AGAIN, this round via:\n  [INFO]\
