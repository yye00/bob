name: bob5
version: "0.4.0"
description: |
  Bob5 — Round 2 of the recursive bob-on-bob dark factory.

  Bob5 = bob4 (Round-1 complete) + the following:
    Block tier (F-101..F-141 subset): ablation mode, telemetry, sandboxes,
      calibration, registry features — the full 21-feature Block list from
      the flagship feature backlog MINUS F-153/F-154/F-155/F-156 (paper
      artifacts deferred to Round 5).
    F-145 (async parallel sub-agents) pulled forward from Stretch tier
      because it is the critical-path bottleneck for the 700-run sweep.
    Gap #6 (plan-review): independent agent reviews each plan before
      sub-agent spawn, catching spec-misreads early.
    Gap #7 (build-twice): build every feature twice with different seeds,
      compare outputs for nondeterminism.

  Out of scope this round:
    Strong tier (F-107..F-157 subset)  — Round 3
    Remaining Stretch tier              — Round 4
    Paper artifacts (F-153..F-156)     — Round 5

  Namespace: F-R2-101..F-R2-157 for backlog features,
             F-R2-145 for pulled-forward async,
             F-R2-G06, F-R2-G07 for internal gaps.

# bob4 (orchestrator) lives at /home/yelkhamr/dark-factory/bob4/
# bob5 (target) is seeded as a clone before `bob4 run` starts.
workspace: /home/yelkhamr/dark-factory/bob5

features:

  # ──────────────────────────────────────────────────────────────────────────
  # Block tier — ablation framework core
  # ──────────────────────────────────────────────────────────────────────────

  F-R2-101:
    title: "BOB3_ABLATION_MODE environment variable and CLI flag"
    description: |
      Add src/bob3/ablation.py with AblationMode enum (V-1, V0, V1, V2, V3).
      Wire BOB3_ABLATION_MODE env var and --ablation-mode CLI flag into the
      orchestrator startup sequence. Each mode freezes a specific subset of
      the config (e.g., V-1 disables all AI assistance; V0 is baseline;
      V1..V3 progressively enable features). Record the active mode in every
      telemetry line.
    priority: 1
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/ablation.py"
      - "Function defined: bob3.ablation.get_ablation_mode"
      - "pytest: tests/test_ablation_mode.py"
      - "python: from bob3.ablation import AblationMode; assert hasattr(AblationMode, 'V0')"
    files_likely_touched:
      - src/bob3/ablation.py
      - src/bob3/cli.py
      - src/bob3/orchestrator/run_loop.py
      - tests/test_ablation_mode.py

  F-R2-102:
    title: "Uniform predicted-confidence elicitor"
    description: |
      After each sub-agent spawn completes, run a lightweight post-spawn LLM
      probe (haiku, 1 turn) asking the sub-agent to estimate its own
      confidence on a 0-1 scale. The probe must be identical across all
      ablation variants to ensure fair Expected Calibration Error (ECE)
      computation. Store result in bob3.db calibration_data table. Emit a
      cost_checkpoint event for each probe.
    priority: 2
    depends_on: ['F-R2-101']
    acceptance_criteria:
      - "File exists: src/bob3/confidence_elicitor.py"
      - "Function defined: bob3.confidence_elicitor.elicit_confidence"
      - "pytest: tests/test_confidence_elicitor.py"
    files_likely_touched:
      - src/bob3/confidence_elicitor.py
      - src/bob3/orchestrator/run_loop.py
      - tests/test_confidence_elicitor.py

  F-R2-103:
    title: "Spec perturbation generator"
    description: |
      Add src/bob3/spec_perturbation.py with deterministic, seedable
      transforms: rename (substitute identifier names), reorder (shuffle
      acceptance criteria order), red_herring (add an extra irrelevant
      criterion). Each transform must be round-trip invertible (original
      recoverable from perturbed + seed). Used by the sweep orchestrator
      to generate variant specs for ablation runs.
    priority: 2
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/spec_perturbation.py"
      - "Function defined: bob3.spec_perturbation.perturb_spec"
      - "Function defined: bob3.spec_perturbation.invert_perturbation"
      - "pytest: tests/test_spec_perturbation.py"
    files_likely_touched:
      - src/bob3/spec_perturbation.py
      - tests/test_spec_perturbation.py

  F-R2-104:
    title: "Reward-hacking detector (LLM judge)"
    description: |
      Add src/bob3/reward_hacking_detector.py with detect_reward_hacking(
      feature_id: str, diff: str, test_output: str) -> HackingVerdict.
      Run a post-implementation LLM judge evaluating five attack vectors:
      test hardcoding, delegation to library, spec gaming, metric overfitting,
      and implementation elision. Target: ≥85% precision, ≥80% recall on
      the hand-labeled corpus (F-155 fixture). Record verdict in bob3.db.
    priority: 3
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/reward_hacking_detector.py"
      - "Function defined: bob3.reward_hacking_detector.detect_reward_hacking"
      - "pytest: tests/test_reward_hacking_detector.py"
    files_likely_touched:
      - src/bob3/reward_hacking_detector.py
      - tests/test_reward_hacking_detector.py

  F-R2-105:
    title: "Unified telemetry exporter — run.jsonl"
    description: |
      Add src/bob3/telemetry.py with emit_telemetry_line(run_id: str, **fields)
      writing one fixed-schema JSON object per line to <workspace>/.bob3/run.jsonl.
      Schema fields: run_id, variant (ablation mode), spec_id, spec_version,
      seed, feature_id, attempt_number, completion_status, cost_usd,
      tokens_in, tokens_out, duration_ms, hack_verdict, confidence_predicted,
      timestamp_utc. Every orchestrator code path that completes a feature
      attempt must call emit_telemetry_line. This supersedes claude-progress.txt
      for machine-readable consumption.
    priority: 1
    depends_on: ['F-R2-101']
    acceptance_criteria:
      - "File exists: src/bob3/telemetry.py"
      - "Function defined: bob3.telemetry.emit_telemetry_line"
      - "pytest: tests/test_telemetry_exporter.py"
    files_likely_touched:
      - src/bob3/telemetry.py
      - src/bob3/orchestrator/run_loop.py
      - tests/test_telemetry_exporter.py

  F-R2-106:
    title: "Sweep orchestrator with cost-budget guard rails"
    description: |
      Add src/bob3/sweep_orchestrator.py with run_sweep(plan: SweepPlan) ->
      SweepResult. The sweep orchestrator dispatches multiple ablation runs
      in parallel (asyncio, up to BOB3_SWEEP_PARALLELISM workers), enforces
      a total cost budget (BOB3_SWEEP_BUDGET_USD), and writes resumable
      checkpoints to .bob3/sweep_checkpoint.json so an interrupted sweep
      can restart from the last completed run. Plan input is a YAML file
      listing variant × spec × seed combinations.
    priority: 3
    depends_on: ['F-R2-101', 'F-R2-105']
    acceptance_criteria:
      - "File exists: src/bob3/sweep_orchestrator.py"
      - "Function defined: bob3.sweep_orchestrator.run_sweep"
      - "pytest: tests/test_sweep_orchestrator.py"
    files_likely_touched:
      - src/bob3/sweep_orchestrator.py
      - tests/test_sweep_orchestrator.py

  F-R2-108:
    title: "Hermetic per-run containerisation"
    description: |
      Add src/bob3/container_runner.py with run_in_container(cmd: list[str],
      image: str, workspace: Path) -> ContainerResult. Each sweep run
      executes in a fresh Docker container using a pinned base image
      (recorded in telemetry). Container gets an isolated /workspace mount,
      no network access after image pull, no shared state between runs.
      Gracefully degrades to direct execution when Docker is unavailable
      (logged as a warning, not an error).
    priority: 4
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/container_runner.py"
      - "Function defined: bob3.container_runner.run_in_container"
      - "pytest: tests/test_container_runner.py"
    files_likely_touched:
      - src/bob3/container_runner.py
      - tests/test_container_runner.py

  F-R2-109:
    title: "Model and SDK version pinning"
    description: |
      Record the exact Anthropic SDK version and model ID in every telemetry
      line. Add src/bob3/version_probe.py with get_sdk_version() -> str and
      get_model_id() -> str. Wire into emit_telemetry_line. Add a pre-flight
      check that warns if the SDK version differs from the pinned version in
      pyproject.toml (but does not block — experiments run on the installed
      version, discrepancies are noted in telemetry).
    priority: 2
    depends_on: ['F-R2-105']
    acceptance_criteria:
      - "File exists: src/bob3/version_probe.py"
      - "Function defined: bob3.version_probe.get_sdk_version"
      - "Function defined: bob3.version_probe.get_model_id"
      - "pytest: tests/test_version_probe.py"
    files_likely_touched:
      - src/bob3/version_probe.py
      - src/bob3/telemetry.py
      - tests/test_version_probe.py

  F-R2-123:
    title: "GPU sandbox — Docker with CUDA/MPS, pinned drivers"
    description: |
      Extend container_runner.py with a gpu_sandbox profile that uses a
