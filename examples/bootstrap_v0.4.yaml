  # ──────────────────────────────────────────────────────────────────────────
  # Pulled-forward Stretch feature: async parallel sub-agents
  # ──────────────────────────────────────────────────────────────────────────

  F-R2-145:
    title: "Async parallel sub-agent execution (pull-forward from Stretch)"
    description: |
      Refactor the OrchestrationLoop to parallelize features with no
      outstanding dependencies (DAG-respecting). Use asyncio.gather with
      a semaphore capped at BOB3_PARALLELISM (default 4). This is the
      critical-path bottleneck for 700-run sweeps: serial execution of
      20 features × ~8 min each = 160 min; parallel at 4 = ~40 min.
      Preserves all existing safety invariants: each sub-agent still runs
      in its own subprocess, writes to an isolated workspace snapshot,
      and commits atomically.
    priority: 1
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/orchestrator/parallel_loop.py"
      - "Function defined: bob3.orchestrator.parallel_loop.run_parallel_loop"
      - "pytest: tests/test_parallel_loop.py"
    files_likely_touched:
      - src/bob3/orchestrator/parallel_loop.py
      - src/bob3/orchestrator/run_loop.py
      - src/bob3/cli.py
      - tests/test_parallel_loop.py

  # ──────────────────────────────────────────────────────────────────────────
  # Internal Gap #6 — Plan review before sub-agent spawn
  # ──────────────────────────────────────────────────────────────────────────

  F-R2-G06:
    title: "Gap #6: Independent plan-review agent before sub-agent spawn"
    description: |
      Add src/bob3/plan_reviewer.py with review_plan(plan: str, feature: dict)
      -> PlanReview. After the planning phase generates a plan but before the
      implementation sub-agent is spawned, a separate haiku-grade agent
      reviews the plan against the spec. It checks for: spec misreads,
      missing acceptance criteria coverage, over-ambitious scope (>200 LOC
      estimate), and risky patterns (direct file deletion, unconditional
      rewrites of existing code). If any blocker is found, the plan is
      returned to the planning agent for revision (max 2 revision cycles).
      PlanReview includes: verdict (approve/revise/block), findings list,
      confidence score.
    priority: 2
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/plan_reviewer.py"
      - "Function defined: bob3.plan_reviewer.review_plan"
      - "pytest: tests/test_plan_reviewer.py"
    files_likely_touched:
      - src/bob3/plan_reviewer.py
      - src/bob3/orchestrator/run_loop.py
      - tests/test_plan_reviewer.py

  # ──────────────────────────────────────────────────────────────────────────
  # Internal Gap #7 — Build-twice nondeterminism detector
  # ──────────────────────────────────────────────────────────────────────────

  F-R2-G07:
    title: "Gap #7: Build-twice nondeterminism detector"
    description: |
      Add src/bob3/build_twice.py with compare_builds(feature_id: str,
      workspace: Path) -> NondeterminismReport. After a feature passes
      verification, re-run the implementation sub-agent from the same spec
      with a different seed (seed+1). Compare the two implementations:
      AST-normalize both, compute token-level diff, flag if >30% divergence
      (indicating the feature is under-specified or the implementation is
      highly stochastic). Log nondeterminism events to .bob3/progress.jsonl
      and reviews/findings.yaml. Controlled by BOB3_BUILD_TWICE (default
      False — opt-in to avoid 2x cost by default; enabled automatically
      during sweep runs).
    priority: 3
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/build_twice.py"
      - "Function defined: bob3.build_twice.compare_builds"
      - "pytest: tests/test_build_twice.py"
    files_likely_touched:
      - src/bob3/build_twice.py
      - src/bob3/orchestrator/run_loop.py
      - tests/test_build_twice.py
