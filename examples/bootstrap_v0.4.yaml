    priority: 4
    depends_on: []
    acceptance_criteria:
      - "File exists: src/bob3/spawn_watchdog.py"
      - "Function defined: bob3.spawn_watchdog.SpawnWatchdog"
      - "pytest: tests/test_spawn_watchdog.py"
