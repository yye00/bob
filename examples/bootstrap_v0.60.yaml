- key: F-R7-608
  title: Claude-Code worker leverage — enable prompt cache, slim per-worker context, re-declare settings
  tier: Core
  priority: high
  description: "Research synthesis from 4 brownfield agents identifies three\nhigh-ROI Claude-Code platform\
    \ fixes bob3 must apply to every\nspawned worker, before the BF-* features even matter for cost.\n\
    \n(A) Enable prompt caching on every spawned worker\n    - Issue #29966: Agent SDK sub-agents hardcode\n\
    \      enablePromptCaching=false, causing ~378K wasted tokens\n      per session from ~7K system prompts\
    \ re-billed every call.\n    - bob3 dispatches ~8 workers concurrently per feature → this\n      is\
    \ the single largest cost leak in the pipeline.\n    - Fix: in src/bob3/dispatch.py worker spawn,\
    \ explicitly set\n      enable_prompt_caching=True on every Anthropic API call\n      and every claude\
    \ -p invocation. Add structured event\n      {\"event\":\"WORKER_CACHE_HIT\",\"cache_read\":N,\"cache_write\"\
    :M}\n      per worker exit for cost telemetry.\n\n(B) Slim worker context — split CLAUDE.md\n    -\
    \ CLAUDE.md is reloaded into every sub-agent's fresh context.\n    - bob3's CLAUDE.md (loop-operator\
    \ memory ~70 bullets) is not\n      relevant to a feature-implementing worker.\n    - Fix: rename\
    \ loop-operator CLAUDE.md → CLAUDE_OPERATOR.md\n      (loaded by orchestrator only). Generate per-worker\n\
    \      WORKER.md at dispatch time containing ONLY:\n        - feature title + description\n      \
    \  - the resolved AC list (post-extraction)\n        - the localization shortlist (BF-4 output)\n\
    \        - the workspace path\n      Workers get WORKER.md loaded, NOT CLAUDE_OPERATOR.md.\n    -\
    \ Save ~6K tokens × 8 workers × 88 features ≈ 4.2M tokens/round.\n\n(C) Re-declare settings per worker\n\
    \    - Issue #27661: sub-agents do NOT inherit hooks/permissions\n      from parent .claude/settings.json.\n\
    \    - bob3 currently assumes workers inherit\n      permissions.allow; permission prompts fire silently\
    \ inside\n      workers and they appear stalled.\n    - Fix: write per-feature .bob3/features/<id>/settings.json\n\
    \      at dispatch time, pass via `claude -p --settings <path>`.\n      Settings include the union\
    \ of (project default +\n      feature-specific tool allowlist from localization).\n    - Telemetry:\
    \ {\"event\":\"WORKER_PERM_PROMPT\",\"feature_id\":...,\n      \"tool\":...} if a permission prompt\
    \ is detected.\n\nWhy permanent_forward_carry: this is bob3-platform plumbing —\nevery future generation\
    \ pays this cost without the fix."
