name: bob60
features:
- key: F-R7-400
  title: Convergence detector compares features by spec_slot, not UUID
  tier: Core
  priority: medium
  description: 'The current weekend_watchdog.sh:check_convergence shell function

    compares feature sets across generations by features.id. Feature

    IDs are minted as fresh UUIDs in every `bob3 init`, so the

    cross-generation set diff is always 100%.


    Add a stable `spec_slot` column to the features table populated

    from the spec key. Rewrite check_convergence to set-diff by

    spec_slot. Backfill spec_slot for existing rows by parsing the

    spec yaml and matching by name.'
  acceptance_criteria:
  - 'File exists: src/bob3/migrations/add_spec_slot.py'
  - 'Function defined: bob3.features.backfill_spec_slot'
  - 'Function defined: bob3.weekend_watchdog.check_convergence'
  - 'pytest: tests/test_convergence_detector.py'
  - 'integration: bob3.weekend_watchdog'
- key: F-R7-401
  title: Disk-state reconciler — promote built-on-disk features without re-spawn
  tier: Core
  priority: medium
  description: 'Every generation re-runs every ready feature even when its

    acceptance-criteria artifacts already exist on disk from the

    parent generation. Add `reconcile_from_disk(project_id)` that

    evaluates each AC entry against the workspace and atomically

    promotes features whose artifacts pass in isolation.'
  acceptance_criteria:
  - 'Function defined: disk_reconciler.reconcile_from_disk'
  - 'pytest: tests/test_disk_reconciler.py'
  - 'integration: feature_runner'
  - 'File exists: src/disk_reconciler.py'
- key: F-R7-410
  title: Spec ambiguity linter — reject vague acceptance criteria
  tier: Core
  priority: medium
  description: 'Pre-plan gate that scans every acceptance_criteria entry and

    rejects ambiguous patterns. Each AC must match one of the

    structured forms; the linter fails the plan if any feature has

    an ambiguous AC and emits a structured report.'
  acceptance_criteria:
  - 'File exists: src/spec_linter.py'
  - 'Function defined: spec_linter.lint_acceptance_criteria'
  - 'pytest: tests/test_spec_linter.py'
  - 'CLI command: lint-specs'
  - 'integration: plan'
- key: F-R7-411
  title: Integration-target reachability check at spec-load time
  tier: Core
  priority: medium
  description: 'Every `integration: <dotted.module>` AC implies the generated

    code will be wired into that module. At plan time, verify the

    target module either exists in the workspace or is itself a

    feature in the spec being planned. Reject unreachable targets.'
  acceptance_criteria:
  - 'File exists: src/bob60/integration_validator.py'
  - 'Function defined: bob60.integration_validator.validate_integration_targets'
  - 'pytest: tests/test_integration_validator.py'
  - 'integration: bob60.spec_loader'
- key: F-R7-412
  title: Structured EARS-style behavior acceptance criteria
  tier: Core
  priority: medium
  description: 'Add a sixth AC grammar `behavior: <subject> <verb> <object> when

    <condition>`. Parse into structured tuple at load time. Evaluator

    gets a new check that uses the parsed structure rather than

    freeform prose.'
  acceptance_criteria:
  - 'File exists: src/ears_criteria.py'
  - 'Function defined: ears_criteria.parse_behavior'
  - 'Function defined: ears_criteria.BehaviorCriterion'
  - 'pytest: tests/test_ears_criteria.py'
  - 'integration: evaluator'
- key: F-R7-413
  title: Spec quality score gate — features below threshold cannot reach ready
  tier: Core
  priority: medium
  description: 'Combine F-R7-410 / F-R7-411 / F-R7-412 plus an AC-coverage

    metric into a per-feature spec_quality_score in [0,1]. Features

    with score < 0.85 stay pending with a structured remediation

    report.'
  acceptance_criteria:
  - 'File exists: src/spec_quality/score.py'
  - 'Function defined: spec_quality.score.compute_quality_score'
  - 'Function defined: spec_quality.score.generate_remediation_report'
  - 'pytest: tests/test_spec_quality_score.py'
  - 'integration: spec_quality.gate'
- key: F-R7-420
  title: Sticky-completed gate — re-evaluation cannot un-complete persisted work
  tier: Core
  priority: medium
  description: 'If a feature was status=''completed'' in the parent generation''s

    DB AND its acceptance criteria still verify on disk, no

    evaluator FAIL or regression-cascade vote may flip its status

    below ''ready''. Reset the stamp only when a refinement attempt

    actually rewrites one of the AC-named source files.'
  acceptance_criteria:
  - 'File exists: src/gate/sticky_completed.py'
  - 'Function defined: gate.sticky_completed.preserve_completed_status'
  - 'pytest: tests/test_sticky_completed_gate.py'
  - 'integration: gate.evaluator'
- key: F-R7-421
  title: Blame-the-cause regression cascade — charge the breaking feature
  tier: Core
  priority: medium
  description: 'For each failing test, walk the AC table to find the feature

    whose `pytest:` AC owns that test path. Charge a refinement

    attempt to that feature only. Features that merely ran during

    the same verification but don''t own any failing test stay at

    their pre-verification status.'
  acceptance_criteria:
  - 'File exists: src/blame_cascade.py'
  - 'Function defined: blame_cascade.charge_feature_for_failures'
  - 'pytest: tests/test_blame_cascade.py'
  - 'integration: bob3.verification'
- key: F-R7-422
  title: Parent-gen DB inheritance at seed time
  tier: Core
  priority: medium
  description: 'When spawn_next_generation.sh seeds bob_(N+1), read every

    completed/needs_human/regression feature row from bob_N''s

    bob3.db. Match by spec_slot (F-R7-400). Stamp the matched

    bob_(N+1) row with parent_status, parent_completed_at,

    parent_evidence_hash.'
  acceptance_criteria:
  - 'File exists: src/bob3/parent_gen_inheritance.py'
  - 'Function defined: bob3.parent_gen_inheritance.read_parent_generation_data'
  - 'Function defined: bob3.parent_gen_inheritance.stamp_child_row_with_parent_metadata'
  - 'pytest: tests/test_parent_gen_inheritance.py'
  - 'integration: bob3.spawn_next_generation'
- key: F-R7-430
  title: Bootstrap readiness override — one bypass execute per feature
  tier: Core
  priority: medium
  description: 'Add a per-feature `bootstrap_attempts` counter (default 0,

    max 1). When the readiness gate would block a feature AND

    bootstrap_attempts < 1 AND research_iterations == 0, allow one

    execute pass that bypasses the readiness gate.'
  acceptance_criteria:
  - 'File exists: src/bob60/bootstrap_override.py'
  - 'Function defined: bob60.bootstrap_override.apply_bootstrap_override'
  - 'pytest: tests/test_bootstrap_override.py'
  - 'integration: bob60.feature_gate'
- key: F-R7-440
  title: Stale-bytecode guard at relaunch
  tier: Core
  priority: medium
  description: 'Self-heal compares mtime of every file under

    src/bob*/orchestrator/ against the previous bob_N process''s

    start time. If any orchestrator source file is newer than

    process start, kill+relaunch the process even when the DB

    looks recoverable.'
  acceptance_criteria:
  - 'File exists: src/bob60/orchestrator/stale_bytecode_guard.py'
  - 'Function defined: bob60.orchestrator.stale_bytecode_guard.check_stale_bytecode'
  - 'pytest: tests/test_stale_bytecode_guard.py'
  - 'integration: bob60.orchestrator.self_heal'
- key: F-R7-450
  title: Adversarial spec-critic sub-agent — gate codegen on spec quality
  tier: Core
  priority: medium
  description: 'Dedicated spec-critic sub-agent that runs after the spec-extractor

    and before any implementer fires. Loads a versioned

    spec_constitution.md and emits per-feature structured defects.

    Findings persist to reviews/spec_findings.yaml keyed by spec hash.'
  acceptance_criteria:
  - 'File exists: src/bob60/spec_critic.py'
  - 'Function defined: bob60.spec_critic.SpecCritic'
  - 'File exists: spec_constitution.md'
  - 'File exists: reviews/spec_findings.yaml'
  - 'pytest: tests/test_spec_critic.py'
  - 'integration: bob60.orchestrator'
- key: F-R7-451
  title: Sub-translation provenance — every AC traces to source-intent span
  tier: Core
  priority: medium
  description: 'Each emitted AC must carry a provenance field naming the

    contiguous character spans of the original human intent that

    produced it. CLI `bob spec trace <feature>:<ac>` prints the AC

    alongside its spans. Round-trip coverage of source intent must

    be >=90% of load-bearing tokens.'
  acceptance_criteria:
  - 'File exists: src/bob/provenance.py'
  - 'Function defined: bob.provenance.add_provenance'
  - 'CLI command: spec trace'
  - 'pytest: tests/test_provenance.py'
  - 'integration: bob.spec'
- key: F-R7-452
  title: Design-by-Contract sub-grammar on behavior — pre / post / inv / raises
  tier: Core
  priority: medium
  description: 'Extend the F-R7-412 EARS `behavior:` AC with four optional

    sub-keys: pre (precondition), post (postcondition), inv

    (invariant), raises (declared exception types). Codegen emits

    matching icontract decorators; verifier runs them during pytest.

    Pre violations charge the caller, post violations charge the

    implementer.'
  acceptance_criteria:
  - 'File exists: src/bob60/behavior_contract.py'
  - 'Function defined: bob60.behavior_contract.apply_icontract_decorators'
  - 'pytest: tests/test_behavior_contract.py'
  - 'integration: bob60.codegen'
- key: F-R7-453
  title: Key-examples / property-based AC variant
  tier: Core
  priority: medium
  description: 'Add a seventh AC grammar `property: <name> for <generator>

    assert <predicate>` and a `key_example:` sub-key on behavior

    ACs. Codegen uses them as few-shot context; verifier emits one

    Hypothesis test per property and one parametrized pytest per

    key_example with seed=0. Boundary examples are required for any

    AC involving data transformation or numeric range.'
  acceptance_criteria:
  - 'File exists: src/bob60/ac_grammar.py'
  - 'Function defined: bob60.ac_grammar.parse_property_ac'
  - 'Function defined: bob60.ac_grammar.parse_key_example_ac'
  - 'File exists: src/bob60/codegen.py'
  - 'File exists: src/bob60/verifier.py'
  - 'pytest: tests/test_ac_grammar_property.py'
  - 'pytest: tests/test_ac_grammar_key_example.py'
  - 'pytest: tests/test_verifier_hypothesis.py'
  - 'pytest: tests/test_verifier_parametrized.py'
  - 'integration: bob60.behavior'
- key: F-R7-454
  title: Test-writer sub-agent — failing tests before implementer fires
  tier: Core
  priority: medium
  description: 'Insert a test-writer sub-agent between spec-critic (F-R7-450)

    and the implementer. Emits one failing pytest per AC ID under

    tests/<feature_id>/test_<ac_id>.py. The TestGen-LLM

    Build/Pass/Coverage triple filter rejects tests that don''t

    compile, mysteriously pass on stub code, or fail to raise

    coverage of the AC-named region.'
  acceptance_criteria:
  - 'File exists: tests/test_writer_sub_agent/test_ac_1.py'
  - 'File exists: tests/test_writer_sub_agent/test_ac_2.py'
  - 'pytest: tests/test_writer_sub_agent/'
  - 'Function defined: bob3.test_writer.emit_failing_tests'
  - 'integration: bob3.spec_critic'
- key: F-R7-455
  title: Full 22-smell linter extension to F-R7-410
  tier: Core
  priority: medium
  description: 'Replace F-R7-410''s small regex rule set with the 22-detector

    catalogue (Femmer/Smella + 2025 LLM extensions). Severities

    E/W/I; E-severity smells block `bob3 plan --create`. spaCy is

    a new dependency used by 7 of the 22 detectors.'
  acceptance_criteria:
  - 'File exists: src/bob3/linter_22smell.py'
  - 'Function defined: bob3.linter_22smell.detect_smells'
  - 'pytest: tests/test_linter_22smell.py'
  - 'CLI command: bob3 plan --create'
  - 'integration: bob3.planner'
- key: F-R7-456
  title: Structured-uncertainty clarification loop with AskUserQuestion
  tier: Core
  priority: medium
  description: 'Generate N=3 candidate stub implementations from the draft spec;

    if they disagree on observable behaviour, mark the relevant slot

    ambiguous. Slots above uncertainty threshold T=0.4 trigger a

    batched (1-5 per round) multiple-choice question citing

    provenance. In CI mode with no human present, exit

    SPEC_NEEDS_HUMAN rather than confabulate.'
  acceptance_criteria:
  - 'File exists: src/spec_synthesis/uncertainty_clarification.py'
  - 'Function defined: spec_synthesis.uncertainty_clarification.generate_candidate_stubs'
  - 'Function defined: spec_synthesis.uncertainty_clarification.mark_ambiguous_slots'
  - 'Function defined: spec_synthesis.uncertainty_clarification.trigger_clarification_questions'
  - 'pytest: tests/test_uncertainty_clarification.py'
  - 'integration: spec_synthesis.spec_generator'
- key: F-R7-457
  title: Schema-constrained spec emission — eliminate parse-failure retries
  tier: Core
  priority: medium
  description: 'Replace post-hoc JSON validation with constrained decoding via

    pinned schemas/spec.v1.json (Anthropic tool-use input_schema or

    Outlines logit masking). Specs that fail validation are REJECTED

    with an explicit error — never silently coerced. Schema mandates

    every PRD slot the critic grades.'
  acceptance_criteria:
  - 'File exists: src/bob60/schema_constrained_spec.py'
  - 'Function defined: bob60.schema_constrained_spec.emit_spec_with_schema'
  - 'Function defined: bob60.schema_constrained_spec.validate_spec_against_schema'
  - 'pytest: tests/test_schema_constrained_spec.py'
  - 'integration: bob60.critic'
- key: F-R7-458
  title: Regression attribution requires test-ownership map (no scapegoats)
  tier: Core
  priority: medium
  description: 'In bob10/bob11, db.detect_regression() picks "the first completed

    feature that isn''t the causing feature" as the blame target when

    newly-failing tests cannot be mapped to an owner. Every feature

    MUST declare which test files it owns; demotion to regression

    MUST require evidence that the feature''s own tests newly fail.'
  acceptance_criteria:
  - 'File exists: src/bob10/test_ownership_map.py'
  - 'Function defined: bob10.test_ownership_map.load_ownership_map'
  - 'Function defined: bob10.detect_regression.validate_test_ownership'
  - 'pytest: tests/test_regression_attribution.py'
  - 'integration: bob10.detect_regression'
- key: F-R7-459
  title: Stable baseline gate — abort verifier if collection fails
  tier: Core
  priority: medium
  description: 'bob11 baseline has test files with ImportError at collection.

    When baseline pytest crashes at collection, the "before"

    snapshot is invalid; any "after" diff fabricates regressions.

    Verifier MUST refuse to capture a baseline unless the suite

    collects cleanly.'
  acceptance_criteria:
  - 'Function defined: bob60.verifier.abort_on_collection_failure'
  - 'pytest: tests/test_baseline_gate.py'
  - 'integration: bob60.verifier'
- key: F-R7-460
  title: Deterministic pytest snapshots — disable xdist early-halt
  tier: Core
  priority: medium
  description: 'pytest with xdist halts after ~20-25 failures non-deterministically.

    Before/after snapshots end up containing different subsets. Snapshot

    path MUST run pytest with --maxfail=0; if xdist is used,

    --maxfail=0 MUST be enforced at the snapshot boundary.'
  acceptance_criteria:
  - 'pytest: tests/test_snapshot.py'
  - 'Function defined: pytest_snapshot.enforce_maxfail_with_xdist'
  - 'integration: pytest'
- key: F-R7-461
  title: bob3 init re-run after spawn fixes stale project metadata
  tier: Core
  priority: medium
  description: 'spawn_next_generation.sh does not re-run `bob3 init` after rsync,

    so projects.name still shows the old gen and spec_path points to

    a pytest tmpdir leak. Either fix spawn_next_generation.sh to

    re-init, or add a startup check in run_loop that verifies

    projects.name matches workspace dir basename.'
  acceptance_criteria:
  - 'File exists: tests/test_spawn_next_generation.py'
  - 'pytest: tests/test_spawn_next_generation.py'
  - 'Function defined: bob3.spawn.verify_project_metadata'
  - 'integration: bob3.run_loop'
- key: F-R7-463
  title: Devin-style editable plan.yaml gate before any implementer fires
  tier: Core
  priority: medium
  description: 'After F-R7-450 spec-critic passes, write specs/<feature>/plan.yaml

    and emit a PLAN_READY event. Implementer sub-agents refuse to

    start unless plan.yaml.approved is true. Edits to plan.yaml

    re-trigger F-R7-450 critic incrementally via F-R7-451 provenance.'
  acceptance_criteria:
  - 'File exists: specs/<feature>/plan.yaml'
  - 'Function defined: plan_gate.check_plan_approved'
  - 'pytest: tests/test_plan_gate.py'
  - 'integration: implementer'
- key: F-R7-464
  title: Persistent spec-critic findings registry with regression detection
  tier: Core
  priority: medium
  description: 'F-R7-450 critic writes findings to reviews/spec_findings.yaml

    keyed by (spec_hash, slot_id, defect_type). On re-run with same

    defect at same slot, critic flags REGRESSION and escalates

    severity. Halt-gate fires if critic_repeat_rate > 0.30 over 3 runs.'
  acceptance_criteria:
  - 'File exists: reviews/spec_findings.yaml'
  - 'Function defined: spec_critic.registry.write_findings'
  - 'Function defined: spec_critic.registry.detect_regression'
  - 'pytest: tests/test_spec_findings_registry.py'
  - 'integration: spec_critic.critic'
- key: F-R7-465
  title: Composite spec_quality_score (8 sub-metrics, geometric mean, 0.65/0.80 gate)
  tier: Core
  priority: medium
  description: 'Replaces F-R7-413 placeholder with weighted geometric mean of 8

    sub-metrics: smell_density (0.20), predicate_coverage (0.20),

    contract_completeness (0.15), boundary_coverage (0.10),

    error_path_coverage (0.10), traceability (0.10),

    spec_executability (0.10), ac_atomicity (0.05). Score < 0.65

    refuses plan --create; 0.65-0.80 warns; >= 0.80 green.'
  acceptance_criteria:
  - 'File exists: src/bob60/spec_quality_score.py'
  - 'Function defined: bob60.spec_quality_score.calculate_composite_score'
  - 'Function defined: bob60.spec_quality_score.assess_quality_gate'
  - 'pytest: tests/test_spec_quality_score.py'
  - 'integration: bob60.plan'
- key: F-R7-466
  title: Bidirectional Requirements Traceability Matrix (RTM) artifact
  tier: Core
  priority: medium
  description: 'Forward (AC -> test -> code-region) and backward (code-region

    -> AC) traceability as a first-class artifact. tools/spec_coverage.py

    emits rtm.json and rtm.html. spec_coverage_pct halt-gate at 0.80.

    New functions in a commit without an AC link are flagged

    untraced_implementation.'
  acceptance_criteria:
  - 'File exists: tools/spec_coverage.py'
  - 'Function defined: spec_coverage.emit_rtm'
  - 'File exists: rtm.json'
  - 'File exists: rtm.html'
  - 'pytest: tests/test_spec_coverage.py'
  - 'CLI command: spec_coverage'
  - 'integration: spec_coverage'
- key: F-R7-467
  title: Spec self-consistency — N-sample stability check pre-critic
  tier: Core
  priority: medium
  description: 'Run the spec extractor N=3 times in parallel with different

    temperature/seeds. Normalize variants and compute Jaccard

    stability_score. < 0.7 routes to F-R7-456 clarification with

    disagreeing slots cited. >= 0.9 auto-accepts majority vote with

    consensus:true.'
  acceptance_criteria:
  - 'File exists: src/spec_synthesis/stability_check.py'
  - 'Function defined: spec_synthesis.stability_check.run_parallel_extraction'
  - 'Function defined: spec_synthesis.stability_check.compute_jaccard_score'
  - 'pytest: tests/test_stability_check.py'
  - 'integration: spec_synthesis.extractor'
- key: F-R7-468
  title: Auto-repair of smelly ACs with semantic-equivalence verification
  tier: Core
  priority: medium
  description: 'Per-smell, linter emits suggested_rewrite. A semantic-equivalence

    check feeds original + rewrite to a separate LLM judge; if it

    cannot infer they impose the same observable constraint, reject

    the rewrite. ERROR-severity rewrites that pass equivalence

    auto-apply. Per-feature opt-out via auto_repair:false.'
  acceptance_criteria:
  - 'File exists: src/linter/auto_repair.py'
  - 'Function defined: linter.auto_repair.semantic_equivalence_check'
  - 'Function defined: linter.auto_repair.apply_error_severity_rewrites'
  - 'pytest: tests/test_auto_repair.py'
  - 'integration: linter.engine'
- key: F-R7-462
  title: CodeT mutual-agreement triangulation (KxK code-test matrix)
  tier: Core
  priority: medium
  description: 'F-R7-454 commits to one test-writer pass. CodeT''s stronger pattern

    (ICLR 2023): spawn K candidate test sets and K candidate impls,

    then score each (code, test) cell of the KxK matrix by

    mutual-agreement. Removes the failure mode where a single bad

    test rubber-stamps a single bad implementation.


    Combined with TestGen-LLM''s Build/Pass/Coverage triple filter,

    this is the cheapest known guard against AI-judge sycophancy

    that recursive bob3 has documented for over a year.


    Source: Agent 4 Section 9 (CodeT, ICLR 2023; TestGen-LLM).'
  acceptance_criteria:
  - 'File exists: src/bob3/codet_matrix.py'
  - 'Function defined: bob3.codet_matrix.mutual_agreement_score'
  - 'Function defined: bob3.codet_matrix.spawn_k_candidates'
  - 'pytest: tests/test_codet_matrix.py'
  - 'integration: bob3.orchestrator'
- key: F-R7-469
  title: Self-Discover meta-agent for per-feature spec-section selection
  tier: Core
  priority: medium
  description: 'bob3''s PRD schema (F-R7-457) is fixed: every spec must fill every

    slot. A meta-agent that first picks WHICH spec sections matter,

    then drives a focused extractor pass, beats one-size-fits-all.


    Source: Agent 4 Section 7 (Self-Discover, ICML 2024).'
  acceptance_criteria:
  - 'File exists: src/bob3/self_discover_meta_agent.py'
  - 'Function defined: bob3.self_discover_meta_agent.select_spec_sections'
  - 'Function defined: bob3.self_discover_meta_agent.run_focused_extractor'
  - 'pytest: tests/test_self_discover_meta_agent.py'
  - 'integration: bob3.spec_processor'
- key: F-R7-470
  title: Python-based convergence checker with non-empty + name-based comparison
  tier: Core
  priority: medium
  description: 'On 2026-05-23 the bob3 chain silent-exited the weekend_watchdog

    three times. Root cause: shell-out to sqlite3 (not installed),

    empty results tripped false-positive convergence; secondary bug

    was comparing UUID id instead of name. Replace shell-out with

    python module using stdlib sqlite3.'
  acceptance_criteria:
  - 'File exists: src/bob3/convergence_checker.py'
  - 'Function defined: bob3.convergence_checker.check_convergence'
  - 'pytest: tests/test_convergence_checker.py'
  - 'integration: bob3.weekend_watchdog'
- key: F-R7-471
  title: Stuck-readiness decomposition trigger — kill the eval-demotion treadmill
  tier: Core
  priority: medium
  description: 'If a feature has refinement_attempts >= 2 AND readiness_score

    < 0.80 AND no_readiness_improvement_this_attempt, mark

    pending_decomposition instead of re-executing. Decomposition

    produces sub-features; the parent re-enters ready only once

    each sub-feature passes its own gate.'
  acceptance_criteria:
  - 'File exists: src/bob60/decomposition.py'
  - 'Function defined: bob60.decomposition.should_decompose'
  - 'Function defined: bob60.decomposition.decompose_feature'
  - 'pytest: tests/test_decomposition.py'
  - 'integration: bob60.refiner'
- key: F-R7-472
  title: AC artifact-existence verifier — refuse to pass AC when referenced files are missing
  tier: Core
  priority: medium
  description: 'Pre-pytest pass MUST verify that every AC of the form

    `pytest: <path>`, `File exists: <path>`, `File modified: <path>`,

    or `Function defined: <module>.<symbol>` resolves to an actual

    artifact. Missing artifact -> AC fails with reason

    ARTIFACT_MISSING:<path>, never swallowed as a generic pytest

    exit code.'
  acceptance_criteria:
  - 'File exists: src/bob60/ac_verifier.py'
  - 'Function defined: bob60.ac_verifier.verify_artifacts'
  - 'pytest: tests/test_ac_verifier.py'
  - 'integration: bob60.pytest_plugin'
- key: F-R7-473
  title: Environment-capability preflight with research-driven workaround discovery
  tier: Core
  priority: medium
  description: 'At spec-load, enumerate every external dependency. Probe each

    via `command -v` for CLIs and `python3 -c "import X"` for modules.

    For each MISSING dep, spawn a research sub-agent that surfaces a

