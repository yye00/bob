- key: F-R7-613
  title: Sub-agent startup-crash exempt from retry budget — closes 5-gen chronic F-R7-597 NH
  tier: Core
  priority: high
  description: "F-R7-597 + F-R7-607 hoist MCP-transient classifier above\ngit-hook-rejection demotion.\
    \ F-R7-612 promotes-on-disk\nwhen verification fails but ACs satisfy. Five consecutive\ngenerations\
    \ (v.35, v.37, v.38, v.39, v.40) STILL show\nthe same chronic NH on the same feature class: F-R7-597\n\
    ordering fix itself.\n\nRoot cause traced from v.38/v.39/v.40 logs (same UUID-class\nfeature, same\
    \ crash signature each time):\n\n- Test_writer emits 6-14 failing tests (normal).\n- Sub-agent spawns,\
    \ accumulates 4000-5000 work_events\n  over 15-20 minutes, MCP transport fails mid-task\n  (self-signed\
    \ cert chain on github plugin, evaluator\n  connection reset), sub-agent throws Exception with\n \
    \ exit code 1 BEFORE writing any persistent implementation\n  artifact to the workspace src/ tree.\n\
    - F-R6-300 mid_work_crash classifier sees work_events > 0\n  and DOES charge a retry — \"this is NOT\
    \ a free retry\"\n  per its own log message.\n- F-R7-612 disk_reconciler doesn't promote because the\n\
    \  structural marker (literal 'F-R7-597' string in\n  src/bob3/run_loop.py) was never persisted.\n\
    - Feature exhausts 5/5 retries on the same crash mode,\n  flips to needs_human, blocks chain drain.\n\
    \nDistinction this fix introduces: separate the \"did the\nsub-agent perform reasoning work (4000+\
    \ events)\" signal\nfrom the \"did the sub-agent persist any code-fix artifact\nto disk\" signal.\
    \ Mid_work_crash with NO persistent\nartifact is fundamentally different from mid_work_crash\nWITH\
    \ a persistent artifact — the former produced nothing\nretry-able; the latter produced a partial fix\
    \ worth\niterating on.\n\nImplementation in src/bob3/run_loop.py, inside the\nmid_work_crash branch\
    \ (the one that calls F-R6-300's\ncharge_refinement_attempt):\n\n1. After classification but BEFORE\
    \ incrementing the retry\n   counter, compute persisted_artifact_count by globbing\n   workspace_dir/src/**/*.py\
    \ modified after spawn_ts.\n2. If persisted_artifact_count == 0 AND the exit_signature\n   matches\
    \ transport-transient regex (compiled from\n   literals: \"Command failed with exit code 1\",\n  \
    \ \"MCP server.*Connection failed\",\n   \"self signed certificate\", \"ConnectionResetError\",\n\
    \   \"ReadTimeout\", \"broken pipe\"), branch to a new\n   SUBAGENT_STARTUP_CRASH classification.\n\
    3. SUBAGENT_STARTUP_CRASH path: reset feature.status to\n   'ready', do NOT increment retry_counter,\
    \ apply 60s\n   exponential backoff per attempt (60, 120, 240, 480, ...),\n   emit telemetry event\
    \ SUBAGENT_STARTUP_CRASH_EXEMPT with\n   feature_id, error_pattern matched, retry_counter_preserved,\n\
    \   persisted_artifact_count, exit_signature_excerpt.\n4. Lifetime cap: track exempt_count in feature.metadata.\n\
    \   After 10 lifetime exemptions, fall through to the\n   original retry-increment path. Emit\n  \
    \ SUBAGENT_STARTUP_CRASH_EXEMPT_CAPPED at the cap.\n\nWorktree note: also check\nbob_root/.worktrees/hotfix-*/src/bob3/\
    \ for persisted\nartifacts since some sub-agents write to worktrees rather\nthan the primary src tree.\n\
    \nWhy permanent_forward_carry: F-R7-597 / F-R7-607 / F-R7-612\nhave each proved that fixing the verification\
    \ or\nclassification path alone doesn't stop this defect class.\nThe retry-budget accounting itself\
    \ is the remaining attack\nsurface — five generations of features die from upstream\ntransport crashes\
    \ they didn't cause and were never given\na fair retry on."
  acceptance_criteria:
  - 'File exists: src/bob3/run_loop.py'
  - 'Function defined: bob3.run_loop.classify_startup_crash'
  - 'Function defined: bob3.run_loop.compute_persisted_artifact_count'
  - 'pytest: tests/test_run_loop.py::test_subagent_startup_crash_exempt_no_artifacts'
  - 'pytest: tests/test_run_loop.py::test_subagent_startup_crash_with_artifacts_increments_retry'
  - 'pytest: tests/test_run_loop.py::test_subagent_startup_crash_exempt_lifetime_cap'
  - 'integration: bob3.cli'
  permanent_forward_carry: true
