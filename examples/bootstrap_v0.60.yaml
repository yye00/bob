- key: F-R7-601
  title: BF-6 — Characterization AC kind (approval-test diffs for legacy code)
  tier: Core
  priority: high
  description: "Feathers/Michael Hill \"characterization tests\" pattern. When\nbob3 edits brownfield\
    \ code without existing tests, it must first\npin down current behavior as approval-file snapshots,\
    \ THEN make\nchanges, THEN compare. Otherwise it cannot tell whether its edit\nregressed unspecified\
    \ behavior.\n\nConcrete:\n  1. New AC kind 'characterization' in src/bob3/acceptance/kinds.py\n  2.\
    \ AC body shape:\n       characterization:\n         target: src/foo/bar.py::Bar.method\n        \
    \ sample_inputs: [<list of literal call args> or 'auto']\n         snapshot_dir: tests/snapshots/F-R7-601/\n\
    \  3. Observer phase (runs BEFORE implementer subagent):\n     - Spin observe-only subagent that calls\
    \ target with sample_inputs\n       and writes captured outputs (stdout, return value, side-effects\n\
    \       on FS within workspace) to snapshot_dir/*.txt\n  4. Implementer phase: write the change as\
    \ usual.\n  5. Verifier phase: re-run target with same sample_inputs, diff\n     against snapshot_dir.\
    \ Any diff → AC fails unless the diff is\n     in the explicit allow_changes glob.\n  6. disk_reconciler\
    \ extension: snapshot files count as\n     AC-satisfaction artifacts.\n\nWhy this matters: without\
    \ it, brownfield edits to untested code\nsilently regress and the only signal is downstream user pain."
