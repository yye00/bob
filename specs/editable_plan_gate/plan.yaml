  \ is true. Edits to plan.yaml re-trigger F-R7-450 critic incrementally via F-R7-451\
  \ provenance."
acceptance_criteria:
- 'File exists: specs/editable_plan_gate/plan.yaml'
- 'Function defined: bob.spec_synthesis.emit_plan_ready_event'
- 'Function defined: bob.implementer.check_plan_approval'
- 'Function defined: bob.plan_editor.handle_plan_edits'
- 'pytest: tests/test_editable_plan_gate.py'
- 'integration: bob.orchestrator'
- "pytest: tests/test_devin_style_editable_plan_yaml_gate_before_any_imp_boundary.py\
  \ — empty, zero, or minimum input returns a well-defined result rather than\
  \ raising (boundary case)"
- "pytest: tests/test_devin_style_editable_plan_yaml_gate_before_any_imp_error.py\
  \ — invalid input raises ValueError and the function does not silently succeed\
  \ (error path)"
